                <!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>J.A.R.V.I.S. · ИИ-ассистент</title>
    <!-- Font Awesome 6 (free) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #0b0e1a 0%, #141a2b 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .jarvis-card {
            max-width: 720px;
            width: 100%;
            background: rgba(20, 28, 50, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 32px 28px 40px;
            box-shadow: 0 25px 50px -8px rgba(0, 0, 0, 0.8), inset 0 0 0 1px rgba(255, 255, 255, 0.06);
            transition: all 0.2s ease;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo i {
            font-size: 2.2rem;
            color: #4fc3f7;
            filter: drop-shadow(0 0 8px rgba(79, 195, 247, 0.4));
        }

        .logo h1 {
            font-weight: 500;
            font-size: 1.6rem;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #e0f2fe, #b2ebf2);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .status-badge {
            background: rgba(79, 195, 247, 0.12);
            padding: 8px 16px;
            border-radius: 60px;
            font-size: 0.75rem;
            font-weight: 500;
            color: #81d4fa;
            border: 1px solid rgba(79, 195, 247, 0.2);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .status-badge i {
            font-size: 0.7rem;
            color: #4fc3f7;
        }

        .avatar-section {
            display: flex;
            justify-content: center;
            margin: 16px 0 18px;
        }

        .avatar {
            width: 100px;
            height: 100px;
            background: radial-gradient(circle at 30% 30%, #1f334f, #0e1629);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.8), 0 0 0 2px rgba(79, 195, 247, 0.15);
            transition: 0.3s;
        }

        .avatar i {
            font-size: 4rem;
            color: #b0d9f5;
            filter: drop-shadow(0 0 12px #4fc3f766);
        }

        .avatar.active {
            box-shadow: 0 0 0 4px #4fc3f7, 0 10px 30px -5px #4fc3f755;
        }

        .conversation {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 28px;
            padding: 20px 18px;
            margin: 12px 0 24px;
            min-height: 140px;
            max-height: 260px;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.03);
            box-shadow: inset 0 6px 12px rgba(0, 0, 0, 0.3);
            scroll-behavior: smooth;
        }

        .conversation::-webkit-scrollbar {
            width: 4px;
        }

        .conversation::-webkit-scrollbar-track {
            background: transparent;
        }

        .conversation::-webkit-scrollbar-thumb {
            background: #4fc3f766;
            border-radius: 12px;
        }

        .message {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 14px;
            animation: fadeSlide 0.25s ease;
        }

        .message .icon {
            width: 30px;
            height: 30px;
            background: #1f2b40;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 0.9rem;
            color: #b0d9f5;
        }

        .message.user .icon {
            background: #2a3a5a;
            color: #f0f9ff;
        }

        .message .bubble {
            background: rgba(255, 255, 255, 0.04);
            padding: 10px 16px;
            border-radius: 18px 18px 18px 4px;
            font-size: 0.95rem;
            line-height: 1.5;
            color: #e3edf7;
            word-break: break-word;
            border: 1px solid rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(4px);
            max-width: 90%;
        }

        .message.user .bubble {
            background: #1f334f;
            border-radius: 18px 18px 4px 18px;
            border-color: #2e4a6b;
        }

        .message .bubble .timestamp {
            font-size: 0.6rem;
            opacity: 0.5;
            margin-left: 12px;
        }

        .controls {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 6px;
        }

        .btn {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 14px 20px;
            border-radius: 60px;
            color: #d4e6f5;
            font-size: 1rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: 0.2s;
            backdrop-filter: blur(6px);
            flex: 1 1 auto;
            justify-content: center;
            min-width: 120px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .btn i {
            font-size: 1.2rem;
        }

        .btn:hover {
            background: rgba(79, 195, 247, 0.08);
            border-color: #4fc3f766;
            transform: scale(1.02);
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-primary {
            background: #1f3a5a;
            border-color: #4fc3f744;
            color: #e6f3ff;
        }

        .btn-primary i {
            color: #81d4fa;
        }

        .btn-primary:hover {
            background: #254b72;
            border-color: #4fc3f7aa;
        }

        .btn-primary:disabled {
            opacity: 0.4;
            pointer-events: none;
            filter: grayscale(0.6);
        }

        .btn-outline {
            background: transparent;
            border-color: #2a4060;
        }

        .btn-outline:hover {
            background: #1a2a44;
        }

        .footer-info {
            margin-top: 28px;
            display: flex;
            justify-content: center;
            font-size: 0.7rem;
            color: #5b7290;
            letter-spacing: 0.3px;
            gap: 20px;
            flex-wrap: wrap;
        }

        .footer-info span i {
            margin-right: 6px;
            color: #4fc3f788;
        }

        @keyframes fadeSlide {
            0% { opacity: 0; transform: translateY(6px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* adaptive */
        @media (max-width: 500px) {
            .jarvis-card { padding: 24px 16px; }
            .logo h1 { font-size: 1.2rem; }
            .btn { padding: 12px 14px; min-width: 100px; font-size: 0.9rem; }
        }
    </style>
</head>
<body>
    <div class="jarvis-card" role="main">
        <div class="header">
            <div class="logo">
                <i class="fas fa-robot"></i>
                <h1>JARVIS</h1>
            </div>
            <div class="status-badge" id="statusBadge">
                <i class="fas fa-circle" style="color: #4fc3f7;"></i>
                <span id="statusText">активен</span>
            </div>
        </div>

        <div class="avatar-section">
            <div class="avatar" id="avatarIcon">
                <i class="fas fa-microchip"></i>
            </div>
        </div>

        <!-- Диалоговое окно -->
        <div class="conversation" id="conversationBox">
            <div class="message jarvis">
                <div class="icon"><i class="fas fa-robot"></i></div>
                <div class="bubble">
                    Привет, я JARVIS. Спроси меня о чём угодно, или нажми на микрофон.
                    <span class="timestamp">сейчас</span>
                </div>
            </div>
        </div>

        <!-- Панель управления -->
        <div class="controls">
            <button class="btn btn-primary" id="micButton">
                <i class="fas fa-microphone"></i> <span id="micLabel">Голос</span>
            </button>
            <button class="btn btn-outline" id="searchButton">
                <i class="fas fa-globe"></i> Поиск
            </button>
            <button class="btn btn-outline" id="clearButton">
                <i class="fas fa-eraser"></i> Очистить
            </button>
        </div>

        <div class="footer-info">
            <span><i class="fas fa-wifi"></i> всегда онлайн</span>
            <span><i class="fas fa-brain"></i> самообучение</span>
            <span><i class="fas fa-microphone-alt"></i> голосовой ввод</span>
        </div>
    </div>

    <script>
        (function() {
            "use strict";

            // ------------------- ЭЛЕМЕНТЫ --------------------
            const conversationBox = document.getElementById('conversationBox');
            const micButton = document.getElementById('micButton');
            const micLabel = document.getElementById('micLabel');
            const searchButton = document.getElementById('searchButton');
            const clearButton = document.getElementById('clearButton');
            const statusText = document.getElementById('statusText');
            const avatarIcon = document.getElementById('avatarIcon');

            // Состояние
            let isListening = false;
            let recognition = null;
            let silenceTimer = null;

            // ------------------- ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ --------------------
            function addMessage(sender, text, isUser = false) {
                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${isUser ? 'user' : 'jarvis'}`;

                const icon = document.createElement('div');
                icon.className = 'icon';
                icon.innerHTML = isUser ? '<i class="fas fa-user"></i>' : '<i class="fas fa-robot"></i>';

                const bubble = document.createElement('div');
                bubble.className = 'bubble';
                const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                bubble.innerHTML = `${text} <span class="timestamp">${time}</span>`;

                messageDiv.appendChild(icon);
                messageDiv.appendChild(bubble);
                conversationBox.appendChild(messageDiv);
                conversationBox.scrollTop = conversationBox.scrollHeight;
            }

            // Эмуляция "развития" – JARVIS запоминает факты
            let memory = [];

            function jarvisThink(promptText) {
                // 1. Эмулируем обработку и “развитие” — сохраняем запрос в память
                memory.push(promptText);
                // 2. Генерируем ответ в зависимости от контекста (и немного "самообучения")
                let reply = '';

                const lower = promptText.toLowerCase();

                if (lower.includes('привет') || lower.includes('здравствуй')) {
                    reply = 'Здравствуйте! Рад вас слышать. Чем могу помочь?';
                } else if (lower.includes('как дела') || lower.includes('как ты')) {
                    reply = 'Функционирую отлично. Благодаря вашим вопросам я учусь лучше.';
                } else if (lower.includes('имя') || lower.includes('зовут')) {
                    reply = 'Меня зовут JARVIS. Я ваш персональный ИИ-ассистент.';
                } else if (lower.includes('погода')) {
                    reply = 'Я не имею доступа к реальным данным о погоде, но могу сказать, что сегодня отличный день для обучения!';
                } else if (lower.includes('поиск') || lower.includes('найди')) {
                    reply = 'Я могу эмулировать поиск в интернете. Попробуйте сказать "найди что-нибудь о ..."';
                } else if (lower.includes('спасибо') || lower.includes('благодарю')) {
                    reply = 'Всегда рад помочь. Обращайтесь ещё!';
                } else if (lower.includes('развивайся') || lower.includes('учись')) {
                    reply = 'Я запоминаю каждое взаимодействие. Спасибо, что помогаете мне развиваться!';
                } else {
                    // Эмуляция "поиска в интернете" – просто генерируем осмысленный ответ
                    const randomFact = [
                        'Интересный вопрос. Я нашёл в сети несколько статей на эту тему.',
                        'Согласно открытым источникам, это очень актуальная тема.',
                        'Мои алгоритмы обработали запрос. Рекомендую уточнить детали.',
                        'Я проанализировал информацию. Возможно, вам пригодятся дополнительные данные.'
                    ];
                    reply = `${randomFact[Math.floor(Math.random() * randomFact.length)]} (эмуляция поиска)`;
                }

                // Добавляем намёк на "развитие" — иногда упоминаем память
                if (memory.length > 2 && Math.random() > 0.6) {
                    reply += ` Я запомнил ${memory.length} ваших запросов.`;
                }

                return reply;
            }

            // Эмуляция поиска в интернете (выдаём "результат" + развитие)
            function emulateSearch(query) {
                if (!query || query.trim().length === 0) {
                    return 'Что именно вы хотите найти? Произнесите или напишите запрос.';
                }
                // Имитация поисковой выдачи
                const responses = [
                    `По запросу "${query}" найдено несколько результатов. Первая ссылка: example.com/результат`,
                    `В интернете есть информация о "${query}". Рекомендую посетить википедию.`,
                    `Я эмулирую поиск: по теме "${query}" есть 3 статьи на русском языке.`,
                    `Похоже, что "${query}" — популярный запрос. Вот что я нашёл в своей базе знаний.`
                ];
                const reply = responses[Math.floor(Math.random() * responses.length)];
                // Запоминаем как "развитие"
                memory.push(`поиск: ${query}`);
                return reply;
            }

            // ------------------- РАСПОЗНАВАНИЕ РЕЧИ --------------------
            function initSpeech() {
                if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                    alert('Ваш браузер не поддерживает голосовой ввод. Используйте Chrome или Edge.');
                    micButton.disabled = true;
                    micLabel.textContent = 'Недоступно';
                    return null;
                }

                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                const rec = new SpeechRecognition();
                rec.lang = 'ru-RU';
                rec.continuous = false;   // останавливаемся после паузы
                rec.interimResults = false;
                rec.maxAlternatives = 1;

                rec.onstart = function() {
                    isListening = true;
                    micLabel.textContent = 'Слушаю...';
                    micButton.classList.add('btn-primary');
                    micButton.style.background = '#1f4a6b';
                    statusText.textContent = 'слушает';
                    avatarIcon.classList.add('active');
                    // Таймер тишины (если ничего не сказано)
                    if (silenceTimer) clearTimeout(silenceTimer);
                    silenceTimer = setTimeout(() => {
                        if (isListening) {
                            rec.stop();
                            addMessage('jarvis', 'Я не услышал голоса. Попробуйте ещё раз.', false);
                            resetMicUI();
                        }
                    }, 7000);
                };

                rec.onresult = function(event) {
                    if (silenceTimer) clearTimeout(silenceTimer);
                    const last = event.results.length - 1;
                    const transcript = event.results[last][0].transcript.trim();
                    if (transcript.length > 0) {
                        addMessage('user', transcript, true);
                        // JARVIS обрабатывает запрос
                        const answer = jarvisThink(transcript);
                        addMessage('jarvis', answer, false);
                    } else {
                        addMessage('jarvis', 'Не удалось распознать речь.', false);
                    }
                    resetMicUI();
                    rec.stop();
                };

                rec.onerror = function(event) {
                    if (silenceTimer) clearTimeout(silenceTimer);
                    let errorMsg = 'Ошибка распознавания.';
                    if (event.error === 'not-allowed') errorMsg = 'Доступ к микрофону запрещён.';
                    else if (event.error === 'audio-capture') errorMsg = 'Микрофон не найден.';
                    else if (event.error === 'no-speech') errorMsg = 'Речь не обнаружена.';
                    addMessage('jarvis', errorMsg, false);
                    resetMicUI();
                    rec.stop();
                };

                rec.onend = function() {
                    resetMicUI();
                };

                return rec;
            }

            function resetMicUI() {
                isListening = false;
                micLabel.textContent = 'Голос';
                micButton.style.background = '';
                statusText.textContent = 'активен';
                avatarIcon.classList.remove('active');
                if (silenceTimer) {
                    clearTimeout(silenceTimer);
                    silenceTimer = null;
                }
            }

            // ------------------- ИНИЦИАЛИЗАЦИЯ --------------------
            recognition = initSpeech();

            // ------------------- ОБРАБОТЧИКИ --------------------
            // Микрофон
            micButton.addEventListener('click', function() {
                if (!recognition) {
                    alert('Голосовой ввод не поддерживается.');
                    return;
                }
                if (isListening) {
                    recognition.stop();
                    resetMicUI();
                    return;
                }
                try {
                    recognition.start();
                } catch (e) {
                    // если уже запущен, остановим и запустим заново
                    recognition.stop();
                    setTimeout(() => {
                        recognition.start();
                    }, 200);
                }
            });

            // Поиск (эмуляция)
            searchButton.addEventListener('click', function() {
                // Просим пользователя ввести запрос
                const query = prompt('Введите поисковый запрос для JARVIS:');
                if (query === null || query.trim() === '') {
                    addMessage('jarvis', 'Поиск отменён.', false);
                    return;
                }
                addMessage('user', `🔍 ${query}`, true);
                const result = emulateSearch(query);
                addMessage('jarvis', result, false);
                // Развитие: добавляем в память
                memory.push(`поисковый запрос: ${query}`);
            });

            // Очистить историю (но не память развития)
            clearButton.addEventListener('click', function() {
                conversationBox.innerHTML = '';
                addMessage('jarvis', 'История очищена. Я продолжаю развиваться.', false);
                // Не удаляем память, чтобы сохранить "развитие"
            });

            // Сообщаем о старте
            setTimeout(() => {
                addMessage('jarvis', 'Я готов. Вы можете задавать вопросы или использовать голос.', false);
            }, 400);

            // Дополнительно: если пользователь кликает по аватару — эхо-состояние
            document.querySelector('.avatar')?.addEventListener('click', function() {
                addMessage('jarvis', 'Я здесь. Чем могу помочь?', false);
            });

            // обработка ввода с клавиатуры (для удобства)
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && e.ctrlKey) {
                    // ctrl+enter = микрофон
                    micButton.click();
                }
            });

            console.log('JARVIS инициализирован. Память:', memory);
        })();
    </script>
</body>
        </html>
