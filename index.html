<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Standoff Mobile Web</title>
    <style>
        /* Сброс и базовые настройки для мобилок */
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
            background: #0b0c10; /* Темный фон игры */
            color: white; 
            overflow: hidden; height: 100vh; width: 100vw; position: relative;
        }

        /* Верхняя панель */
        .top-bar {
            position: absolute; top: 0; left: 0; width: 100%; height: 50px;
            background: rgba(20, 22, 28, 0.95);
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 15px; z-index: 10; border-bottom: 1px solid #2a2d35;
        }
        .top-bar .gold { color: #ffd700; font-size: 16px; font-weight: bold; }
        .top-bar .stats { display: flex; gap: 15px; font-size: 12px; color: #aaa; }

        /* Игровое поле (Canvas) */
        #gameCanvas {
            position: absolute; top: 50px; bottom: 100px; left: 0; right: 0;
            width: 100%; height: calc(100% - 150px); /* Учитываем топ и нижнюю панель */
            background: #d2b48c; /* Цвет песка (карта) */
            display: block; touch-action: none;
        }

        /* Нижняя панель управления (Мобильная) */
        .bottom-panel {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 100px;
            background: rgba(20, 22, 28, 0.95);
            border-top: 1px solid #2a2d35; z-index: 10;
            display: flex; justify-content: space-between; align-items: center; padding: 10px 15px;
        }
        
        /* Джойстик (Область для свайпов) */
        .joystick-area {
            width: 80px; height: 80px; border-radius: 50%; background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.2); position: relative;
            display: flex; align-items: center; justify-content: center; touch-action: none;
        }
        .joystick-knob {
            width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,0.4);
            position: absolute; left: 20px; top: 20px; transition: 0.05s linear; touch-action: none;
        }

        /* Кнопка стрельбы */
        .fire-btn {
            width: 70px; height: 70px; border-radius: 50%; background: #e74c3c;
            border: 4px solid #ff6b6b; box-shadow: 0 0 15px rgba(231, 76, 60, 0.5);
            display: flex; align-items: center; justify-content: center;
            font-size: 12px; font-weight: bold; cursor: pointer; touch-action: none;
            transition: transform 0.1s;
        }
        .fire-btn:active { transform: scale(0.85); background: #c0392b; }

        /* Меню и кнопки действий */
        .action-buttons { display: flex; flex-direction: column; gap: 5px; }
        .action-btn {
            padding: 5px 12px; background: #2c3e50; border: 1px solid #34495e;
            color: white; border-radius: 20px; font-size: 10px; font-weight: bold;
            cursor: pointer; text-align: center;
        }
        .action-btn.cheat { background: #c0392b; border-color: #e74c3c; }

        /* Модальные окна (Инвентарь, Кейсы) */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(4px);
            display: none; flex-direction: column; align-items: center; justify-content: center;
            z-index: 999; padding: 20px;
        }
        .modal-panel {
            background: #1a1c22; width: 100%; max-width: 400px; max-height: 80vh;
            border-radius: 16px; padding: 20px; border: 1px solid #2a2d35;
            display: flex; flex-direction: column; overflow: hidden;
        }
        .modal-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #252830; padding-bottom: 15px; margin-bottom: 15px;
        }
        .close-btn { background: #333; padding: 5px 15px; border-radius: 20px; cursor: pointer; }
        
        /* Сетка инвентаря и Кейсы */
        .grid-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; overflow-y: auto; }
        .item-card { background: #252830; padding: 10px; border-radius: 10px; text-align: center; border-bottom: 3px solid #7f8c8d; }
        .item-card.Common { border-color: #bdc3c7; }
        .item-card.Rare { border-color: #3498db; }
        .item-card.Epic { border-color: #9b59b6; }
        .item-card.Legendary { border-color: #f1c40f; }
        
        /* Прокрутка кейсов (Анимация) */
        .case-open-area { width: 100%; height: 100px; background: #0f1014; border-radius: 10px; display: flex; overflow: hidden; margin-bottom: 20px; position: relative; }
        .slot-machine { display: flex; width: 100%; position: relative; left: 0; transition: left 2s cubic-bezier(0.25, 1, 0.5, 1); }
        .slot-item { min-width: 60px; height: 100px; display: flex; flex-direction: column; align-items: center; justify-content: center; border-right: 1px solid #222; background: #1a1c22; font-size: 10px; text-align: center; padding: 5px; }
        .slot-item.active { background: #f7931e; color: black; font-weight: bold; border: 2px solid white; }
        .highlight-bar { position: absolute; top: 0; left: 50%; height: 100%; width: 60px; background: rgba(247, 147, 30, 0.2); border: 2px solid #f7931e; transform: translateX(-50%); pointer-events: none; box-shadow: 0 0 15px #f7931e; }
        
        .btn-open-case { width: 100%; padding: 15px; background: #f7931e; border: none; border-radius: 10px; font-size: 18px; font-weight: bold; color: white; text-shadow: 0 2px 4px rgba(0,0,0,0.5); cursor: pointer; margin-top: 10px; }
        .btn-open-case:disabled { background: #666; cursor: not-allowed; }
        
        .cases-select { display: flex; gap: 10px; justify-content: space-around; margin-bottom: 20px; }
        .case-type { background: #252830; padding: 10px; border-radius: 8px; text-align: center; width: 45%; border: 2px solid transparent; }
        .case-type.selected { border-color: #f7931e; }

        /* Меню читов */
        .cheat-overlay {
            position: absolute; top: 50px; right: 10px; background: rgba(0,0,0,0.85);
            padding: 15px; border-radius: 10px; border: 1px solid #c0392b; z-index: 20; display: none;
            width: 160px;
        }
        .cheat-item { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 12px; align-items: center; }
        .switch { position: relative; display: inline-block; width: 30px; height: 17px; }
        .slider { position: absolute; cursor: pointer; background: #555; transition: .4s; border-radius: 17px; width: 100%; height: 100%; }
        .slider:before { content: ""; height: 13px; width: 13px; left: 2px; bottom: 2px; background: white; position: absolute; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background: #e74c3c; }
        input:checked + .slider:before { transform: translateX(13px); }
    </style>
</head>
<body>

    <!-- Верхняя панель -->
    <div class="top-bar">
        <div class="gold">🪙 <span id="goldBalance">150</span></div>
        <div class="stats">
            <span>K: <b id="killCount">0</b></span>
            <span>C: <b id="champCount">0</b></span>
        </div>
        <div style="display: flex; gap: 8px;">
            <div class="action-btn" onclick="openModal('inventoryModal')">🎒</div>
            <div class="action-btn" onclick="openModal('caseModal')">📦</div>
        </div>
    </div>

    <!-- Меню Читов (Плавает над картой) -->
    <div class="cheat-overlay" id="cheatPanel">
        <div class="cheat-item">AimBot <label class="switch"><input type="checkbox" id="chAim"><span class="slider"></span></label></div>
        <div class="cheat-item">ESP <label class="switch"><input type="checkbox" id="chESP"><span class="slider"></span></label></div>
        <div class="cheat-item" style="flex-direction: column; gap:5px; align-items: stretch;">
            <button onclick="giveGold()" style="background:#3498db; border:none; color:white; padding:5px; border-radius:5px;">+500 Gold</button>
            <button onclick="spawnChamp()" style="background:#9b59b6; border:none; color:white; padding:5px; border-radius:5px;">Спавн Чемпиона</button>
        </div>
    </div>

    <!-- Холст для игры (Карта) -->
    <canvas id="gameCanvas"></canvas>

    <!-- Нижняя панель управления -->
    <div class="bottom-panel">
        <div class="joystick-area" id="joystickArea">
            <div class="joystick-knob" id="joystickKnob"></div>
        </div>
        
        <div style="display:flex; gap:10px; align-items:center;">
            <div class="action-btn cheat" onclick="toggleCheatPanel()">⚡</div>
            <div class="fire-btn" id="fireBtn">🔫</div>
        </div>
    </div>


    <!-- ================== МОДАЛЬНЫЕ ОКНА ================== -->

    <!-- Инвентарь -->
    <div class="modal-overlay" id="inventoryModal">
        <div class="modal-panel">
            <div class="modal-header">
                <span style="font-size: 18px; font-weight: bold;">Инвентарь</span>
                <div class="close-btn" onclick="closeModal('inventoryModal')">Закрыть</div>
            </div>
            <div class="grid-container" id="invGrid">
                <!-- Сюда JS вставит скины -->
            </div>
        </div>
    </div>

    <!-- Кейсы -->
    <div class="modal-overlay" id="caseModal">
        <div class="modal-panel">
            <div class="modal-header">
                <span style="font-size: 18px; font-weight: bold;">Открытие кейсов</span>
                <div class="close-btn" onclick="closeModal('caseModal')">Закрыть</div>
            </div>
            
            <div class="cases-select">
                <div class="case-type selected" id="caseEmpire" onclick="selectCase('Empire')">Empire<br><span style="font-size:10px; color:#aaa;">50🪙</span></div>
                <div class="case-type" id="caseClassic" onclick="selectCase('Classic')">Classic<br><span style="font-size:10px; color:#aaa;">30🪙</span></div>
            </div>

            <div class="case-open-area">
                <div class="highlight-bar"></div>
                <div class="slot-machine" id="slotMachine">
                    <!-- Сюда JS вставит предметы для прокрутки -->
                </div>
            </div>

            <button class="btn-open-case" id="openCaseBtn" onclick="startCaseOpening()">Открыть кейс</button>
        </div>
    </div>

<script>
// =========================================================
// JAVASCRIPT - ВСЯ ЛОГИКА ИГРЫ, КЕЙСОВ И ЧИТОВ
// =========================================================

// --- БАЗА ДАННЫХ СКИНОВ ---
const skinDatabase = {
    'Empire': [
        { name: 'AKR "Sport"', rarity: 'Epic', color: '#9b59b6' },
        { name: 'AWM "Cold-blooded"', rarity: 'Legendary', color: '#f1c40f' },
        { name: 'Desert Eagle "Hunter"', rarity: 'Rare', color: '#3498db' },
        { name: 'M60 "Quantum"', rarity: 'Epic', color: '#9b59b6' },
        { name: 'Gloves "Punk"', rarity: 'Legendary', color: '#f1c40f' },
        { name: 'Charm "Project Z"', rarity: 'Common', color: '#bdc3c7' },
        { name: 'M16 "Sharpshooter"', rarity: 'Rare', color: '#3498db' }
    ],
    'Classic': [
        { name: 'AKR "Blue Gem"', rarity: 'Rare', color: '#3498db' },
        { name: 'Desert Eagle "Inferno"', rarity: 'Epic', color: '#9b59b6' },
        { name: 'Charm "Gold"', rarity: 'Legendary', color: '#f1c40f' },
        { name: 'AWM "Icetech"', rarity: 'Common', color: '#bdc3c7' },
        { name: 'Gloves "Champion"', rarity: 'Legendary', color: '#f1c40f' },
        { name: 'M4 "Titan"', rarity: 'Epic', color: '#9b59b6' },
        { name: 'FAMAS "Survivor"', rarity: 'Rare', color: '#3498db' }
    ]
};

// Переменные состояния
let playerGold = 150;
let inventory = [];
let currentCaseType = 'Empire';
let isSpinning = false;
let gameRunning = true;
let player = { x: 200, y: 200, radius: 15, health: 100, score: 0, champScore: 0 };
let enemies = [];
let bullets = [];
let lastShotTime = 0;
let joystickData = { dx: 0, dy: 0 };

// Настройки читов
let cheats = { aimbot: false, esp: false };

// Получаем элементы Canvas
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const ctxRect = canvas.getBoundingClientRect();

// --- 1. ЛОГИКА КЕЙСОВ И ИНВЕНТАРЯ ---

function updateUI() {
    document.getElementById('goldBalance').innerText = playerGold;
    document.getElementById('killCount').innerText = player.score;
    document.getElementById('champCount').innerText = player.champScore;
}

function addToInventory(skin) {
    inventory.push(skin);
    renderInventory();
}

function renderInventory() {
    const grid = document.getElementById('invGrid');
    grid.innerHTML = '';
    if(inventory.length === 0) {
        grid.innerHTML = '<div style="grid-column: span 3; text-align:center; color:#555;">Инвентарь пуст. Открой кейс!</div>';
        return;
    }
    inventory.forEach(item => {
        const card = document.createElement('div');
        card.className = `item-card ${item.rarity}`;
        card.style.borderColor = item.color;
        card.innerHTML = `
            <div style="font-size: 20px; margin-bottom: 5px;">🎯</div>
            <div style="font-weight:bold; font-size:12px;">${item.name}</div>
            <div style="font-size:10px; color:${item.color};">${item.rarity}</div>
        `;
        grid.appendChild(card);
    });
}

function selectCase(type) {
    currentCaseType = type;
    document.querySelectorAll('.case-type').forEach(el => el.classList.remove('selected'));
    document.getElementById(type === 'Empire' ? 'caseEmpire' : 'caseClassic').classList.add('selected');
}

function getCasePrice() {
    return currentCaseType === 'Empire' ? 50 : 30;
}

function startCaseOpening() {
    if (isSpinning) return;
    const price = getCasePrice();
    if (playerGold < price) { alert("Недостаточно золота! Играй в режиме Арены или возьми Gold в читах."); return; }
    
    playerGold -= price;
    updateUI();
    isSpinning = true;
    document.getElementById('openCaseBtn').disabled = true;

    // Подготовка списка для прокрутки
    const pool = skinDatabase[currentCaseType];
    // Создаем массив из 30+ элементов для красивой прокрутки
    let rollItems = [];
    const winIndex = Math.floor(Math.random() * pool.length);
    
    // Заполняем случайными
    for(let i=0; i<25; i++) {
        rollItems.push(pool[Math.floor(Math.random() * pool.length)]);
    }
    // Добавляем выигрышный в конец
    rollItems.push(pool[winIndex]);

    // Рендер в слот-машину
    const slotMachine = document.getElementById('slotMachine');
    slotMachine.innerHTML = '';
    rollItems.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'slot-item';
        div.innerText = item.name;
        if(index === rollItems.length - 1) div.classList.add('active');
        slotMachine.appendChild(div);
    });

    // Анимация прокрутки (сдвиг влево)
    // Ширина 1 элемента ~ 60px. Сдвигаем на (кол-во элементов - 1) * 60
    const totalWidth = (rollItems.length - 1) * 60; 
    slotMachine.style.left = `0px`;
    
    // Запускаем анимацию через requestAnimationFrame или CSS transition
    setTimeout(() => {
        slotMachine.style.left = `-${totalWidth}px`; // 60px - ширина слота. Итого сдвиг на 29*60 = 1740px
    }, 50);

    // Ждем окончания анимации (2.2 секунды)
    setTimeout(() => {
        const winSkin = rollItems[rollItems.length - 1];
        addToInventory(winSkin);
        isSpinning = false;
        document.getElementById('openCaseBtn').disabled = false;
        alert(`Поздравляю! Ты получил: ${winSkin.name} (${winSkin.rarity})`);
    }, 2300);
}

// --- 2. ЛОГИКА МИНИ-ИГРЫ (ДВИЖЕНИЕ, БОТЫ, СТРЕЛЬБА) ---

function resizeCanvas() {
    const top = document.querySelector('.top-bar').offsetHeight;
    const bottom = document.querySelector('.bottom-panel').offsetHeight;
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight - top - bottom;
    canvas.style.top = top + 'px';
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// Генерация врагов
function spawnEnemy() {
    if(enemies.length < 10) {
        // Спавн за пределами экрана, но чтобы не на игроке
        let x, y;
        do {
            x = Math.random() * canvas.width;
            y = Math.random() * canvas.height;
        } while (Math.hypot(x - player.x, y - player.y) < 100);
        
        enemies.push({
            x: x, y: y, radius: 12, 
            hp: 50, maxHp: 50,
            speed: 1 + Math.random() * 1.5,
            isChamp: Math.random() < 0.1 // 10% шанс чемпиона
        });
    }
}

function spawnChamp() {
    // Чит кнопка спавна чемпиона
    let x = Math.random() * canvas.width;
    let y = Math.random() * canvas.height;
    enemies.push({
        x: x, y: y, radius: 18, 
        hp: 150, maxHp: 150,
        speed: 2.5,
        isChamp: true
    });
}

// Пули
function shootBullet() {
    const now = Date.now();
    if(now - lastShotTime > 200) {
        lastShotTime = now;
        
        let targetX = player.x + 20; // По умолчанию вправо
        let targetY = player.y;

        // AIMBOT ЧИТ (Наведение)
        if(cheats.aimbot && enemies.length > 0) {
            let nearest = enemies[0];
            let minDist = Infinity;
            enemies.forEach(enemy => {
                let d = Math.hypot(enemy.x - player.x, enemy.y - player.y);
                if(d < minDist) {
                    minDist = d;
                    nearest = enemy;
                }
            });
            // Вектор на врага
            targetX = nearest.x;
            targetY = nearest.y;
        }

        bullets.push({
            x: player.x, y: player.y,
            targetX: targetX, targetY: targetY,
            speed: 8,
            damage: 30
        });
    }
}

// Обновление игры (движение ботов, коллизии)
function updateGame() {
    if(!gameRunning) return;

    // Движение игрока от джойстика
    player.x += joystickData.dx * 5;
    player.y += joystickData.dy * 5;
    // Ограничения (не вылетай за карту)
    player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
    player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y));

    // Движение врагов к игроку
    enemies.forEach(enemy => {
        let dx = player.x - enemy.x;
        let dy = player.y - enemy.y;
        let len = Math.hypot(dx, dy);
        if(len > 2) {
            enemy.x += (dx / len) * enemy.speed;
            enemy.y += (dy / len) * enemy.speed;
        }
    });

    // Обновление пуль
    for(let i = bullets.length - 1; i >= 0; i--) {
        let b = bullets[i];
        let dx = b.targetX - b.x;
        let dy = b.targetY - b.y;
        let len = Math.hypot(dx, dy);
        if(len < 5) {
            bullets.splice(i, 1);
            continue;
        }
        b.x += (dx / len) * b.speed;
        b.y += (dy / len) * b.speed;

        // Попадание во врагов
        for(let j = enemies.length - 1; j >= 0; j--) {
            let enemy = enemies[j];
            let d = Math.hypot(b.x - enemy.x, b.y - enemy.y);
            if(d < enemy.radius) {
                enemy.hp -= b.damage;
                bullets.splice(i, 1);
                if(enemy.hp <= 0) {
                    let killed = enemies.splice(j, 1)[0];
                    if(killed.isChamp) {
                        player.champScore++;
                        playerGold += 50; // Награда за чемпиона
                    } else {
                        player.score++;
                        playerGold += 10; // Награда за обычного врага
                    }
                    updateUI();
                    spawnEnemy(); // Вместо убитого появляется новый
                }
                break;
            }
        }
    }
}

// Отрисовка игры
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // Карта (добавим текстуру песка)
    ctx.fillStyle = '#d2b48c';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#c29b6a'; // Сетка
    for(let i=0; i<canvas.width; i+= 40) {
        ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.strokeStyle = 'rgba(0,0,0,0.05)'; ctx.stroke();
    }
    for(let i=0; i<canvas.height; i+= 40) {
        ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.strokeStyle = 'rgba(0,0,0,0.05)'; ctx.stroke();
    }

    // ESP ЧИТ (Подсветка)
    if(cheats.esp) {
        enemies.forEach(enemy => {
            ctx.beginPath();
            ctx.arc(enemy.x, enemy.y, enemy.radius + 8, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255, 0, 0, 0.8)';
            ctx.lineWidth = 3;
            ctx.stroke();
        });
    }

    // Рисуем врагов
    enemies.forEach(enemy => {
        ctx.beginPath();
        ctx.arc(enemy.x, enemy.y, enemy.radius, 0, Math.PI * 2);
        ctx.fillStyle = enemy.isChamp ? '#e67e22' : '#c0392b';
        ctx.fill();
        ctx.fillStyle = 'white';
        ctx.font = '10px Arial';
        ctx.textAlign = 'center';
        ctx.fillText(enemy.isChamp ? '👑' : '💀', enemy.x, enemy.y-4);
        
        // Полоска HP
        ctx.fillStyle = 'red';
        ctx.fillRect(enemy.x - 20, enemy.y - enemy.radius - 10, 40, 5);
        ctx.fillStyle = '#2ecc71';
        ctx.fillRect(enemy.x - 20, enemy.y - enemy.radius - 10, 40 * (enemy.hp / enemy.maxHp), 5);
    });

    // Рисуем пули
    ctx.fillStyle = 'yellow';
    bullets.forEach(b => {
        ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, Math.PI*2); ctx.fill();
    });

    // Рисуем игрока
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
    ctx.fillStyle = '#3498db';
    ctx.fill();
    ctx.strokeStyle = 'white';
    ctx.lineWidth = 2;
    ctx.stroke();
    
    // Прицел игрока
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.beginPath(); ctx.moveTo(player.x + 20, player.y); ctx.lineTo(player.x + 35, player.y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(player.x + 20, player.y-5); ctx.lineTo(player.x + 20, player.y+5); ctx.stroke();
}

// Игровой цикл
function gameLoop() {
    updateGame();
    draw();
    requestAnimationFrame(gameLoop);
}

// --- 3. МОБИЛЬНОЕ УПРАВЛЕНИЕ (ДЖОЙСТИК И СТРЕЛЬБА) ---

// Джойстик
const joystickArea = document.getElementById('joystickArea');
const joystickKnob = document.getElementById('joystickKnob');
let isDragging = false;

function handleJoystickMove(clientX, clientY) {
    if(!isDragging) return;
    const rect = joystickArea.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;
    
    let dx = clientX - centerX;
    let dy = clientY - centerY;
    const distance = Math.hypot(dx, dy);
    const maxDist = rect.width / 2 - 10; // Максимальный радиус джойстика

    // Нормализация
    if(distance > maxDist) {
        dx = (dx / distance) * maxDist;
        dy = (dy / distance) * maxDist;
    }

    joystickKnob.style.left = (dx + 20) + 'px';
    joystickKnob.style.top = (dy + 20) + 'px';

    // Передаем в игру (значения от -1 до 1)
    joystickData.dx = dx / maxDist;
    joystickData.dy = dy / maxDist;
}

// События для телефона
joystickArea.addEventListener('touchstart', (e) => {
    isDragging = true;
    handleJoystickMove(e.touches[0].clientX, e.touches[0].clientY);
});
window.addEventListener('touchmove', (e) => {
    if(isDragging) handleJoystickMove(e.touches[0].clientX, e.touches[0].clientY);
});
window.addEventListener('touchend', () => {
    isDragging = false;
    joystickData.dx = 0; joystickData.dy = 0;
    joystickKnob.style.left = '20px'; joystickKnob.style.top = '20px';
});

// Кнопка стрельбы
document.getElementById('fireBtn').addEventListener('touchstart', (e) => {
    e.preventDefault();
    shootBullet();
});
// Для мыши (если на компе тестишь)
document.getElementById('fireBtn').addEventListener('mousedown', shootBullet);

// --- 4. ЧИТЫ И UI ОТКРЫТИЕ ---

    const panel = document.getElementById('cheatPanel');
    panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
}

function giveGold() {

    updateUI();

// Обработчики чит-переключателей
document.getElementById('chAim').addEventListener('change', (e) => cheats.aimbot = e.target.checked);

// Модальные окна

    // Если открываем инвентарь, обновляем его
    if(id === 'inventoryModal') renderInventory();
}
function closeModal(id) {
    document.getElementById(id).style.display = 'none';
}

// --- ЗАПУСК ---
// Спавн начальных врагов
for(let i=0; i<6; i++) spawnEnemy();
updateUI();
gameLoop();
