<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Standoff 2 Pro Engine</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; touch-action: none; font-family: 'Segoe UI', sans-serif; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; color: #fff; }

        /* --- Меню --- */
        #menu-screen, #platform-menu, #inventory-menu {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: rgba(0,0,0,0.9); z-index: 2000; gap: 20px;
        }
        .hidden { display: none !important; }
        .btn { padding: 15px 30px; font-size: 1.2rem; cursor: pointer; background: #f4a261; border: none; border-radius: 8px; font-weight: bold; width: 280px; text-align: center; }
        .btn:active { transform: scale(0.95); }

        /* --- Инвентарь --- */
        .knife-card { width: 200px; height: 150px; background: #222; border: 2px solid #555; margin: 10px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .knife-card:hover { border-color: #f4a261; }

        /* --- HUD --- */
        #game-hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; pointer-events: none; }
        .hud-panel { position: absolute; top: 15px; background: rgba(0,0,0,0.6); padding: 10px; border-radius: 5px; pointer-events: auto; }
        #inventory-btn { position: absolute; top: 15px; right: 15px; }

        /* ... (остальные стили из твоего кода сохранены) ... */
    </style>
</head>
<body>

    <!-- Меню 1: Старт -->
    <div id="menu-screen">
        <h1>SANDSTONE ENGINE</h1>
        <button class="btn" id="play-start-btn">ИГРАТЬ</button>
    </div>

    <!-- Меню 2: Платформа -->
    <div id="platform-menu" class="hidden">
        <h1>ВЫБЕРИ УПРАВЛЕНИЕ</h1>
        <button class="btn" id="set-pc">ПК (МЫШЬ)</button>
        <button class="btn" id="set-mobile">ТЕЛЕФОН (СЕНСОР)</button>
    </div>

    <!-- Меню 3: Инвентарь -->
    <div id="inventory-menu" class="hidden">
        <h1>ИНВЕНТАРЬ</h1>
        <div style="display:flex;">
            <div class="knife-card" onclick="equipKnife('m9')"><h3>M9 BAYONET</h3><p>Classic</p></div>
            <div class="knife-card" onclick="equipKnife('stinger')"><h3>STINGER</h3><p>Folding</p></div>
        </div>
        <button class="btn" style="background:#555" onclick="closeInventory()">НАЗАД</button>
    </div>

    <div id="game-hud">
        <div id="inventory-btn" class="hud-panel" onclick="openInventory()">🔪 ИНВЕНТАРЬ</div>
        <!-- ... остальной HUD ... -->
    </div>

    <canvas id="esp-canvas"></canvas>

    <script>
        // --- ДАННЫЕ ИГРЫ ---
        let scene, camera, renderer, knifeGroup, pivotGroup;
        let currentKnife = 'm9';
        let animationState = { type: 'idle', progress: 0 };
        
        // ... (инициализация как в твоем коде) ...

        function init() {
            // ... базовый Three.js ...
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({antialias: true});
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Инициализация ножа
            pivotGroup = new THREE.Group();
            camera.add(pivotGroup);
            equipKnife('m9');
            
            animate();
        }

        // --- ЛОГИКА ИНВЕНТАРЯ И НОЖЕЙ ---
        function equipKnife(type) {
            currentKnife = type;
            if (knifeGroup) pivotGroup.remove(knifeGroup);
            
            knifeGroup = new THREE.Group();
            
            // Генерация скина
            const canvas = document.createElement('canvas'); canvas.width = 256; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            
            if (type === 'm9') {
                // Скин M9: Градиент синий-фиолетовый (Galaxy)
                let grad = ctx.createLinearGradient(0,0,256,256);
                grad.addColorStop(0, '#1a0b2e'); grad.addColorStop(1, '#ff007f');
                ctx.fillStyle = grad; ctx.fillRect(0,0,256,256);
            } else {
                // Скин Stinger: Кровавый узор (Tiger/Blood)
                ctx.fillStyle = '#8b0000'; ctx.fillRect(0,0,256,256);
                ctx.fillStyle = '#ff4500';
                for(let i=0; i<20; i++) ctx.fillRect(Math.random()*256, Math.random()*256, 50, 5);
            }
            
            const tex = new THREE.CanvasTexture(canvas);
            const mat = new THREE.MeshStandardMaterial({map: tex, metalness: 0.8});
            
            // Геометрия
            if (type === 'm9') {
                const blade = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.3, 0.05), mat);
                blade.position.y = 0.15;
                knifeGroup.add(blade);
            } else {
                // Сложенный нож
                const blade = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.15, 0.03), mat);
                blade.rotation.z = Math.PI/4;
                knifeGroup.add(blade);
            }
            
            knifeGroup.position.set(0.15, -0.2, -0.3);
            pivotGroup.add(knifeGroup);
            closeInventory();
        }

        function playKnifeAnimation() {
            animationState.type = 'active';
            animationState.progress = 0;
        }

        function animate() {
            requestAnimationFrame(animate);
            
            // Логика анимации
            if (animationState.type === 'active') {
                animationState.progress += 0.1;
                
                if (currentKnife === 'm9') {
                    // M9: Кручение вокруг оси
                    knifeGroup.rotation.x = animationState.progress * 2;
                } else {
                    // Stinger: Флип (переворот)
                    knifeGroup.rotation.z = Math.sin(animationState.progress * 2) * Math.PI;
                }

                if (animationState.progress > 2) animationState.type = 'idle';
            }
            
            renderer.render(scene, camera);
        }

        // --- ОБРАБОТЧИКИ МЕНЮ ---
        document.getElementById('play-start-btn').onclick = () => {
            document.getElementById('menu-screen').classList.add('hidden');
            document.getElementById('platform-menu').classList.remove('hidden');
        };

        document.getElementById('set-pc').onclick = () => {
            document.getElementById('platform-menu').classList.add('hidden');
            document.getElementById('game-hud').style.display = 'block';
            startGame();
        };
        
        // Вызов анимации на кнопку R (перезарядка/осмотр)
        document.addEventListener('keydown', (e) => {
            if(e.code === 'KeyR') playKnifeAnimation();
        });

        function openInventory() { document.getElementById('inventory-menu').classList.remove('hidden'); }
        function closeInventory() { document.getElementById('inventory-menu').classList.add('hidden'); }

        window.onload = init;
    </script>
</body>
</html>>
