<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Standoff 2 - Sandstone Remastered Pro</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; touch-action: none; font-family: sans-serif; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; }

        /* --- UI --- */
        #menu-screen { position: absolute; z-index: 100; width: 100%; height: 100%; background: #1f140e; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .btn { padding: 15px 30px; margin: 10px; border-radius: 8px; border: none; background: #f4a261; font-weight: bold; cursor: pointer; }
        
        /* --- HUD --- */
        #game-ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        .draggable { position: absolute; touch-action: none; pointer-events: auto; cursor: move; }
        
        #mod-menu { position: absolute; top: 50px; left: 50px; width: 250px; background: rgba(0,0,0,0.85); border: 1px solid #777; color: #fff; padding: 10px; z-index: 50; display: none; }
        #mod-header { cursor: move; background: #444; padding: 5px; text-align: center; }

        #editor-mode-hint { position: absolute; top: 10px; width: 100%; text-align: center; color: #f00; font-weight: bold; display: none; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="menu-screen">
    <h1>SANDSTONE PRO</h1>
    <button class="btn" onclick="startGame(false)">ИГРАТЬ (ПК)</button>
    <button class="btn" onclick="startGame(true)">ИГРАТЬ (МОБИЛКА)</button>
    <button class="btn" onclick="openSettings()">НАСТРОЙКИ</button>
</div>

<div id="editor-mode-hint">РЕЖИМ РЕДАКТИРОВАНИЯ HUD (Перетаскивай элементы)</div>

<div id="game-ui">
    <div id="mod-menu" class="draggable">
        <div id="mod-header">MOD MENU (DRAG)</div>
        <div style="padding: 10px;">
            <label><input type="checkbox" id="aim"> AimBot</label><br>
            <label><input type="checkbox" id="esp"> ESP</label>
        </div>
    </div>

    <div id="joystick-zone" class="draggable" style="bottom: 50px; left: 50px; width: 120px; height: 120px; background: rgba(255,255,255,0.2); border-radius: 50%;"></div>
    <div id="fire-btn" class="draggable" style="bottom: 50px; right: 50px; width: 90px; height: 90px; background: red; border-radius: 50%;"></div>
    <div id="jump-btn" class="draggable" style="bottom: 160px; right: 60px; width: 70px; height: 70px; background: green; border-radius: 50%;"></div>
</div>

<script>
    // --- ПЕРЕМЕННЫЕ ---
    let scene, camera, renderer, isMobile = false;
    let isEditing = false;

    // --- ФИЗИКА ---
    let velocity = new THREE.Vector3();
    let jumpImpulse = 11.5;
    let gravity = 32;

    // --- HUD EDITOR LOGIC ---
    function enableEditor() {
        isEditing = true;
        document.getElementById('editor-mode-hint').style.display = 'block';
        document.querySelectorAll('.draggable').forEach(el => {
            el.style.border = '2px dashed yellow';
            el.addEventListener('pointerdown', startDrag);
        });
    }

    let draggingElement = null;
    function startDrag(e) {
        if (!isEditing) return;
        draggingElement = e.target;
        document.addEventListener('pointermove', doDrag);
        document.addEventListener('pointerup', endDrag);
    }

    function doDrag(e) {
        if (!draggingElement) return;
        draggingElement.style.left = (e.clientX - 40) + 'px';
        draggingElement.style.top = (e.clientY - 40) + 'px';
        draggingElement.style.right = 'auto'; draggingElement.style.bottom = 'auto';
    }

    function endDrag() {
        // Сохранение в LocalStorage
        localStorage.setItem('hud_pos_' + draggingElement.id, JSON.stringify({
            left: draggingElement.style.left, top: draggingElement.style.top
        }));
        draggingElement = null;
    }

    // --- ИНИЦИАЛИЗАЦИЯ ИГРЫ ---
    function startGame(mobile) {
        isMobile = mobile;
        document.getElementById('menu-screen').style.display = 'none';
        initThree();
    }

    function initThree() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // Свет с настроенными тенями
        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(50, 100, 50);
        light.castShadow = true;
        light.shadow.camera.left = -80; light.shadow.camera.right = 80;
        light.shadow.camera.top = 80; light.shadow.camera.bottom = -80;
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x404040));

        // Песочный пол
        const floor = new THREE.Mesh(
            new THREE.PlaneGeometry(160, 160),
            new THREE.MeshStandardMaterial({ color: 0xcdb891 })
        );
        floor.rotation.x = -Math.PI/2;
        floor.receiveShadow = true;
        scene.add(floor);

        // Блок Sandstone
        const box = new THREE.Mesh(new THREE.BoxGeometry(10, 10, 10), new THREE.MeshStandardMaterial({ color: 0xe1c699 }));
        box.position.set(0, 5, 0);
        box.castShadow = true;
        scene.add(box);

        camera.position.set(0, 1.7, 20);
        animate();
    }

    function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
    }
</script>
</body>
</html>
