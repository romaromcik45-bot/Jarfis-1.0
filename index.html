<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Standoff 5v5 Tactical</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { background: #111; color: white; overflow: hidden; height: 100vh; width: 100vw; font-family: sans-serif; touch-action: none; }
        
        /* --- МЕНЮ --- */
        .main-menu {
            position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.9);
            display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; gap: 15px;
        }
        .menu-btn { padding: 15px 40px; border-radius: 12px; background: #2c3e50; border: none; color: white; font-size: 20px; font-weight: bold; cursor: pointer; }
        .menu-btn.play { background: #e74c3c; box-shadow: 0 0 20px rgba(231, 76, 60, 0.4); }
        .menu-btn.cheat { background: #8e44ad; position: absolute; bottom: 50px; }

        /* --- МОД МЕНЮ (ПЕРЕТАСКИВАЕМОЕ) --- */
        .cheat-panel {
            position: absolute; bottom: 120px; left: 20px; width: 160px;
            background: rgba(20, 22, 28, 0.95); padding: 15px; border-radius: 12px;
            border: 1px solid #8e44ad; z-index: 90; display: none; cursor: grab;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); backdrop-filter: blur(4px);
        }
        .cheat-item { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 14px; }
        .switch { position: relative; display: inline-block; width: 34px; height: 20px; }
        .slider { position: absolute; cursor: pointer; background: #444; transition: .4s; border-radius: 20px; width: 100%; height: 100%; }
        .slider:before { content: ""; height: 16px; width: 16px; left: 2px; bottom: 2px; background: white; position: absolute; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background: #2196F3; }
        input:checked + .slider:before { transform: translateX(14px); }
        .cheat-btn-gold { width: 100%; background: #f1c40f; border: none; padding: 5px; border-radius: 5px; font-weight: bold; color: black; cursor: pointer; }

        /* --- ИГРА --- */
        #gameUI { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; }
        
        .hud-top { position: absolute; top: 15px; left: 15px; right: 15px; display: flex; justify-content: space-between; z-index: 10; pointer-events: none; }
        .hud-box { background: rgba(0,0,0,0.7); padding: 8px 12px; border-radius: 8px; backdrop-filter: blur(4px); pointer-events: auto; font-weight: bold; }
        .hud-score { display: flex; gap: 15px; font-size: 16px; }
        .hud-score span.c1 { color: #3498db; } .hud-score span.c2 { color: #e74c3c; }
        .exit-btn { background: rgba(255,255,255,0.2); border: none; color: white; padding: 5px 15px; border-radius: 20px; cursor: pointer; }

        /* --- CANVAS --- */
        #gameCanvas { display: block; width: 100%; height: 100%; background: #c9ae84; touch-action: none; }

        /* --- УПРАВЛЕНИЕ --- */
        .controls { position: absolute; bottom: 30px; left: 20px; right: 20px; display: flex; justify-content: space-between; z-index: 10; pointer-events: none; }
        .joystick-area { pointer-events: auto; width: 140px; height: 140px; border-radius: 50%; background: rgba(255,255,255,0.1); border: 3px solid rgba(255,255,255,0.2); position: relative; }
        .joystick-knob { width: 60px; height: 60px; border-radius: 50%; background: radial-gradient(circle, #fff, #aaa); position: absolute; left: 40px; top: 40px; }
        
        .fire-btn { pointer-events: auto; width: 90px; height: 90px; border-radius: 50%; background: radial-gradient(circle, #ff4757, #c0392b); border: 4px solid #ff6b81; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: bold; color: white; box-shadow: 0 0 30px rgba(255, 71, 87, 0.5); }
        .fire-btn:active { transform: scale(0.85); }
    </style>
</head>
<body>

    <!-- Меню -->
    <div class="main-menu" id="mainMenu">
        <h1 style="color:#f7931e; text-shadow:0 0 20px #f7931e;">TACTICAL 5v5</h1>
        <button class="menu-btn play" onclick="startGame()">▶ ИГРАТЬ (5 vs 5)</button>
        <button class="menu-btn cheat" onclick="toggleCheatPanel()">⚡ ОТКРЫТЬ ЧИТЫ</button>
    </div>

    <!-- Чит Панель (Перетаскиваемая) -->
    <div class="cheat-panel" id="cheatPanel">
        <div class="cheat-item">ESP (Волхак) <label class="switch"><input type="checkbox" id="chESP"><span class="slider"></span></label></div>
        <div style="margin-top: 10px;">
            <button class="cheat-btn-gold" onclick="giveGold()">Выдать +1000 Gold</button>
        </div>
    </div>

    <!-- Игра -->
    <div id="gameUI">
        <div class="hud-top">
            <div style="display:flex; gap:10px; align-items:center;">
                <div class="hud-box hud-score">
                    <span class="c1" id="score1">🟦 0</span>
                    <span class="c2" id="score2">🟥 0</span>
                </div>
                <div class="hud-box" id="goldBox">🪙 <span id="goldBalance">100</span></div>
            </div>
            <button class="exit-btn" onclick="exitGame()">В меню ✖</button>
        </div>

        <canvas id="gameCanvas"></canvas>

        <div class="controls">
            <div class="joystick-area" id="joystickArea">
                <div class="joystick-knob" id="joystickKnob"></div>
            </div>
            <div class="fire-btn" id="fireBtn">🔫</div>
        </div>
    </div>

<script>
// =============================================
// CORE GAME ENGINE
// =============================================

// --- ДАННЫЕ ИГРОКА ---
let playerGold = 100;
let gameRunning = false;
let player = { x: 600, y: 600, radius: 16, angle: 0, team: 1 };
let enemies = [];
let bullets = [];
let joystickData = { dx: 0, dy: 0 };
let cheats = { esp: false };
let isDraggingCheat = false; let cheatOffX, cheatOffY;

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// --- КАРТА (Стены и размеры) ---
const MAP_SIZE = 1400; // Размер всей карты
const VIEW_RADIUS = 550; // Радиус обзора вокруг игрока

// Стены карты (x, y, width, height)
const walls = [
    // Внешние стены
    {x: 0, y: 0, w: MAP_SIZE, h: 15}, {x: 0, y: 0, w: 15, h: MAP_SIZE},
    {x: 0, y: MAP_SIZE-15, w: MAP_SIZE, h: 15}, {x: MAP_SIZE-15, y: 0, w: 15, h: MAP_SIZE},
    // Внутренние здания
    {x: 200, y: 200, w: 150, h: 150}, // Центральный дом
    {x: 600, y: 100, w: 200, h: 50},
    {x: 900, y: 300, w: 80, h: 200},
    {x: 400, y: 700, w: 300, h: 50},
    {x: 1000, y: 600, w: 150, h: 150}
];

// --- КАМЕРА ---
// Смещение камеры всегда держит игрока по центру
function getCameraOffset() {
    return { x: player.x - canvas.width / 2, y: player.y - canvas.height / 2 };
}

// --- ИНИЦИАЛИЗАЦИЯ ИГРЫ ---
function startGame() {
    document.getElementById('mainMenu').style.display = 'none';
    document.getElementById('gameUI').style.display = 'block';
    resizeCanvas();
    
    player.x = 600; player.y = 600;
    enemies = [];
    bullets = [];
    
    // Спавн 5 врагов
    for(let i=0; i<5; i++) spawnEnemy();
    gameRunning = true;
    updateUI();
    gameLoop();
}

function exitGame() {
    gameRunning = false;
    document.getElementById('gameUI').style.display = 'none';
    document.getElementById('mainMenu').style.display = 'flex';
}

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);

// --- СПАВН ВРАГОВ ---
function spawnEnemy() {
    let x, y;
    // Спавним их в углу карты (команда 2)
    do {
        x = 1100 + Math.random() * 200;
        y = 1100 + Math.random() * 200;
    } while (enemies.length > 0 && Math.hypot(x - player.x, y - player.y) < 300);
    
    enemies.push({ 
        x, y, radius: 16, angle: 0, hp: 100, maxHp: 100, speed: 1.5 + Math.random()*0.5, team: 2,
        isDead: false, respawnTimer: 0
    });
}

// --- СТРЕЛЬБА ---
let shootTimer = 0;
function shoot() {
    if(!gameRunning) return;
    const now = Date.now();
    if(now - shootTimer < 150) return;
    shootTimer = now;

    let targetX = player.x + Math.cos(player.angle) * 1000;
    let targetY = player.y + Math.sin(player.angle) * 1000;

    // AimBot (автонацелка, если включена)
    // Примечание: в этом билде автонацелка только на видимых врагов (если чит ESP выключен, то AimBot не видит сквозь стены)
    let checkTarget = null;
    let minDist = Infinity;
    enemies.forEach(e => {
        if(e.hp <= 0) return;
        let dist = Math.hypot(e.x - player.x, e.y - player.y);
        if(dist < minDist && isVisible(player, e)) {
            minDist = dist; checkTarget = e;
        }
    });
    if(checkTarget) {
        targetX = checkTarget.x; targetY = checkTarget.y;
    }

    bullets.push({ x: player.x, y: player.y, targetX, targetY, speed: 14, damage: 25 });
}

// --- КОЛЛИЗИЯ СО СТЕНАМИ ---
function rectCollide(x, y, radius, rect) {
    let closestX = Math.max(rect.x, Math.min(x, rect.x + rect.w));
    let closestY = Math.max(rect.y, Math.min(y, rect.y + rect.h));
    let dx = x - closestX; let dy = y - closestY;
    return (dx*dx + dy*dy) < (radius * radius);
}

// --- ПРОВЕРКА ВИДИМОСТИ (Line of Sight / Raycasting) ---
function isVisible(from, to) {
    // Используем алгоритм Брезенхема или проверку пересечения отрезков
    // Здесь упрощенный метод: проверяем пересечение луча со стенами
    let dx = to.x - from.x;
    let dy = to.y - from.y;
    let distance = Math.hypot(dx, dy);
    let steps = Math.ceil(distance / 5); // Проверяем каждые 5 пикселей

    for(let i = 0; i <= steps; i++) {
        let t = i / steps;
        let checkX = from.x + dx * t;
        let checkY = from.y + dy * t;
        
        for(let wall of walls) {
            if(rectCollide(checkX, checkY, 2, wall)) {
                return false; // Луч уперся в стену
            }
        }
    }
    return true; // Врага видно
}

// --- ОБНОВЛЕНИЕ ЛОГИКИ ---
function updateGame() {
    if(!gameRunning) return;

    // Движение игрока
    let nx = player.x + joystickData.dx * 5;
    let ny = player.y + joystickData.dy * 5;
    
    // Проверка столкновений игрока со стенами
    let canX = true, canY = true;
    for(let wall of walls) {
        if(rectCollide(nx, player.y, player.radius, wall)) canX = false;
        if(rectCollide(player.x, ny, player.radius, wall)) canY = false;
    }
    if(canX) player.x = Math.max(player.radius, Math.min(MAP_SIZE - player.radius, nx));
    if(canY) player.y = Math.max(player.radius, Math.min(MAP_SIZE - player.radius, ny));

    if(joystickData.dx !== 0 || joystickData.dy !== 0) {
        player.angle = Math.atan2(joystickData.dy, joystickData.dx);
    }

    // Движение врагов (бегут к игроку)
    enemies.forEach(e => {
        if(e.hp <= 0) {
            e.respawnTimer -= 0.05;
            if(e.respawnTimer <= 0) {
                e.hp = e.maxHp; e.isDead = false;
                // Спавн в углу
                e.x = 1100 + Math.random() * 200;
                e.y = 1100 + Math.random() * 200;
            }
            return;
        }
        let dx = player.x - e.x; let dy = player.y - e.y;
        let dist = Math.hypot(dx, dy);
        if(dist > 50) {
            e.x += (dx/dist) * e.speed;
            e.y += (dy/dist) * e.speed;
        }
        e.angle = Math.atan2(dy, dx);

        // Враги стреляют, если видят игрока
        if(dist < 400 && isVisible(e, player)) {
            if(Math.random() < 0.015) {
                bullets.push({ x: e.x, y: e.y, targetX: player.x, targetY: player.y, speed: 5, damage: 15 });
            }
        }
    });

    // Пули и стены
    for(let i = bullets.length - 1; i >= 0; i--) {
        let b = bullets[i];
        let dx = b.targetX - b.x; let dy = b.targetY - b.y;
        let len = Math.hypot(dx, dy);
        if(len < 5) { bullets.splice(i, 1); continue; }
        b.x += (dx/len) * b.speed; b.y += (dy/len) * b.speed;

        // Попадание в стены
        let hitWall = false;
        for(let wall of walls) {
            if(rectCollide(b.x, b.y, 4, wall)) { hitWall = true; break; }
        }
        if(hitWall) { bullets.splice(i, 1); continue; }

        // Попадание в игрока
        let hitPlayer = false;
        if(Math.hypot(b.x - player.x, b.y - player.y) < player.radius) {
            hitPlayer = true;
            // Умираем и перезапускаем
            alert("Тебя убили! Перезапуск...");
            player.x = 600; player.y = 600;
        }

        // Попадание во врагов
        for(let j = enemies.length - 1; j >= 0; j--) {
            let e = enemies[j];
            if(e.hp <= 0) continue;
            let d = Math.hypot(b.x - e.x, b.y - e.y);
            if(d < e.radius) {
                e.hp -= b.damage;
                bullets.splice(i, 1);
                if(e.hp <= 0) {
                    e.isDead = true;
                    e.respawnTimer = 5; // Респавн через 5 сек
                    playerGold += 50; // Награда
                    updateUI();
                    // Обновляем счет (убийство засчитано)
                    let score1 = document.getElementById('score1');
                    let current = parseInt(score1.innerText.split(' ')[1]) || 0;
                    score1.innerText = '🟦 ' + (current + 1);
                }
                break;
            }
        }
        if(hitPlayer) { bullets.splice(i, 1); }
    }
}

// --- РИСОВКА (Камера + Стены + Сущности) ---
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    let cam = getCameraOffset();

    // 1. Рисуем фон карты (смещённый)
    ctx.save();
    ctx.translate(-cam.x, -cam.y);

    ctx.fillStyle = '#c9ae84';
    ctx.fillRect(0, 0, MAP_SIZE, MAP_SIZE);

    // Рисуем стены
    ctx.fillStyle = '#5d4e37';
    walls.forEach(w => ctx.fillRect(w.x, w.y, w.w, w.h));

    // 2. Рисуем врагов (только если видны или включен чит)
    enemies.forEach(e => {
        if(e.hp <= 0) return;

        let visible = isVisible(player, e);
        let isESP = cheats.esp;

        // Рисуем линию ESP
        if(isESP && visible === false) {
            ctx.beginPath(); ctx.moveTo(player.x, player.y); ctx.lineTo(e.x, e.y);
            ctx.strokeStyle = 'rgba(255, 0, 0, 0.4)'; ctx.setLineDash([5, 5]); ctx.stroke(); ctx.setLineDash([]);
        }
        
        // Если не видно и НЕТ чита - не рисуем врага
        if(!visible && !isESP) return;

        // Рисуем кружок ESP
        if(isESP) {
            ctx.beginPath(); ctx.arc(e.x, e.y, e.radius + 8, 0, Math.PI*2);
            ctx.strokeStyle = 'rgba(255, 0, 0, 0.8)'; ctx.lineWidth = 2; ctx.stroke();
        }

        // Тело врага
        ctx.save(); ctx.translate(e.x, e.y); ctx.rotate(e.angle);
        ctx.fillStyle = '#c0392b'; ctx.beginPath(); ctx.arc(0,0,e.radius,0,Math.PI*2); ctx.fill();
        ctx.fillStyle = '#2c3e50'; ctx.fillRect(e.radius-2, -4, 18, 8);
        ctx.restore();

        // HP Полоска (под врагом)
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(e.x - 20, e.y + e.radius + 5, 40, 4);
        ctx.fillStyle = '#2ecc71';
        ctx.fillRect(e.x - 20, e.y + e.radius + 5, 40 * (e.hp / e.maxHp), 4);
    });

    // 3. Пули
    ctx.fillStyle = '#f1c40f';
    bullets.forEach(b => { ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, Math.PI*2); ctx.fill(); });

    // 4. Игрок
    ctx.save(); ctx.translate(player.x, player.y); ctx.rotate(player.angle);
    ctx.fillStyle = '#3498db'; ctx.beginPath(); ctx.arc(0,0,player.radius,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#1f618d'; ctx.fillRect(player.radius-3, -3, 20, 6);
    ctx.restore();

    ctx.restore(); // Восстанавливаем смещение камеры
}

// --- ГЛАВНЫЙ ЦИКЛ ---
function gameLoop() {
    updateGame();
    draw();
    requestAnimationFrame(gameLoop);
}

// --- UI ОБНОВЛЕНИЕ ---
function updateUI() {
    document.getElementById('goldBalance').innerText = playerGold;
}

function giveGold() {
    playerGold += 1000;
    updateUI();
}

// --- УПРАВЛЕНИЕ (Тач / Мышь) ---
const joyArea = document.getElementById('joystickArea');
const joyKnob = document.getElementById('joystickKnob');
let isDragging = false;

function handleJoystick(clientX, clientY) {
    if(!isDragging) return;
    const rect = joyArea.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    
    let dx = clientX - cx; let dy = clientY - cy;
    const dist = Math.hypot(dx, dy);
    const maxDist = rect.width / 2 - 10;

    if(dist > maxDist) { dx = (dx/dist)*maxDist; dy = (dy/dist)*maxDist; }
    
    joyKnob.style.left = (dx + 40) + 'px';
    joyKnob.style.top = (dy + 40) + 'px';
    
    let normX = dx / maxDist; let normY = dy / maxDist;
    // Деадзона (чтобы не дергался)
    if(Math.abs(normX) < 0.1) normX = 0;
    if(Math.abs(normY) < 0.1) normY = 0;
    joystickData.dx = normX; joystickData.dy = normY;
}

joyArea.addEventListener('touchstart', (e) => { isDragging = true; handleJoystick(e.touches[0].clientX, e.touches[0].clientY); });
window.addEventListener('touchmove', (e) => { if(isDragging) handleJoystick(e.touches[0].clientX, e.touches[0].clientY); });
window.addEventListener('touchend', () => { isDragging = false; joystickData.dx = 0; joystickData.dy = 0; joyKnob.style.left = '40px'; joyKnob.style.top = '40px'; });

// Стрельба
const fireBtn = document.getElementById('fireBtn');
let fireInterval;
fireBtn.addEventListener('touchstart', (e) => { e.preventDefault(); shoot(); fireInterval = setInterval(shoot, 150); });
fireBtn.addEventListener('touchend', (e) => { e.preventDefault(); clearInterval(fireInterval); });

// Читы (Переключатели)
document.getElementById('chESP').addEventListener('change', (e) => { cheats.esp = e.target.checked; });

// Чит Панель (Перетаскивание и открытие)
function toggleCheatPanel() {
    let p = document.getElementById('cheatPanel');
    p.style.display = p.style.display === 'block' ? 'none' : 'block';
}

// Drag & Drop для панели читов на телефоне
const cheatPanel = document.getElementById('cheatPanel');
cheatPanel.addEventListener('touchstart', (e) => {
    isDraggingCheat = true;
    let t = e.touches[0];
    let rect = cheatPanel.getBoundingClientRect();
    cheatOffX = t.clientX - rect.left; cheatOffY = t.clientY - rect.top;
});
window.addEventListener('touchmove', (e) => {
    if(!isDraggingCheat) return;
    let t = e.touches[0];
    let newX = Math.max(0, t.clientX - cheatOffX);
    let newY = Math.max(0, t.clientY - cheatOffY);
    cheatPanel.style.left = newX + 'px'; cheatPanel.style.top = newY + 'px';
});
window.addEventListener('touchend', () => { isDraggingCheat = false; });

</script>
</body>
</html>
