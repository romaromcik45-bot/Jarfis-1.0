<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Standoff 2 - Sandstone Modded</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0; padding: 0;
            user-select: none; -webkit-user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
        }
        body, html {
            width: 100%; height: 100%;
            overflow: hidden; background-color: #000; color: #fff;
        }

        /* --- Главный экран --- */
        #menu-screen {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex; flex-direction: column;
            justify-content: space-between; align-items: center;
            padding: 20px;
            background: linear-gradient(135deg, #1c130d 0%, #0d0805 100%);
            z-index: 50;
        }

        .header { text-align: center; margin-top: 15px; }
        .header h1 {
            font-size: 2.2rem; color: #f4a261;
            text-shadow: 0 0 12px rgba(244, 162, 97, 0.6);
        }
        .header p { color: #e9c46a; font-size: 0.9rem; margin-top: 5px; }

        .mode-selection { display: flex; gap: 15px; margin-bottom: 20px; width: 100%; max-width: 400px; }
        .btn {
            flex: 1; padding: 14px; font-size: 1rem; font-weight: bold;
            color: #170d08; background: #f4a261; border: none; border-radius: 6px;
            cursor: pointer; box-shadow: 0 0 10px rgba(244, 162, 97, 0.4);
        }
        .btn:active { transform: scale(0.98); }

        /* --- HUD --- */
        #game-hud {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: none; pointer-events: none; z-index: 10;
        }

        #crosshair {
            position: absolute; top: 50%; left: 50%;
            width: 8px; height: 8px; transform: translate(-50%, -50%);
        }
        #crosshair::before, #crosshair::after {
            content: ''; position: absolute; background: rgba(0, 255, 0, 0.9);
        }
        #crosshair::before { top: 3px; left: -6px; width: 20px; height: 2px; }
        #crosshair::after { top: -6px; left: 3px; width: 2px; height: 20px; }

        .hud-panel {
            position: absolute; top: 15px; background: rgba(20, 10, 5, 0.85);
            padding: 8px 16px; border-radius: 6px; font-size: 1.1rem; font-weight: bold;
            border: 1px solid rgba(244, 162, 97, 0.4); pointer-events: auto;
        }
        #health-hud { left: 15px; color: #2a9d8f; }
        #score-hud { right: 75px; color: #f4a261; }
        
        #settings-btn {
            position: absolute; top: 15px; right: 15px;
            width: 44px; height: 44px; background: rgba(20, 10, 5, 0.9);
            border: 1.5px solid #f4a261; border-radius: 8px; font-size: 1.3rem;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; pointer-events: auto; z-index: 100;
        }

        #esp-canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 5;
        }

        /* --- ДВИГАЮЩЕЕСЯ МОД МЕНЮ --- */
        #mod-container {
            position: absolute; top: 70px; left: 15px; z-index: 900; pointer-events: auto;
            touch-action: none;
        }
        #mod-toggle-btn {
            background: #9d4edd; color: #fff; border: 2px solid #fff;
            padding: 8px 16px; border-radius: 8px; font-weight: bold; font-size: 0.9rem;
            cursor: move; box-shadow: 0 0 15px rgba(157, 78, 221, 0.8); display: block;
        }
        #mod-menu {
            margin-top: 8px; width: 230px; background: rgba(20, 15, 25, 0.96);
            border: 2px solid #9d4edd; border-radius: 12px; padding: 14px;
            display: none; flex-direction: column; gap: 10px; box-shadow: 0 0 25px rgba(0, 0, 0, 0.9);
        }
        #mod-menu h3 { color: #c77dff; font-size: 0.95rem; text-align: center; border-bottom: 1px solid #444; padding-bottom: 4px; }
        .mod-option { display: flex; align-items: center; justify-content: space-between; font-size: 0.85rem; cursor: pointer; }
        .mod-option input[type="checkbox"] { width: 18px; height: 18px; accent-color: #9d4edd; cursor: pointer; }

        /* --- НАСТРОЙКИ --- */
        #settings-modal {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 310px; background: rgba(18, 12, 10, 0.98); border: 2px solid #f4a261;
            border-radius: 12px; padding: 20px; display: none; flex-direction: column; gap: 15px;
            z-index: 2000; pointer-events: auto; box-shadow: 0 0 40px rgba(0,0,0,0.95);
        }
        #settings-modal h2 { text-align: center; color: #f4a261; font-size: 1.3rem; border-bottom: 1px solid #333; padding-bottom: 8px; }
        .setting-group { display: flex; flex-direction: column; gap: 6px; font-size: 0.85rem; color: #e9c46a; }
        .setting-group select, .setting-group input {
            background: #2b1c14; border: 1px solid #5a3e2e; color: #fff; padding: 6px; border-radius: 4px;
        }
        .close-settings { background: #e76f51; color: #fff; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 5px; }

        /* --- Сенсорное управление --- */
        #touch-controls {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: none; z-index: 15;
        }
        #joystick-zone {
            position: absolute; bottom: 30px; left: 30px; width: 130px; height: 130px;
            background: rgba(255, 255, 255, 0.15); border: 2px solid rgba(255, 255, 255, 0.3); border-radius: 50%;
        }
        #joystick-stick {
            position: absolute; top: 40px; left: 40px; width: 50px; height: 50px;
            background: rgba(244, 162, 97, 0.9); border-radius: 50%;
        }
        #fire-btn {
            position: absolute; bottom: 40px; right: 40px; width: 85px; height: 85px;
            background: rgba(230, 57, 70, 0.85); border: 2px solid #fff; border-radius: 50%;
            display: flex; justify-content: center; align-items: center; font-weight: bold;
            font-size: 0.95rem; box-shadow: 0 0 15px rgba(230, 57, 70, 0.5);
        }
        #touch-look-zone { position: absolute; top: 0; right: 0; width: 50%; height: 100%; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="menu-screen">
        <div class="header">
            <h1>SANDSTONE ULTIMATE</h1>
            <p>WallHack / SpeedFire / Realistic Shooting & Models</p>
        </div>

        <div class="mode-selection">
            <button class="btn" id="start-pc">ПК (Мышь + Клава)</button>
            <button class="btn" id="start-mobile" style="background:#e9c46a;">Телефон (Сенсор)</button>
        </div>
    </div>

    <canvas id="esp-canvas"></canvas>

    <div id="game-hud">
        <div id="crosshair"></div>
        <div id="health-hud" class="hud-panel">+ 100</div>
        <div id="score-hud" class="hud-panel">УБИТО: <span id="score">0</span></div>
        <div id="settings-btn">⚙️</div>
    </div>

    <!-- МОД МЕНЮ -->
    <div id="mod-container">
        <button id="mod-toggle-btn">🟣 MOD MENU</button>
        <div id="mod-menu">
            <h3>DEV MOD MENU</h3>
            <label class="mod-option">
                <span>Включить ESP</span>
                <input type="checkbox" id="esp-toggle">
            </label>
            <label class="mod-option">
                <span>Включить AimBot</span>
                <input type="checkbox" id="aim-toggle">
            </label>
            <label class="mod-option">
                <span>WallHack (Прострелы)</span>
                <input type="checkbox" id="wallhack-toggle">
            </label>
            <div class="setting-group">
                <label>SpeedFire: <span id="speedfire-val">1</span>x</label>
                <input type="range" id="speedfire-rate" min="1" max="5" value="1">
            </div>
            <div class="setting-group">
                <label>Размер Aim FOV: <span id="fov-val">120</span>px</label>
                <input type="range" id="aim-fov" min="40" max="300" value="120">
            </div>
        </div>
    </div>

    <!-- НАСТРОЙКИ -->
    <div id="settings-modal">
        <h2>НАСТРОЙКИ</h2>
        <div class="setting-group">
            <label>Графика:</label>
            <select id="setting-graphics">
                <option value="high" selected>Высокая (Тень + Сглаживание)</option>
                <option value="medium">Средняя</option>
                <option value="low">Низкая (Макс FPS)</option>
            </select>
        </div>
        <div class="setting-group">
            <label>Чувствительность:</label>
            <input type="range" id="setting-sens" min="1" max="10" value="5">
        </div>
        <div class="setting-group">
            <label>Громкость выстрелов:</label>
            <input type="range" id="setting-volume" min="0" max="100" value="80">
        </div>
        <button class="close-settings" id="close-settings">ЗАКРЫТЬ</button>
    </div>

    <div id="touch-controls">
        <div id="touch-look-zone"></div>
        <div id="joystick-zone">
            <div id="joystick-stick"></div>
        </div>
        <div id="fire-btn">ОГОНЬ</div>
    </div>

    <script>
        let scene, camera, renderer;
        let targets = [], obstacles = [], spawnZones = [];
        let score = 0;
        let isGameActive = false, isMobileMode = false;

        const moveState = { forward: 0, right: 0 };
        let speed = 10.0;
        let pitch = 0, yaw = 0;
        let sensMultiplier = 1.0;

        // Зажим & Стрельба
        let isFiring = false;
        let lastShotTime = 0;
        let baseFireInterval = 140; // мс между выстрелами (автоматический зажим)
        let speedFireMultiplier = 1;

        // Оружие и Руки
        let handsGunGroup, muzzleFlash, recoilOffset = 0;

        // Звук
        let audioCtx, masterVolume = 0.8;

        // Мод Меню
        const modSettings = { esp: false, aim: false, wallhack: false, aimFov: 120 };
        let espCanvas, espCtx;

        // UI
        const menuScreen = document.getElementById('menu-screen');
        const gameHud = document.getElementById('game-hud');
        const touchControls = document.getElementById('touch-controls');
        const scoreEl = document.getElementById('score');

        // Материалы Sandstone
        let sandWallMat, darkSandMat, woodCrateMat, barrelMat, plasterMat;

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x9bd0e8);
            scene.fog = new THREE.FogExp2(0xdd9255, 0.008);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            scene.add(camera);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            espCanvas = document.getElementById('esp-canvas');
            espCtx = espCanvas.getContext('2d');
            resizeEspCanvas();

            // Свет
            const ambientLight = new THREE.AmbientLight(0xfff1e6, 0.95);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xffe8d6, 1.3);
            sunLight.position.set(50, 80, 30);
            sunLight.castShadow = true;
            scene.add(sunLight);

            // Материалы
            sandWallMat = new THREE.MeshStandardMaterial({ color: 0xdd9255, roughness: 0.8 });
            darkSandMat = new THREE.MeshStandardMaterial({ color: 0xaa6c39, roughness: 0.85 });
            woodCrateMat = new THREE.MeshStandardMaterial({ color: 0x8b5e3c, roughness: 0.6 });
            barrelMat = new THREE.MeshStandardMaterial({ color: 0x3d5a80, roughness: 0.4 });
            plasterMat = new THREE.MeshStandardMaterial({ color: 0xf4f1de, roughness: 0.9 });

            createSandstoneMap();
            createM4A1WithHands();

            for (let i = 0; i < 8; i++) spawnTarget();

            window.addEventListener('resize', onWindowResize);

            document.getElementById('start-pc').addEventListener('click', () => {
                isMobileMode = false;
                initAudio();
                startGame();
                document.body.requestPointerLock();
            });

            document.getElementById('start-mobile').addEventListener('click', () => {
                isMobileMode = true;
                initAudio();
                startGame();
            });

            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);
            document.addEventListener('mousemove', onMouseMove);

            // Зажим стрельбы для ПК
            document.addEventListener('mousedown', (e) => {
                const modal = document.getElementById('settings-modal');
                if (!isMobileMode && isGameActive && modal.style.display !== 'flex') {
                    if (document.pointerLockElement !== document.body) {
                        document.body.requestPointerLock();
                    } else if (e.button === 0) {
                        isFiring = true;
                    }
                }
            });

            document.addEventListener('mouseup', (e) => {
                if (e.button === 0) isFiring = false;
            });

            setupModMenuDragAndEvents();
            setupSettingsUI();
            setupTouchControls();
            animate(0);
        }

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playGunshotSound() {
            if (!audioCtx || masterVolume <= 0) return;

            const now = audioCtx.currentTime;
            const bufferSize = audioCtx.sampleRate * 0.12;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;

            const noiseFilter = audioCtx.createBiquadFilter();
            noiseFilter.type = 'bandpass';
            noiseFilter.frequency.value = 1300;

            const noiseGain = audioCtx.createGain();
            noiseGain.gain.setValueAtTime(masterVolume * 1.1, now);
            noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);

            noise.connect(noiseFilter);
            noiseFilter.connect(noiseGain);
            noiseGain.connect(audioCtx.destination);

            noise.start(now);
            noise.stop(now + 0.12);
        }

        function resizeEspCanvas() {
            espCanvas.width = window.innerWidth;
            espCanvas.height = window.innerHeight;
        }

        // --- КАРТА SANDSTONE (БОЛЕЕ ИНТЕРЕСНАЯ И ЗАКРЫТАЯ) ---
        function createSandstoneMap() {
            obstacles = []; spawnZones = [];

            const floor = new THREE.Mesh(
                new THREE.PlaneGeometry(160, 160),
                new THREE.MeshStandardMaterial({ color: 0xc98a51, roughness: 0.9 })
            );
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            // Внешняя коробка
            createWall(0, 8, -80, 160, 16, 2, sandWallMat);
            createWall(0, 8, 80, 160, 16, 2, sandWallMat);
            createWall(-80, 8, 0, 2, 16, 160, sandWallMat);
            createWall(80, 8, 0, 2, 16, 160, sandWallMat);

            // Центр (Мид) & Загородки
            createWall(-15, 6, -10, 2, 12, 60, sandWallMat);
            createWall(15, 6, 0, 2, 12, 50, sandWallMat);
            createWall(0, 8, 10, 28, 6, 4, sandWallMat);
            createWall(-5, 6, -35, 20, 12, 2, darkSandMat);

            // Пленты и Коридоры
            createWall(45, 6, -40, 40, 12, 2, plasterMat);
            createWall(25, 6, -60, 2, 12, 40, plasterMat);
            createWall(55, 6, -10, 2, 12, 35, plasterMat);

            createWall(-45, 6, 40, 35, 12, 2, darkSandMat);
            createWall(-25, 6, 55, 2, 12, 30, darkSandMat);
            createWall(-55, 6, 15, 2, 12, 40, darkSandMat);

            spawnZones = [
                { x: 0, z: 65, radius: 4 },
                { x: 0, z: -65, radius: 4 },
                { x: -38, z: -25, radius: 3 },
                { x: 38, z: 25, radius: 3 },
                { x: 42, z: -48, radius: 3 },
                { x: -45, z: 52, radius: 3 }
            ];

            // Ящики и бочки (укрытия)
            spawnCrate(38, 1.5, -43, 3, 3, 3);
            spawnCrate(38, 4.5, -43, 2.5, 3, 2.5);
            spawnCrate(-40, 1.5, 50, 3, 3, 3);
            spawnCrate(0, 1.5, -15, 3, 3, 3);
            spawnCrate(-10, 1.5, 20, 3, 3, 3);
            spawnBarrel(-32, 1.25, -10);
            spawnBarrel(18, 1.25, 15);
        }

        function createWall(x, y, z, w, h, d, mat) {
            const wall = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
            wall.position.set(x, y, z);
            wall.castShadow = true; wall.receiveShadow = true;
            scene.add(wall); obstacles.push(wall);
        }

        function spawnCrate(x, y, z, w, h, d) {
            const crate = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), woodCrateMat);
            crate.position.set(x, y, z);
            crate.castShadow = true; crate.receiveShadow = true;
            scene.add(crate); obstacles.push(crate);
        }

        function spawnBarrel(x, y, z) {
            const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.9, 0.9, 2.4, 12), barrelMat);
            barrel.position.set(x, y, z);
            barrel.castShadow = true; barrel.receiveShadow = true;
            scene.add(barrel); obstacles.push(barrel);
        }

        // --- МОДЕЛЬ РУК С M4A1 ---
        function createM4A1WithHands() {
            handsGunGroup = new THREE.Group();

            const skinMat = new THREE.MeshStandardMaterial({ color: 0xd2a379, roughness: 0.5 });
            const gunMetalMat = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.8, roughness: 0.2 });

            const m4a1 = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.12, 0.45), gunMetalMat);
            const mag = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.18, 0.08), gunMetalMat);
            mag.position.set(0, -0.1, -0.05);
            mag.rotation.x = 0.2;

            const suppressor = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.35, 12), gunMetalMat);
            suppressor.rotation.x = Math.PI / 2;
            suppressor.position.set(0, 0.01, -0.38);

            m4a1.add(body, mag, suppressor);

            muzzleFlash = new THREE.Mesh(new THREE.SphereGeometry(0.09, 8, 8), new THREE.MeshBasicMaterial({ color: 0xffcc00, transparent: true, opacity: 0 }));
            muzzleFlash.position.set(0, 0.01, -0.58);
            m4a1.add(muzzleFlash);

            const rightArm = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.06, 0.4, 12), skinMat);
            rightArm.position.set(0.12, -0.15, 0.05);
            rightArm.rotation.set(-0.5, -0.2, 0.2);

            const leftArm = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.06, 0.45, 12), skinMat);
            leftArm.position.set(-0.12, -0.14, -0.15);
            leftArm.rotation.set(-0.3, 0.4, -0.3);

            handsGunGroup.add(m4a1, rightArm, leftArm);
            handsGunGroup.position.set(0.18, -0.22, -0.38);
            camera.add(handsGunGroup);
        }

        // --- КРАСИВЫЕ ВРАГИ (МОДЕЛЬ ЧЕЛОВЕКА) ---
        function spawnTarget() {
            const human = new THREE.Group();

            const skinMat = new THREE.MeshStandardMaterial({ color: 0xd2a379 });
            const suitMat = new THREE.MeshStandardMaterial({ color: 0x2b3a4a, roughness: 0.7 });
            const vestMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.5 });
            const helmetMat = new THREE.MeshStandardMaterial({ color: 0x1c252e, metalness: 0.3 });

            // Голова
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.24, 12, 12), skinMat);
            head.position.y = 1.62; head.name = "head";

            // Шлем
            const helmet = new THREE.Mesh(new THREE.SphereGeometry(0.26, 12, 12), helmetMat);
            helmet.position.y = 1.65;

            // Торс + Бронежилет
            const torso = new THREE.Mesh(new THREE.BoxGeometry(0.48, 0.65, 0.28), suitMat);
            torso.position.y = 1.15;
            const vest = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.3), vestMat);
            vest.position.y = 1.18;

            // Ноги
            const legL = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.09, 0.8), suitMat);
            legL.position.set(-0.14, 0.4, 0);
            const legR = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.09, 0.8), suitMat);
            legR.position.set(0.14, 0.4, 0);

            // Руки
            const armL = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.07, 0.65), suitMat);
            armL.position.set(-0.32, 1.15, 0);
            const armR = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.07, 0.65), suitMat);
            armR.position.set(0.32, 1.15, 0);

            human.add(head, helmet, torso, vest, legL, legR, armL, armR);

            let posX = 0, posZ = 0, validPos = false, attempts = 0;
            while (!validPos && attempts < 30) {
                attempts++;
                const zone = spawnZones[Math.floor(Math.random() * spawnZones.length)];
                posX = zone.x + (Math.random() - 0.5) * zone.radius * 2;
                posZ = zone.z + (Math.random() - 0.5) * zone.radius * 2;
                if (!checkCollision(new THREE.Vector3(posX, 1.0, posZ), 1.2)) validPos = true;
            }

            human.position.set(posX, 0, posZ);
            scene.add(human); targets.push(human);
        }

        // --- ЛОГИКА ВЫСТРЕЛА С УЧЕТОМ WALLHACK И СТЕН ---
        function shoot() {
            recoilOffset = 0.08;
            muzzleFlash.material.opacity = 1;
            setTimeout(() => { muzzleFlash.material.opacity = 0; }, 30);

            playGunshotSound();

            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

            if (modSettings.wallhack) {
                // WALLHACK ВКЛЮЧЕН: Стреляем прямо во врагов сквозь любые препятствия
                const enemyMeshes = [];
                targets.forEach(t => t.traverse(c => { if (c.isMesh) enemyMeshes.push(c); }));

                const intersects = raycaster.intersectObjects(enemyMeshes);
                if (intersects.length > 0) {
                    let hitTarget = intersects[0].object;
                    while (hitTarget.parent && !targets.includes(hitTarget)) {
                        hitTarget = hitTarget.parent;
                    }
                    killTarget(hitTarget);
                }
            } else {
                // РЕАЛИСТИЧНАЯ СТРЕЛЬБА: Пуля застревает в первой же стене
                const allObjects = [];
                obstacles.forEach(o => allObjects.push(o));
                targets.forEach(t => t.traverse(c => { if (c.isMesh) allObjects.push(c); }));

                const intersects = raycaster.intersectObjects(allObjects);
                if (intersects.length > 0) {
                    const hitObj = intersects[0].object;
                    let hitTarget = hitObj;
                    while (hitTarget.parent && !targets.includes(hitTarget)) {
                        hitTarget = hitTarget.parent;
                    }

                    if (targets.includes(hitTarget)) {
                        killTarget(hitTarget);
                    }
                }
            }
        }

        function killTarget(hitTarget) {
            scene.remove(hitTarget);
            targets = targets.filter(t => t !== hitTarget);
            score++; scoreEl.innerText = score;
            setTimeout(spawnTarget, 600);
        }

        // --- ДВИГАЕМОЕ МОД МЕНЮ ---
        function setupModMenuDragAndEvents() {
            const modContainer = document.getElementById('mod-container');
            const modBtn = document.getElementById('mod-toggle-btn');
            const modMenu = document.getElementById('mod-menu');

            let isDragging = false;
            let startX, startY, initialLeft, initialTop;

            const startDrag = (e) => {
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                isDragging = false;
                startX = clientX; startY = clientY;
                const rect = modContainer.getBoundingClientRect();
                initialLeft = rect.left; initialTop = rect.top;

                window.addEventListener('mousemove', onDrag);
                window.addEventListener('touchmove', onDrag);
                window.addEventListener('mouseup', stopDrag);
                window.addEventListener('touchend', stopDrag);
            };

            const onDrag = (e) => {
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                const dx = clientX - startX;
                const dy = clientY - startY;

                if (Math.hypot(dx, dy) > 5) isDragging = true;

                modContainer.style.left = `${initialLeft + dx}px`;
                modContainer.style.top = `${initialTop + dy}px`;
            };

            const stopDrag = () => {
                window.removeEventListener('mousemove', onDrag);
                window.removeEventListener('touchmove', onDrag);
                window.removeEventListener('mouseup', stopDrag);
                window.removeEventListener('touchend', stopDrag);
            };

            modBtn.addEventListener('mousedown', startDrag);
            modBtn.addEventListener('touchstart', startDrag);

            modBtn.addEventListener('click', () => {
                if (!isDragging) {
                    modMenu.style.display = (modMenu.style.display === 'flex') ? 'none' : 'flex';
                }
            });

            document.getElementById('esp-toggle').addEventListener('change', (e) => modSettings.esp = e.target.checked);
            document.getElementById('aim-toggle').addEventListener('change', (e) => modSettings.aim = e.target.checked);
            document.getElementById('wallhack-toggle').addEventListener('change', (e) => modSettings.wallhack = e.target.checked);
            
            document.getElementById('speedfire-rate').addEventListener('input', (e) => {
                speedFireMultiplier = parseInt(e.target.value);
                document.getElementById('speedfire-val').innerText = speedFireMultiplier;
            });

            document.getElementById('aim-fov').addEventListener('input', (e) => {
                modSettings.aimFov = parseInt(e.target.value);
                document.getElementById('fov-val').innerText = modSettings.aimFov;
            });
        }

        // --- НАСТРОЙКИ (ПОЧИНЕНЫ) ---
        function setupSettingsUI() {
            const modal = document.getElementById('settings-modal');
            const openBtn = document.getElementById('settings-btn');
            const closeBtn = document.getElementById('close-settings');

            const openSettings = (e) => {
                e.stopPropagation();
                if (document.pointerLockElement) {
                    document.exitPointerLock();
                }
                modal.style.display = 'flex';
            };

            openBtn.addEventListener('click', openSettings);
            openBtn.addEventListener('touchstart', openSettings);

            closeBtn.addEventListener('click', () => {
                modal.style.display = 'none';
                if (!isMobileMode && isGameActive) {
                    document.body.requestPointerLock();
                }
            });

            document.getElementById('setting-graphics').addEventListener('change', (e) => {
                const val = e.target.value;
                if (val === 'low') {
                    renderer.setPixelRatio(0.6);
                    renderer.shadowMap.enabled = false;
                } else if (val === 'medium') {
                    renderer.setPixelRatio(1.0);
                    renderer.shadowMap.enabled = false;
                } else {
                    renderer.setPixelRatio(window.devicePixelRatio);
                    renderer.shadowMap.enabled = true;
                }
            });

            document.getElementById('setting-sens').addEventListener('input', (e) => {
                sensMultiplier = parseFloat(e.target.value) / 5.0;
            });

            document.getElementById('setting-volume').addEventListener('input', (e) => {
                masterVolume = parseFloat(e.target.value) / 100.0;
            });
        }

        function startGame() {
            isGameActive = true;
            menuScreen.style.display = 'none';
            gameHud.style.display = 'block';
            if (isMobileMode) touchControls.style.display = 'block';
            camera.position.set(0, 1.7, 65);
        }

        const keys = {};
        function onKeyDown(e) { if(!isMobileMode) keys[e.code] = true; updateKeyboardMove(); }
        function onKeyUp(e) { if(!isMobileMode) keys[e.code] = false; updateKeyboardMove(); }
        function updateKeyboardMove() {
            moveState.forward = (keys['KeyW'] ? 1 : 0) - (keys['KeyS'] ? 1 : 0);
            moveState.right = (keys['KeyD'] ? 1 : 0) - (keys['KeyA'] ? 1 : 0);
        }

        function onMouseMove(e) {
            if (!isGameActive || isMobileMode || document.pointerLockElement !== document.body) return;
            yaw -= e.movementX * 0.002 * sensMultiplier;
            pitch -= e.movementY * 0.002 * sensMultiplier;
            applyRotation();
        }

        function applyRotation() {
            pitch = Math.max(-Math.PI / 2 + 0.1, Math.min(Math.PI / 2 - 0.1, pitch));
            camera.rotation.order = 'YXZ';
            camera.rotation.y = yaw;
            camera.rotation.x = pitch;
        }

        function setupTouchControls() {
            const joystickZone = document.getElementById('joystick-zone');
            const stick = document.getElementById('joystick-stick');
            const fireBtn = document.getElementById('fire-btn');
            const lookZone = document.getElementById('touch-look-zone');

            let joystickTouchId = null, lookTouchId = null;
            let lastLookX = 0, lastLookY = 0;

            joystickZone.addEventListener('touchstart', (e) => {
                const touch = e.changedTouches[0];
                joystickTouchId = touch.identifier;
                updateJoystick(touch);
            });

            window.addEventListener('touchmove', (e) => {
                for (let touch of e.changedTouches) {
                    if (touch.identifier === joystickTouchId) {
                        updateJoystick(touch);
                    } else if (touch.identifier === lookTouchId) {
                        const dx = touch.clientX - lastLookX;
                        const dy = touch.clientY - lastLookY;
                        yaw -= dx * 0.005 * sensMultiplier;
                        pitch -= dy * 0.005 * sensMultiplier;
                        applyRotation();
                        lastLookX = touch.clientX; lastLookY = touch.clientY;
                    }
                }
            });

            window.addEventListener('touchend', (e) => {
                for (let touch of e.changedTouches) {
                    if (touch.identifier === joystickTouchId) {
                        joystickTouchId = null;
                        stick.style.left = '40px'; stick.style.top = '40px';
                        moveState.forward = 0; moveState.right = 0;
                    } else if (touch.identifier === lookTouchId) {
                        lookTouchId = null;
                    }
                }
            });

            function updateJoystick(touch) {
                const rect = joystickZone.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;

                let dx = touch.clientX - centerX;
                let dy = touch.clientY - centerY;
                const dist = Math.min(Math.hypot(dx, dy), 45);
                const angle = Math.atan2(dy, dx);

                stick.style.left = `${40 + Math.cos(angle) * dist}px`;
                stick.style.top = `${40 + Math.sin(angle) * dist}px`;

                moveState.forward = -Math.sin(angle) * (dist / 45);
                moveState.right = Math.cos(angle) * (dist / 45);
            }

            lookZone.addEventListener('touchstart', (e) => {
                const touch = e.changedTouches[0];
                lookTouchId = touch.identifier;
                lastLookX = touch.clientX; lastLookY = touch.clientY;
            });

            fireBtn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                isFiring = true;
            });
            fireBtn.addEventListener('touchend', (e) => {
                e.preventDefault();
                isFiring = false;
            });
        }

        function checkCollision(newPosition, radius = 0.8) {
            for (let obstacle of obstacles) {
                const box = new THREE.Box3().setFromObject(obstacle);
                const closestPoint = new THREE.Vector3();
                box.clampPoint(newPosition, closestPoint);
                if (newPosition.distanceTo(closestPoint) < radius) return true;
            }
            return false;
        }

        function toScreenPosition(obj, camera) {
            const vector = new THREE.Vector3();
            obj.getWorldPosition(vector);
            vector.project(camera);
            if (vector.z > 1) return { x: -1000, y: -1000, visible: false };

            const widthHalf = window.innerWidth / 2;
            const heightHalf = window.innerHeight / 2;
            return {
                x: (vector.x * widthHalf) + widthHalf,
                y: -(vector.y * heightHalf) + heightHalf,
                visible: true
            };
        }

        function processModFeatures() {
            espCtx.clearRect(0, 0, espCanvas.width, espCanvas.height);
            const screenCenter = { x: window.innerWidth / 2, y: window.innerHeight / 2 };

            if (modSettings.aim) {
                espCtx.beginPath();
                espCtx.arc(screenCenter.x, screenCenter.y, modSettings.aimFov, 0, Math.PI * 2);
                espCtx.strokeStyle = 'rgba(157, 78, 221, 0.7)';
                espCtx.lineWidth = 2; espCtx.stroke();
            }

            let bestTarget = null, closestDist = Infinity;

            targets.forEach(target => {
                const head = target.getObjectByName("head");
                if (!head) return;

                const headPos = toScreenPosition(head, camera);
                const basePos = toScreenPosition(target, camera);

                if (!headPos.visible) return;

                const boxHeight = Math.abs(basePos.y - headPos.y) * 1.8;
                const boxWidth = boxHeight * 0.55;

                if (modSettings.esp) {
                    espCtx.strokeStyle = '#ef4444';
                    espCtx.lineWidth = 2;
                    espCtx.strokeRect(headPos.x - boxWidth / 2, headPos.y - boxHeight * 0.1, boxWidth, boxHeight);
                }

                if (modSettings.aim) {
                    const dist = Math.hypot(headPos.x - screenCenter.x, headPos.y - screenCenter.y);
                    if (dist <= modSettings.aimFov && dist < closestDist) {
                        closestDist = dist; bestTarget = head;
                    }
                }
            });

            if (modSettings.aim && bestTarget) {
                const headWorldPos = new THREE.Vector3();
                bestTarget.getWorldPosition(headWorldPos);
                const dir = headWorldPos.clone().sub(camera.position).normalize();
                yaw += (Math.atan2(-dir.x, -dir.z) - yaw) * 0.25;
                pitch += (Math.asin(dir.y) - pitch) * 0.25;
                applyRotation();
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            resizeEspCanvas();
        }

        let prevTime = performance.now();
        function animate(time) {
            requestAnimationFrame(animate);

            if (isGameActive) {
                const delta = (time - prevTime) / 1000;

                // Перемещение
                const moveVector = new THREE.Vector3();
                const sinYaw = Math.sin(yaw), cosYaw = Math.cos(yaw);

                if (Math.abs(moveState.forward) > 0.05) {
                    moveVector.x -= sinYaw * moveState.forward * speed * delta;
                    moveVector.z -= cosYaw * moveState.forward * speed * delta;
                }
                if (Math.abs(moveState.right) > 0.05) {
                    moveVector.x += cosYaw * moveState.right * speed * delta;
                    moveVector.z -= sinYaw * moveState.right * speed * delta;
                }

                const nextX = camera.position.clone().add(new THREE.Vector3(moveVector.x, 0, 0));
                if (!checkCollision(nextX)) camera.position.x = nextX.x;

                const nextZ = camera.position.clone().add(new THREE.Vector3(0, 0, moveVector.z));
                if (!checkCollision(nextZ)) camera.position.z = nextZ.z;

                camera.position.y = 1.7;

                // Зажим и SpeedFire
                if (isFiring) {
                    const currentInterval = baseFireInterval / speedFireMultiplier;
                    if (time - lastShotTime >= currentInterval) {
                        shoot();
                        lastShotTime = time;
                    }
                }

                recoilOffset += (0 - recoilOffset) * 0.15;
                handsGunGroup.position.z = -0.38 + recoilOffset;

                processModFeatures();
            }

            prevTime = time;
            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
