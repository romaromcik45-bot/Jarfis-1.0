<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Standoff / CS 3D Browser</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #121212;
            color: #fff;
        }

        /* --- Стартовое меню и Скриншоты --- */
        #menu-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px;
            background: linear-gradient(135deg, #1a1c23 0%, #0d0e12 100%);
            z-index: 10;
        }

        .header {
            text-align: center;
        }
        .header h1 {
            font-size: 3rem;
            letter-spacing: 3px;
            color: #ff9d00;
            text-shadow: 0 0 10px rgba(255, 157, 0, 0.5);
        }
        .header p {
            color: #8a8d9b;
            margin-top: 5px;
        }

        .gallery-container {
            width: 100%;
            max-width: 900px;
        }
        .gallery-title {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: #d1d5db;
            border-left: 4px solid #ff9d00;
            padding-left: 10px;
        }
        .screenshots {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }
        .screen-card {
            background: #222531;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #333748;
            transition: transform 0.2s, border-color 0.2s;
        }
        .screen-card:hover {
            transform: translateY(-5px);
            border-color: #ff9d00;
        }
        .screen-mockup {
            height: 140px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            color: rgba(255, 255, 255, 0.8);
            position: relative;
        }
        .mock-1 { background: linear-gradient(45deg, #2b32b2, #1488cc); }
        .mock-2 { background: linear-gradient(45deg, #cc2b5e, #753a88); }
        .mock-3 { background: linear-gradient(45deg, #42275a, #734b6d); }
        .screen-card p {
            padding: 10px;
            font-size: 0.85rem;
            text-align: center;
            color: #9ca3af;
        }

        .start-btn {
            padding: 16px 48px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #000;
            background: #ff9d00;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 157, 0, 0.4);
            transition: background 0.2s, transform 0.1s;
        }
        .start-btn:hover {
            background: #ffb700;
            transform: scale(1.05);
        }

        /* --- Игровой Интерфейс (HUD) --- */
        #game-hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            pointer-events: none;
        }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            transform: translate(-50%, -50%);
        }
        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: rgba(0, 255, 0, 0.8);
        }
        #crosshair::before { top: 4px; left: -8px; width: 26px; height: 2px; }
        #crosshair::after { top: -8px; left: 4px; width: 2px; height: 26px; }

        .hud-panel {
            position: absolute;
            bottom: 20px;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px 25px;
            border-radius: 6px;
            border-left: 4px solid #ff9d00;
            font-size: 1.5rem;
            font-weight: bold;
        }
        #health-hud { left: 20px; color: #4ade80; }
        #score-hud { right: 20px; color: #ff9d00; }

        #instructions {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
        }
    </style>
    <!-- Подгружаем библиотеки 3D-движка Three.js без скачивания лишних файлов -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <!-- Меню и Скриншоты -->
    <div id="menu-screen">
        <div class="header">
            <h1>STANDOFF / CS 3D</h1>
            <p>Браузерный 3D Прототип в одном файле</p>
        </div>

        <div class="gallery-container">
            <div class="gallery-title">Скриншоты и Модули</div>
            <div class="screenshots">
                <div class="screen-card">
                    <div class="screen-mockup mock-1">3D Map</div>
                    <p>Трехмерная арена с укрытиями</p>
                </div>
                <div class="screen-card">
                    <div class="screen-mockup mock-2">FPS Gun</div>
                    <p>Стрельба, прицел, отдача</p>
                </div>
                <div class="screen-card">
                    <div class="screen-mockup mock-3">AI Targets</div>
                    <p>Интерактивные 3D мишени</p>
                </div>
            </div>
        </div>

        <button class="start-btn" id="start-btn">ИГРАТЬ (КЛИК)</button>
    </div>

    <!-- Игровой HUD (Интерфейс поверх 3D) -->
    <div id="game-hud">
        <div id="crosshair"></div>
        <div id="instructions">WASD — Перемещение | Мышь — Обзор | ЛКМ — Стрельба | ESC — Меню</div>
        <div id="health-hud" class="hud-panel">+ 100</div>
        <div id="score-hud" class="hud-panel">УБИТО: <span id="score">0</span></div>
    </div>

    <script>
        // --- Переменные игры ---
        let scene, camera, renderer;
        let targets = [];
        let score = 0;
        let isLocked = false;

        // Движение
        const moveState = { forward: false, backward: false, left: false, right: false };
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();
        const speed = 12.0;

        // Вращение камеры
        let pitch = 0, yaw = 0;

        // Модель оружия и вспышка
        let gunGroup, muzzleFlash;

        // DOM
        const menuScreen = document.getElementById('menu-screen');
        const gameHud = document.getElementById('game-hud');
        const startBtn = document.getElementById('start-btn');
        const scoreEl = document.getElementById('score');

        // --- Инициализация ---
        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1e1e24);
            scene.fog = new THREE.FogExp2(0x1e1e24, 0.015);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            // Свет
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(20, 40, 20);
            dirLight.castShadow = true;
            scene.add(dirLight);

            // Создание арены и оружия
            createMap();
            createGun();

            // Спавн мишеней
            for (let i = 0; i < 6; i++) {
                spawnTarget();
            }

            // Слушатели событий
            window.addEventListener('resize', onWindowResize);
            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);
            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('mousedown', onShoot);

            startBtn.addEventListener('click', () => {
                document.body.requestPointerLock();
            });

            document.addEventListener('pointerlockchange', () => {
                if (document.pointerLockElement === document.body) {
                    isLocked = true;
                    menuScreen.style.display = 'none';
                    gameHud.style.display = 'block';
                } else {
                    isLocked = false;
                    menuScreen.style.display = 'flex';
                    gameHud.style.display = 'none';
                }
            });

            animate(0);
        }

        // --- Карта ---
        function createMap() {
            // Пол
            const floorGeo = new THREE.PlaneGeometry(80, 80);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x2c2c34, roughness: 0.8 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            // Стены
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x3f3f4c });
            const wallGeo = new THREE.BoxGeometry(80, 10, 2);

            const N = new THREE.Mesh(wallGeo, wallMat); N.position.set(0, 5, -40); scene.add(N);
            const S = new THREE.Mesh(wallGeo, wallMat); S.position.set(0, 5, 40); scene.add(S);
            const E = new THREE.Mesh(wallGeo, wallMat); E.position.set(40, 5, 0); E.rotation.y = Math.PI/2; scene.add(E);
            const W = new THREE.Mesh(wallGeo, wallMat); W.position.set(-40, 5, 0); W.rotation.y = Math.PI/2; scene.add(W);

            // Ящики / Укрытия
            const boxGeo = new THREE.BoxGeometry(3, 3, 3);
            const boxMat = new THREE.MeshStandardMaterial({ color: 0xd97706 });
            const boxPositions = [[-10, 1.5, -10], [10, 1.5, -15], [-5, 1.5, 10], [15, 1.5, 5]];
            
            boxPositions.forEach(pos => {
                const box = new THREE.Mesh(boxGeo, boxMat);
                box.position.set(...pos);
                box.castShadow = true;
                box.receiveShadow = true;
                scene.add(box);
            });
        }

        // --- Модель оружия ---
        function createGun() {
            gunGroup = new THREE.Group();

            const bodyGeo = new THREE.BoxGeometry(0.12, 0.18, 0.7);
            const gunMat = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.8 });
            const body = new THREE.Mesh(bodyGeo, gunMat);

            const barrelGeo = new THREE.CylinderGeometry(0.03, 0.03, 0.4);
            const barrel = new THREE.Mesh(barrelGeo, gunMat);
            barrel.rotation.x = Math.PI / 2;
            barrel.position.set(0, 0.03, -0.45);

            const flashGeo = new THREE.SphereGeometry(0.08, 8, 8);
            const flashMat = new THREE.MeshBasicMaterial({ color: 0xffaa00, transparent: true, opacity: 0 });
            muzzleFlash = new THREE.Mesh(flashGeo, flashMat);
            muzzleFlash.position.set(0, 0.03, -0.7);

            gunGroup.add(body, barrel, muzzleFlash);
            
            gunGroup.position.set(0.25, -0.25, -0.5);
            camera.add(gunGroup);
            scene.add(camera);
        }

        // --- Создание Врагов/Мишеней ---
        function spawnTarget() {
            const targetGroup = new THREE.Group();

            const head = new THREE.Mesh(
                new THREE.SphereGeometry(0.4, 16, 16),
                new THREE.MeshStandardMaterial({ color: 0xef4444 })
            );
            head.position.y = 1.6;
            head.castShadow = true;

            const body = new THREE.Mesh(
                new THREE.CylinderGeometry(0.4, 0.3, 1.2),
                new THREE.MeshStandardMaterial({ color: 0x991b1b })
            );
            body.position.y = 0.8;
            body.castShadow = true;

            targetGroup.add(head, body);

            targetGroup.position.x = (Math.random() - 0.5) * 60;
            targetGroup.position.z = -10 - Math.random() * 25;

            scene.add(targetGroup);
            targets.push(targetGroup);
        }

        // --- Управление ---
        function onKeyDown(e) {
            if (!isLocked) return;
            switch (e.code) {
                case 'KeyW': moveState.forward = true; break;
                case 'KeyS': moveState.backward = true; break;
                case 'KeyA': moveState.left = true; break;
                case 'KeyD': moveState.right = true; break;
            }
        }

        function onKeyUp(e) {
            if (!isLocked) return;
            switch (e.code) {
                case 'KeyW': moveState.forward = false; break;
                case 'KeyS': moveState.backward = false; break;
                case 'KeyA': moveState.left = false; break;
                case 'KeyD': moveState.right = false; break;
            }
        }

        function onMouseMove(e) {
            if (!isLocked) return;

            const sensitivity = 0.002;
            yaw -= e.movementX * sensitivity;
            pitch -= e.movementY * sensitivity;

            pitch = Math.max(-Math.PI / 2 + 0.1, Math.min(Math.PI / 2 - 0.1, pitch));

            camera.rotation.order = 'YXZ';
            camera.rotation.y = yaw;
            camera.rotation.x = pitch;
        }

        // --- Стрельба ---
        function onShoot(e) {
            if (!isLocked || e.button !== 0) return;

            // Отдача и вспышка
            gunGroup.position.z = -0.4;
            muzzleFlash.material.opacity = 1;
            setTimeout(() => { muzzleFlash.material.opacity = 0; }, 50);

            // Проверка попадания
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

            const allTargetMeshes = [];
            targets.forEach(t => t.traverse(child => { if(child.isMesh) allTargetMeshes.push(child); }));

            const intersects = raycaster.intersectObjects(allTargetMeshes);

            if (intersects.length > 0) {
                const hitMesh = intersects[0].object;
                const hitTargetGroup = hitMesh.parent;

                scene.remove(hitTargetGroup);
                targets = targets.filter(t => t !== hitTargetGroup);

                score++;
                scoreEl.innerText = score;

                setTimeout(spawnTarget, 1000);
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- Игровой цикл ---
        let prevTime = performance.now();

        function animate(time) {
            requestAnimationFrame(animate);

            if (isLocked) {
                const delta = (time - prevTime) / 1000;

                // Возврат оружия после отдачи
                gunGroup.position.z += (-0.5 - gunGroup.position.z) * 0.1;

                // Физика движения
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;

                direction.z = Number(moveState.forward) - Number(moveState.backward);
                direction.x = Number(moveState.right) - Number(moveState.left);
                direction.normalize();

                if (moveState.forward || moveState.backward) velocity.z -= direction.z * speed * 10.0 * delta;
                if (moveState.left || moveState.right) velocity.x -= direction.x * speed * 10.0 * delta;

                camera.translateX(-velocity.x * delta);
                camera.translateZ(velocity.z * delta);

                camera.position.y = 1.7; // Высота игрока
            }

            prevTime = time;
            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
