<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Standoff 2 - Sandstone M4A1 HD</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0; padding: 0;
            user-select: none; -webkit-user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
        }
        body, html {
            width: 100%; height: 100%;
            overflow: hidden; background-color: #d4a373; color: #fff;
        }

        /* --- Главное меню --- */
        #menu-screen {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex; flex-direction: column;
            justify-content: space-between; align-items: center;
            padding: 20px;
            background: linear-gradient(135deg, #1c130d 0%, #0d0805 100%);
            z-index: 20;
        }

        .header { text-align: center; margin-top: 10px; }
        .header h1 {
            font-size: 2.2rem; color: #f4a261;
            text-shadow: 0 0 12px rgba(244, 162, 97, 0.6);
        }
        .header p { color: #e9c46a; font-size: 0.9rem; margin-top: 5px; }

        .gallery-container { width: 100%; max-width: 800px; }
        .screenshots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .screen-card {
            background: #2b1c14; border-radius: 8px; overflow: hidden;
            border: 1px solid #4a3022; text-align: center; font-size: 0.8rem; padding-bottom: 8px;
        }
        .screen-mockup {
            height: 90px; display: flex; justify-content: center; align-items: center;
            font-weight: bold; color: #fff;
        }
        .mock-1 { background: linear-gradient(45deg, #e76f51, #f4a261); }
        .mock-2 { background: linear-gradient(45deg, #2a9d8f, #e9c46a); }
        .mock-3 { background: linear-gradient(45deg, #d4a373, #875c36); }

        .mode-selection { display: flex; gap: 15px; margin-bottom: 10px; width: 100%; max-width: 400px; }
        .btn {
            flex: 1; padding: 14px; font-size: 1rem; font-weight: bold;
            color: #170d08; background: #f4a261; border: none; border-radius: 6px;
            cursor: pointer; box-shadow: 0 0 10px rgba(244, 162, 97, 0.4);
        }
        .btn:active { transform: scale(0.98); }

        /* --- HUD --- */
        #game-hud {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: none; pointer-events: none; z-index: 5;
        }

        #crosshair {
            position: absolute; top: 50%; left: 50%;
            width: 8px; height: 8px; transform: translate(-50%, -50%);
        }
        #crosshair::before, #crosshair::after {
            content: ''; position: absolute; background: rgba(0, 255, 0, 0.9);
        }
        #crosshair::before { top: 3px; left: -6px; width: 20px; height: 2px; }
        #crosshair::after { top: -6px; left: 3px; width: 2px; height: 20px; }

        .hud-panel {
            position: absolute; top: 15px; background: rgba(20, 10, 5, 0.75);
            padding: 8px 16px; border-radius: 6px; font-size: 1.1rem; font-weight: bold;
            border: 1px solid rgba(244, 162, 97, 0.3);
        }
        #health-hud { left: 15px; color: #2a9d8f; }
        #score-hud { right: 15px; color: #f4a261; }

        #esp-canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 4;
        }

        /* --- Мод Меню --- */
        #mod-container {
            position: absolute; top: 60px; left: 15px; z-index: 9999; pointer-events: auto;
        }
        #mod-toggle-btn {
            background: #9d4edd; color: #fff; border: 2px solid #fff;
            padding: 10px 16px; border-radius: 8px; font-weight: bold; font-size: 0.9rem;
            cursor: pointer; box-shadow: 0 0 15px rgba(157, 78, 221, 0.8); display: block;
        }
        #mod-menu {
            margin-top: 10px; width: 250px; background: rgba(20, 15, 25, 0.96);
            border: 2px solid #9d4edd; border-radius: 12px; padding: 16px;
            display: none; flex-direction: column; gap: 14px; box-shadow: 0 0 25px rgba(0, 0, 0, 0.9);
        }
        #mod-menu h3 { color: #c77dff; font-size: 1.1rem; text-align: center; border-bottom: 1px solid #444; padding-bottom: 6px; }
        .mod-option { display: flex; align-items: center; justify-content: space-between; font-size: 0.95rem; cursor: pointer; }
        .mod-option input[type="checkbox"] { width: 20px; height: 20px; accent-color: #9d4edd; cursor: pointer; }
        .slider-group { display: flex; flex-direction: column; gap: 6px; font-size: 0.85rem; }
        .slider-group input[type="range"] { accent-color: #9d4edd; cursor: pointer; }

        /* --- Сенсорное управление --- */
        #touch-controls {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: none; z-index: 10;
        }
        #joystick-zone {
            position: absolute; bottom: 30px; left: 30px; width: 130px; height: 130px;
            background: rgba(255, 255, 255, 0.15); border: 2px solid rgba(255, 255, 255, 0.3); border-radius: 50%;
        }
        #joystick-stick {
            position: absolute; top: 40px; left: 40px; width: 50px; height: 50px;
            background: rgba(244, 162, 97, 0.9); border-radius: 50%;
        }
        #fire-btn {
            position: absolute; bottom: 40px; right: 40px; width: 80px; height: 80px;
            background: rgba(230, 57, 70, 0.85); border: 2px solid #fff; border-radius: 50%;
            display: flex; justify-content: center; align-items: center; font-weight: bold;
            font-size: 0.9rem; box-shadow: 0 0 15px rgba(230, 57, 70, 0.5);
        }
        #touch-look-zone { position: absolute; top: 0; right: 0; width: 50%; height: 100%; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="menu-screen">
        <div class="header">
            <h1>SANDSTONE HD</h1>
            <p>M4A1 Hands & Full Corridors Map</p>
        </div>

        <div class="gallery-container">
            <div class="screenshots">
                <div class="screen-card">
                    <div class="screen-mockup mock-1">M4A1 HANDS</div>
                    <p>Руки и Автомат</p>
                </div>
                <div class="screen-card">
                    <div class="screen-mockup mock-2">CORRIDORS</div>
                    <p>Узкие туннели</p>
                </div>
                <div class="screen-card">
                    <div class="screen-mockup mock-3">NO CLIP SPAWN</div>
                    <p>Без спавна в стенах</p>
                </div>
            </div>
        </div>

        <div class="mode-selection">
            <button class="btn" id="start-pc">ПК (Клавиатура + Мышь)</button>
            <button class="btn" id="start-mobile" style="background:#e9c46a;">Телефон (Сенсор)</button>
        </div>
    </div>

    <canvas id="esp-canvas"></canvas>

    <div id="game-hud">
        <div id="crosshair"></div>
        <div id="health-hud" class="hud-panel">+ 100</div>
        <div id="score-hud" class="hud-panel">УБИТО: <span id="score">0</span></div>
    </div>

    <div id="mod-container">
        <button id="mod-toggle-btn">⚙️ MOD MENU</button>
        <div id="mod-menu">
            <h3>DEV MOD MENU</h3>
            <label class="mod-option" for="esp-toggle">
                <span>Включить ESP</span>
                <input type="checkbox" id="esp-toggle">
            </label>
            <label class="mod-option" for="aim-toggle">
                <span>Включить AimBot</span>
                <input type="checkbox" id="aim-toggle">
            </label>
            <div class="slider-group">
                <label for="aim-fov">Размер круга Aim (FOV): <span id="fov-val">120</span>px</label>
                <input type="range" id="aim-fov" min="40" max="300" value="120">
            </div>
        </div>
    </div>

    <div id="touch-controls">
        <div id="touch-look-zone"></div>
        <div id="joystick-zone">
            <div id="joystick-stick"></div>
        </div>
        <div id="fire-btn">ОГОНЬ</div>
    </div>

    <script>
        let scene, camera, renderer;
        let targets = [], obstacles = [], spawnZones = [];
        let score = 0;
        let isGameActive = false, isMobileMode = false;

        const moveState = { forward: 0, right: 0 };
        const speed = 10.0;
        let pitch = 0, yaw = 0;

        // Оружие и Hands
        let handsGunGroup, muzzleFlash, recoilOffset = 0, bobbingAngle = 0;

        // Мод-Меню
        const modSettings = { esp: false, aim: false, aimFov: 120 };
        let espCanvas, espCtx;

        // UI Элементы
        const menuScreen = document.getElementById('menu-screen');
        const gameHud = document.getElementById('game-hud');
        const touchControls = document.getElementById('touch-controls');
        const scoreEl = document.getElementById('score');

        // Текстуры и Материалы Sandstone
        let sandWallMat, darkSandMat, woodCrateMat, barrelMat, plasterMat, roofMat;

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x9bd0e8);
            scene.fog = new THREE.FogExp2(0xd4a373, 0.009);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            espCanvas = document.getElementById('esp-canvas');
            espCtx = espCanvas.getContext('2d');
            resizeEspCanvas();

            // Свет (Солнечный песчаный день)
            const ambientLight = new THREE.AmbientLight(0xfff1e6, 0.75);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xffe8d6, 1.2);
            sunLight.position.set(50, 80, 30);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            scene.add(sunLight);

            // Материалы
            sandWallMat = new THREE.MeshStandardMaterial({ color: 0xdd9255, roughness: 0.85 });
            darkSandMat = new THREE.MeshStandardMaterial({ color: 0xaa6c39, roughness: 0.9 });
            woodCrateMat = new THREE.MeshStandardMaterial({ color: 0x8b5e3c, roughness: 0.6 });
            barrelMat = new THREE.MeshStandardMaterial({ color: 0x3d5a80, roughness: 0.4 });
            plasterMat = new THREE.MeshStandardMaterial({ color: 0xf4f1de, roughness: 0.8 });
            roofMat = new THREE.MeshStandardMaterial({ color: 0x8d5b4c, roughness: 0.9 });

            createFullSandstoneMap();
            createM4A1WithHands();

            for (let i = 0; i < 8; i++) spawnTarget();

            window.addEventListener('resize', onWindowResize);

            document.getElementById('start-pc').addEventListener('click', () => {
                isMobileMode = false;
                document.body.requestPointerLock();
            });

            document.getElementById('start-mobile').addEventListener('click', () => {
                isMobileMode = true;
                startGame();
            });

            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);
            document.addEventListener('mousemove', onMouseMove);

            document.addEventListener('mousedown', (e) => {
                const modMenu = document.getElementById('mod-menu');
                if (!isMobileMode && isGameActive && modMenu.style.display !== 'flex') {
                    if (document.pointerLockElement !== document.body) {
                        document.body.requestPointerLock();
                    } else if (e.button === 0) {
                        shoot();
                    }
                }
            });

            document.addEventListener('pointerlockchange', () => {
                if (!isMobileMode && document.pointerLockElement === document.body) startGame();
            });

            setupModMenuUI();
            setupTouchControls();
            animate(0);
        }

        function resizeEspCanvas() {
            espCanvas.width = window.innerWidth;
            espCanvas.height = window.innerHeight;
        }

        // --- СОЗДАНИЕ КАРТЫ С КОРИДОРАМИ И ТУННЕЛЯМИ (SANDSTONE) ---
        function createFullSandstoneMap() {
            obstacles = [];
            spawnZones = [];

            // Земля
            const floor = new THREE.Mesh(
                new THREE.PlaneGeometry(160, 160),
                new THREE.MeshStandardMaterial({ color: 0xc98a51, roughness: 0.95 })
            );
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            // Внешний периметр
            createWall(0, 8, -80, 160, 16, 2, sandWallMat);
            createWall(0, 8, 80, 160, 16, 2, sandWallMat);
            createWall(-80, 8, 0, 2, 16, 160, sandWallMat);
            createWall(80, 8, 0, 2, 16, 160, sandWallMat);

            // --- МИД И КЕНТОВЫЕ КОРИДОРЫ ---
            // Главные центральные стены образующие коридор Мида
            createWall(-12, 6, -10, 2, 12, 50, sandWallMat);
            createWall(12, 6, 0, 2, 12, 40, sandWallMat);

            // Крытые туннели / Темка
            createTunnel(-30, 0, -20, 12, 6, 40);
            createTunnel(30, 0, 20, 12, 6, 30);

            // Арка Мида
            createWall(0, 10, 10, 24, 4, 4, sandWallMat);

            // --- ЗОНА ПЛЕНТА А (Лабиринт из зданий и узких проходов) ---
            createWall(45, 6, -40, 40, 12, 2, plasterMat);
            createWall(25, 6, -60, 2, 12, 40, plasterMat);
            createWall(55, 6, -60, 2, 12, 40, plasterMat);
            createWall(40, 6, -75, 30, 12, 2, plasterMat);
            // Крыша Апартаментов A
            createRoof(40, 12, -55, 32, 2, 38);

            // Плент А
            const plantA = new THREE.Mesh(new THREE.BoxGeometry(10, 1, 10), darkSandMat);
            plantA.position.set(40, 0.5, -45);
            scene.add(plantA);

            // --- ЗОНА ПЛЕНТА B (Узкий Рынок и Замкнутый Двор) ---
            createWall(-45, 6, 40, 35, 12, 2, darkSandMat);
            createWall(-25, 6, 55, 2, 12, 30, darkSandMat);
            createWall(-60, 6, 55, 2, 12, 30, darkSandMat);
            createWall(-40, 6, 70, 40, 12, 2, darkSandMat);
            // Туннель перехода B
            createTunnel(-40, 0, 20, 10, 6, 25);

            // Плент B
            const plantB = new THREE.Mesh(new THREE.BoxGeometry(10, 1, 10), sandWallMat);
            plantB.position.set(-42, 0.5, 52);
            scene.add(plantB);

            // --- ЗОНЫ ДЛЯ БЕЗОПАСНОГО СПАВНА В КОРИДОРАХ (Без застревания в стенах) ---
            spawnZones = [
                { x: 0, z: 65, radius: 4 },    // T-Spawn
                { x: 0, z: -65, radius: 4 },   // CT-Spawn
                { x: -30, z: -20, radius: 3 }, // Темка A
                { x: 30, z: 20, radius: 3 },  // Переход B
                { x: 40, z: -45, radius: 3 }, // Plant A
                { x: -42, z: 52, radius: 3 }, // Plant B
                { x: 0, z: 0, radius: 3 },     // Mid Center
                { x: -30, z: 35, radius: 3 }, // Рынок
                { x: 30, z: -35, radius: 3 }  // Длинник A
            ];

            // Ящики и бочки в безопасных местах
            spawnCrate(42, 1.5, -43, 2.5, 3, 2.5);
            spawnCrate(38, 1.5, -43, 2.5, 3, 2.5);
            spawnCrate(40, 4.25, -43, 2.2, 2.5, 2.2);

            spawnCrate(-40, 1.5, 50, 3, 3, 3);
            spawnCrate(-44, 1.5, 50, 2.5, 2.5, 2.5);

            spawnCrate(-2, 1.25, -5, 2.5, 2.5, 2.5);
            spawnCrate(2, 1.25, 5, 2.5, 2.5, 2.5);

            spawnBarrel(-32, 1.25, -10);
            spawnBarrel(32, 1.25, 10);
        }

        function createWall(x, y, z, w, h, d, mat) {
            const wall = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
            wall.position.set(x, y, z);
            wall.castShadow = true;
            wall.receiveShadow = true;
            scene.add(wall);
            obstacles.push(wall);
        }

        function createTunnel(x, y, z, w, h, d) {
            // Левая стена, правая стена и крыша туннеля
            createWall(x - w / 2, h / 2, z, 1.5, h, d, darkSandMat);
            createWall(x + w / 2, h / 2, z, 1.5, h, d, darkSandMat);
            createRoof(x, h, z, w + 1.5, 1.5, d);
        }

        function createRoof(x, y, z, w, h, d) {
            const roof = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), roofMat);
            roof.position.set(x, y, z);
            roof.castShadow = true;
            scene.add(roof);
            obstacles.push(roof);
        }

        function spawnCrate(x, y, z, w, h, d) {
            const crate = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), woodCrateMat);
            crate.position.set(x, y, z);
            crate.castShadow = true;
            crate.receiveShadow = true;
            scene.add(crate);
            obstacles.push(crate);
        }

        function spawnBarrel(x, y, z) {
            const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.9, 0.9, 2.4, 12), barrelMat);
            barrel.position.set(x, y, z);
            barrel.castShadow = true;
            barrel.receiveShadow = true;
            scene.add(barrel);
            obstacles.push(barrel);
        }

        // --- СОЗДАНИЕ РУК С M4A1 ---
        function createM4A1WithHands() {
            handsGunGroup = new THREE.Group();

            const skinMat = new THREE.MeshStandardMaterial({ color: 0xd2b48c, roughness: 0.6 });
            const gloveMat = new THREE.MeshStandardMaterial({ color: 0x2b2d42, roughness: 0.5 });
            const gunMetalMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, metalness: 0.8, roughness: 0.3 });
            const darkPlasticMat = new THREE.MeshStandardMaterial({ color: 0x2d3142, roughness: 0.5 });

            // 1. Модель M4A1
            const m4a1 = new THREE.Group();

            // Корпус (Receiver)
            const receiver = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.14, 0.45), gunMetalMat);
            m4a1.add(receiver);

            // Цевьё (Handguard)
            const handguard = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.35, 8), darkPlasticMat);
            handguard.rotation.x = Math.PI / 2;
            handguard.position.set(0, -0.01, -0.38);
            m4a1.add(handguard);

            // Ствол (Barrel)
            const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.4, 8), gunMetalMat);
            barrel.rotation.x = Math.PI / 2;
            barrel.position.set(0, 0.01, -0.65);
            m4a1.add(barrel);

            // Глушитель / Пламегаситель (Muzzle)
            const suppressor = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.25, 12), gunMetalMat);
            suppressor.rotation.x = Math.PI / 2;
            suppressor.position.set(0, 0.01, -0.85);
            m4a1.add(suppressor);

            // Магазин (Magazine)
            const mag = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.28, 0.12), darkPlasticMat);
            mag.position.set(0, -0.18, -0.1);
            mag.rotation.x = 0.2;
            m4a1.add(mag);

            // Приклад (Stock)
            const stock = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.14, 0.3), darkPlasticMat);
            stock.position.set(0, 0.02, 0.3);
            m4a1.add(stock);

            // Рукоятка (Pistol Grip)
            const grip = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.18, 0.08), darkPlasticMat);
            grip.position.set(0, -0.14, 0.1);
            grip.rotation.x = -0.35;
            m4a1.add(grip);

            // Вспышка выстрела
            muzzleFlash = new THREE.Mesh(new THREE.SphereGeometry(0.1, 8, 8), new THREE.MeshBasicMaterial({ color: 0xffcc00, transparent: true, opacity: 0 }));
            muzzleFlash.position.set(0, 0.01, -1.0);
            m4a1.add(muzzleFlash);

            // 2. Руки оператора (Левая и Правая)
            // Правая рука (держит рукоятка)
            const rightForearm = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.07, 0.45, 12), skinMat);
            rightForearm.position.set(0.18, -0.22, 0.15);
            rightForearm.rotation.set(-0.6, -0.3, 0.4);

            const rightGlove = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.09, 0.12), gloveMat);
            rightGlove.position.set(0.03, -0.12, 0.08);
            rightForearm.add(rightGlove);

            // Левая рука (держит цевьё)
            const leftForearm = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.07, 0.5, 12), skinMat);
            leftForearm.position.set(-0.22, -0.2, -0.15);
            leftForearm.rotation.set(-0.4, 0.5, -0.5);

            const leftGlove = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.09, 0.12), gloveMat);
            leftGlove.position.set(0, -0.18, -0.2);
            leftForearm.add(leftGlove);

            handsGunGroup.add(m4a1, rightForearm, leftForearm);
            
            // Позиционирование рук перед камерой
            handsGunGroup.position.set(0.22, -0.26, -0.42);
            camera.add(handsGunGroup);
            scene.add(camera);
        }

        // --- БЕЗОПАСНЫЙ СПАВН ПЕРСОНАЖЕЙ (БЕЗ ТЕКСТУР) ---
        function spawnTarget() {
            const target = new THREE.Group();

            // Модель соперника (Террорист)
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.38, 16, 16), new THREE.MeshStandardMaterial({ color: 0xef4444 }));
            head.position.y = 1.65;
            head.name = "head";

            const body = new THREE.Mesh(new THREE.CylinderGeometry(0.38, 0.32, 1.2), new THREE.MeshStandardMaterial({ color: 0x1f2937 }));
            body.position.y = 0.85;

            target.add(head, body);

            // Выбираем случайную зону и рассчитываем спавн без столкновений
            let validPos = false;
            let attempts = 0;
            let posX = 0, posZ = 0;

            while (!validPos && attempts < 30) {
                attempts++;
                const zone = spawnZones[Math.floor(Math.random() * spawnZones.length)];
                posX = zone.x + (Math.random() - 0.5) * zone.radius * 2;
                posZ = zone.z + (Math.random() - 0.5) * zone.radius * 2;

                const testPos = new THREE.Vector3(posX, 1.0, posZ);
                if (!checkCollision(testPos, 1.2)) {
                    validPos = true;
                }
            }

            target.position.set(posX, 0, posZ);
            scene.add(target);
            targets.push(target);
        }

        function shoot() {
            // Анимация отдачи M4A1
            recoilOffset = 0.08;
            muzzleFlash.material.opacity = 1;
            setTimeout(() => { muzzleFlash.material.opacity = 0; }, 40);

            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

            const meshes = [];
            targets.forEach(t => t.traverse(c => { if (c.isMesh) meshes.push(c); }));

            const intersects = raycaster.intersectObjects(meshes);
            if (intersects.length > 0) {
                const hitTarget = intersects[0].object.parent;
                scene.remove(hitTarget);
                targets = targets.filter(t => t !== hitTarget);
                score++;
                scoreEl.innerText = score;
                setTimeout(spawnTarget, 700);
            }
        }

        function toScreenPosition(obj, camera) {
            const vector = new THREE.Vector3();
            obj.getWorldPosition(vector);
            vector.project(camera);

            if (vector.z > 1) return { x: -1000, y: -1000, visible: false };

            const widthHalf = window.innerWidth / 2;
            const heightHalf = window.innerHeight / 2;

            return {
                x: (vector.x * widthHalf) + widthHalf,
                y: -(vector.y * heightHalf) + heightHalf,
                visible: true
            };
        }

        function processModFeatures() {
            espCtx.clearRect(0, 0, espCanvas.width, espCanvas.height);
            const screenCenter = { x: window.innerWidth / 2, y: window.innerHeight / 2 };

            if (modSettings.aim) {
                espCtx.beginPath();
                espCtx.arc(screenCenter.x, screenCenter.y, modSettings.aimFov, 0, Math.PI * 2);
                espCtx.strokeStyle = 'rgba(157, 78, 221, 0.7)';
                espCtx.lineWidth = 2;
                espCtx.stroke();
            }

            let bestTarget = null;
            let closestDist = Infinity;

            targets.forEach(target => {
                const head = target.getObjectByName("head");
                if (!head) return;

                const headPos = toScreenPosition(head, camera);
                const basePos = toScreenPosition(target, camera);

                if (!headPos.visible) return;

                const boxHeight = Math.abs(basePos.y - headPos.y) * 1.6;
                const boxWidth = boxHeight * 0.55;

                if (modSettings.esp) {
                    espCtx.strokeStyle = '#ef4444';
                    espCtx.lineWidth = 2;
                    espCtx.strokeRect(headPos.x - boxWidth / 2, headPos.y - boxHeight * 0.15, boxWidth, boxHeight);

                    espCtx.beginPath();
                    espCtx.moveTo(screenCenter.x, 0);
                    espCtx.lineTo(headPos.x, headPos.y - boxHeight * 0.15);
                    espCtx.strokeStyle = 'rgba(239, 68, 68, 0.4)';
                    espCtx.stroke();
                }

                if (modSettings.aim) {
                    const dist = Math.hypot(headPos.x - screenCenter.x, headPos.y - screenCenter.y);
                    if (dist <= modSettings.aimFov && dist < closestDist) {
                        closestDist = dist;
                        bestTarget = head;
                    }
                }
            });

            if (modSettings.aim && bestTarget) {
                const headWorldPos = new THREE.Vector3();
                bestTarget.getWorldPosition(headWorldPos);

                const dir = headWorldPos.clone().sub(camera.position).normalize();
                const targetYaw = Math.atan2(-dir.x, -dir.z);
                const targetPitch = Math.asin(dir.y);

                yaw += (targetYaw - yaw) * 0.25;
                pitch += (targetPitch - pitch) * 0.25;
                applyRotation();
            }
        }

        function setupModMenuUI() {
            const modBtn = document.getElementById('mod-toggle-btn');
            const modMenu = document.getElementById('mod-menu');
            const modContainer = document.getElementById('mod-container');

            ['click', 'mousedown', 'touchstart', 'touchend'].forEach(evt => {
                modContainer.addEventListener(evt, (e) => e.stopPropagation());
            });

            modBtn.addEventListener('click', (e) => {
                e.preventDefault();
                e.stopPropagation();

                if (modMenu.style.display === 'flex') {
                    modMenu.style.display = 'none';
                    if (!isMobileMode) document.body.requestPointerLock();
                } else {
                    modMenu.style.display = 'flex';
                    if (!isMobileMode && document.pointerLockElement) document.exitPointerLock();
                }
            });

            document.getElementById('esp-toggle').addEventListener('change', (e) => modSettings.esp = e.target.checked);
            document.getElementById('aim-toggle').addEventListener('change', (e) => modSettings.aim = e.target.checked);
            document.getElementById('aim-fov').addEventListener('input', (e) => {
                modSettings.aimFov = parseInt(e.target.value);
                document.getElementById('fov-val').innerText = modSettings.aimFov;
            });
        }

        function startGame() {
            isGameActive = true;
            menuScreen.style.display = 'none';
            gameHud.style.display = 'block';
            if (isMobileMode) touchControls.style.display = 'block';
            camera.position.set(0, 1.7, 65); // T-Spawn
        }

        const keys = {};
        function onKeyDown(e) { if(!isMobileMode) keys[e.code] = true; updateKeyboardMove(); }
        function onKeyUp(e) { if(!isMobileMode) keys[e.code] = false; updateKeyboardMove(); }
        function updateKeyboardMove() {
            moveState.forward = (keys['KeyW'] ? 1 : 0) - (keys['KeyS'] ? 1 : 0);
            moveState.right = (keys['KeyD'] ? 1 : 0) - (keys['KeyA'] ? 1 : 0);
        }

        function onMouseMove(e) {
            if (!isGameActive || isMobileMode || document.pointerLockElement !== document.body) return;
            yaw -= e.movementX * 0.002;
            pitch -= e.movementY * 0.002;
            applyRotation();
        }

        function applyRotation() {
            pitch = Math.max(-Math.PI / 2 + 0.1, Math.min(Math.PI / 2 - 0.1, pitch));
            camera.rotation.order = 'YXZ';
            camera.rotation.y = yaw;
            camera.rotation.x = pitch;
        }

        function setupTouchControls() {
            const joystickZone = document.getElementById('joystick-zone');
            const stick = document.getElementById('joystick-stick');
            const fireBtn = document.getElementById('fire-btn');
            const lookZone = document.getElementById('touch-look-zone');

            let joystickTouchId = null, lookTouchId = null;
            let lastLookX = 0, lastLookY = 0;

            joystickZone.addEventListener('touchstart', (e) => {
                const touch = e.changedTouches[0];
                joystickTouchId = touch.identifier;
                updateJoystick(touch);
            });

            window.addEventListener('touchmove', (e) => {
                for (let touch of e.changedTouches) {
                    if (touch.identifier === joystickTouchId) {
                        updateJoystick(touch);
                    } else if (touch.identifier === lookTouchId) {
                        const dx = touch.clientX - lastLookX;
                        const dy = touch.clientY - lastLookY;
                        yaw -= dx * 0.005;
                        pitch -= dy * 0.005;
                        applyRotation();
                        lastLookX = touch.clientX;
                        lastLookY = touch.clientY;
                    }
                }
            });

            window.addEventListener('touchend', (e) => {
                for (let touch of e.changedTouches) {
                    if (touch.identifier === joystickTouchId) {
                        joystickTouchId = null;
                        stick.style.left = '40px'; stick.style.top = '40px';
                        moveState.forward = 0; moveState.right = 0;
                    } else if (touch.identifier === lookTouchId) {
                        lookTouchId = null;
                    }
                }
            });

            function updateJoystick(touch) {
                const rect = joystickZone.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;

                let dx = touch.clientX - centerX;
                let dy = touch.clientY - centerY;
                const dist = Math.min(Math.hypot(dx, dy), 45);
                const angle = Math.atan2(dy, dx);

                const stickX = Math.cos(angle) * dist;
                const stickY = Math.sin(angle) * dist;

                stick.style.left = `${40 + stickX}px`;
                stick.style.top = `${40 + stickY}px`;

                moveState.forward = -stickY / 45;
                moveState.right = stickX / 45;
            }

            lookZone.addEventListener('touchstart', (e) => {
                const touch = e.changedTouches[0];
                lookTouchId = touch.identifier;
                lastLookX = touch.clientX;
                lastLookY = touch.clientY;
            });

            fireBtn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                if (isGameActive) shoot();
            });
        }

        // Продвинутая коллизия (Проверка хитбоксов)
        function checkCollision(newPosition, radius = 0.8) {
            for (let obstacle of obstacles) {
                const box = new THREE.Box3().setFromObject(obstacle);
                const closestPoint = new THREE.Vector3();
                box.clampPoint(newPosition, closestPoint);
                if (newPosition.distanceTo(closestPoint) < radius) return true;
            }
            return false;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            resizeEspCanvas();
        }

        let prevTime = performance.now();
        function animate(time) {
            requestAnimationFrame(animate);

            if (isGameActive) {
                const delta = (time - prevTime) / 1000;

                // Движение и анимация рук
                const moveVector = new THREE.Vector3();
                const sinYaw = Math.sin(yaw);
                const cosYaw = Math.cos(yaw);

                if (Math.abs(moveState.forward) > 0.05) {
                    moveVector.x -= sinYaw * moveState.forward * speed * delta;
                    moveVector.z -= cosYaw * moveState.forward * speed * delta;
                }
                if (Math.abs(moveState.right) > 0.05) {
                    moveVector.x += cosYaw * moveState.right * speed * delta;
                    moveVector.z -= sinYaw * moveState.right * speed * delta;
                }

                const isMoving = moveVector.length() > 0.001;

                // Скольжение и физика стен
                const nextX = camera.position.clone().add(new THREE.Vector3(moveVector.x, 0, 0));
                if (!checkCollision(nextX)) camera.position.x = nextX.x;

                const nextZ = camera.position.clone().add(new THREE.Vector3(0, 0, moveVector.z));
                if (!checkCollision(nextZ)) camera.position.z = nextZ.z;

                camera.position.y = 1.7;

                // Покачивание оружия при ходьбе (Sway / Bobbing)
                if (isMoving) {
                    bobbingAngle += delta * 12;
                    handsGunGroup.position.x = 0.22 + Math.cos(bobbingAngle) * 0.015;
                    handsGunGroup.position.y = -0.26 + Math.sin(bobbingAngle * 2) * 0.012;
                } else {
                    handsGunGroup.position.x += (0.22 - handsGunGroup.position.x) * 0.1;
                    handsGunGroup.position.y += (-0.26 - handsGunGroup.position.y) * 0.1;
                }

                // Гашение отдачи M4A1
                recoilOffset += (0 - recoilOffset) * 0.15;
                handsGunGroup.position.z = -0.42 + recoilOffset;

                processModFeatures();
            }

            prevTime = time;
            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
