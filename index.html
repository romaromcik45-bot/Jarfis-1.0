<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Standoff 2 - Sandstone Remastered Pro</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0; padding: 0;
            user-select: none; -webkit-user-select: none;
            font-family: 'Segoe UI', Roboto, sans-serif;
            touch-action: none;
        }
        body, html {
            width: 100%; height: 100%;
            overflow: hidden; background-color: #000; color: #fff;
        }

        /* --- Главное меню --- */
        #menu-screen {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            background: linear-gradient(135deg, #1f140e 0%, #0a0604 100%);
            z-index: 2000; gap: 15px;
        }
        .header h1 {
            font-size: 2.2rem; color: #f4a261;
            text-shadow: 0 0 15px rgba(244, 162, 97, 0.6); letter-spacing: 2px;
            text-align: center;
        }
        .header p { color: #e9c46a; font-size: 0.95rem; text-align: center; margin-top: 5px; }

        .btn {
            padding: 14px 28px; font-size: 1rem; font-weight: bold;
            color: #170d08; background: #f4a261; border: none; border-radius: 8px;
            cursor: pointer; box-shadow: 0 4px 12px rgba(244, 162, 97, 0.3); width: 260px;
        }
        .btn-sec { background: #e9c46a; }
        .btn-cfg { background: #2a9d8f; color: #fff; }

        /* --- HUD --- */
        #game-hud {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: none; pointer-events: none; z-index: 10;
        }

        #crosshair {
            position: absolute; top: 50%; left: 50%;
            width: 8px; height: 8px; transform: translate(-50%, -50%);
        }
        #crosshair::before, #crosshair::after {
            content: ''; position: absolute; background: rgba(0, 255, 0, 0.95);
            box-shadow: 0 0 4px #000;
        }
        #crosshair::before { top: 3px; left: -6px; width: 20px; height: 2px; }
        #crosshair::after { top: -6px; left: 3px; width: 2px; height: 20px; }

        .hud-panel {
            position: absolute; top: 15px; background: rgba(15, 10, 8, 0.85);
            padding: 8px 16px; border-radius: 6px; font-size: 1.1rem; font-weight: bold;
            border: 1px solid rgba(244, 162, 97, 0.4); pointer-events: auto;
        }
        #health-hud { left: 15px; color: #2a9d8f; }
        #score-hud { left: 140px; color: #f4a261; }

        #top-controls {
            position: absolute; top: 15px; right: 15px;
            display: flex; gap: 10px; pointer-events: auto; z-index: 100;
        }
        .icon-btn {
            background: rgba(20, 10, 5, 0.9); border: 1.5px solid #f4a261;
            color: #fff; padding: 8px 12px; border-radius: 8px; font-size: 0.9rem;
            font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }

        #killfeed {
            position: absolute; top: 70px; right: 15px;
            display: flex; flex-direction: column; gap: 6px;
            pointer-events: none; z-index: 100;
        }
        .kill-item {
            background: rgba(15, 10, 8, 0.88); border-right: 4px solid #e76f51;
            padding: 6px 12px; border-radius: 4px; font-size: 0.85rem; font-weight: bold;
            color: #fff; animation: fadeout 4s forwards;
        }
        @keyframes fadeout {
            0% { opacity: 1; transform: translateX(0); }
            80% { opacity: 1; }
            100% { opacity: 0; transform: translateX(20px); }
        }

        #esp-canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 5;
        }

        /* --- ПЕРЕТАСКИВАЕМОЕ МОД-МЕНЮ --- */
        #mod-container {
            position: absolute; top: 70px; left: 15px; z-index: 900; pointer-events: auto;
            width: 270px;
        }
        #mod-header {
            background: #8e24aa; color: #fff; border: 2px solid #e1bee7;
            padding: 10px; border-radius: 8px; font-weight: bold; font-size: 0.95rem;
            cursor: move; box-shadow: 0 0 15px rgba(142, 36, 170, 0.8);
            display: flex; justify-content: space-between; align-items: center;
        }
        #mod-menu {
            margin-top: 4px; max-height: 360px;
            overflow-y: auto; touch-action: pan-y; -webkit-overflow-scrolling: touch;
            background: rgba(18, 10, 26, 0.96); border: 2px solid #ab47bc;
            border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.95);
        }
        #mod-menu::-webkit-scrollbar { width: 6px; }
        #mod-menu::-webkit-scrollbar-thumb { background: #ab47bc; border-radius: 4px; }
        #mod-menu h3 {
            color: #ce93d8; font-size: 0.85rem; text-align: center;
            border-bottom: 1px solid rgba(206, 147, 216, 0.3); padding-bottom: 4px; margin-top: 4px;
        }
        .mod-option { display: flex; align-items: center; justify-content: space-between; font-size: 0.82rem; cursor: pointer; color: #e1bee7; }
        .mod-option input[type="checkbox"] { width: 18px; height: 18px; accent-color: #ab47bc; cursor: pointer; }
        .mod-btn-action { background: #8e24aa; color: #fff; border: none; padding: 8px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.8rem; }

        /* --- НАСТРОЙКИ --- */
        #settings-modal {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 320px; max-height: 85vh; overflow-y: auto; touch-action: pan-y;
            background: rgba(18, 12, 10, 0.98); border: 2px solid #f4a261;
            border-radius: 12px; padding: 18px; display: none; flex-direction: column; gap: 12px;
            z-index: 2500; pointer-events: auto; box-shadow: 0 0 50px rgba(0,0,0,0.95);
        }
        #settings-modal h2 { text-align: center; color: #f4a261; font-size: 1.2rem; border-bottom: 1px solid #444; padding-bottom: 6px; }
        .setting-group { display: flex; flex-direction: column; gap: 4px; font-size: 0.85rem; color: #e9c46a; }
        .setting-group input[type="range"] { background: #2b1c14; border: 1px solid #5a3e2e; padding: 4px; border-radius: 4px; }
        .close-settings { background: #e76f51; color: #fff; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; }

        /* --- СЕНСОРНОЕ УПРАВЛЕНИЕ И HUD EDITOR --- */
        #touch-controls {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: none; z-index: 15; pointer-events: none;
        }

        .hud-element {
            position: absolute; pointer-events: auto; touch-action: none;
        }
        .edit-mode-active {
            border: 2px dashed #f4a261 !important;
            box-shadow: 0 0 15px rgba(244, 162, 97, 0.8) !important;
        }

        #joystick-zone {
            bottom: 40px; left: 40px; width: 130px; height: 130px;
            background: rgba(255, 255, 255, 0.15); border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
        }
        #joystick-stick {
            position: absolute; top: 40px; left: 40px; width: 50px; height: 50px;
            background: rgba(244, 162, 97, 0.85); border-radius: 50%; pointer-events: none;
        }
        
        .action-btn {
            border-radius: 50%; display: flex;
            justify-content: center; align-items: center; font-weight: bold;
            color: #fff; border: 2px solid rgba(255,255,255,0.8);
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        #fire-btn {
            bottom: 50px; right: 40px; width: 85px; height: 85px;
            background: rgba(230, 57, 70, 0.85); font-size: 0.9rem;
        }
        #jump-btn {
            bottom: 150px; right: 45px; width: 65px; height: 65px;
            background: rgba(42, 157, 143, 0.85); font-size: 0.75rem;
        }
        #crouch-btn {
            bottom: 50px; right: 140px; width: 65px; height: 65px;
            background: rgba(233, 196, 106, 0.85); color: #170d08; font-size: 0.75rem;
        }
        #touch-look-zone { position: absolute; top: 0; right: 0; width: 50%; height: 100%; pointer-events: auto; }

        #hud-edit-banner {
            position: absolute; top: 70px; left: 50%; transform: translateX(-50%);
            background: rgba(231, 111, 81, 0.95); padding: 8px 20px; border-radius: 20px;
            font-weight: bold; font-size: 0.9rem; z-index: 1000; display: none;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="menu-screen">
        <div class="header">
            <h1>SANDSTONE REMASTERED</h1>
            <p>Прыжки, Кастомизация HUD, Мод-Меню & Физика</p>
        </div>
        <button class="btn" id="start-pc">Играть на ПК (Мышь)</button>
        <button class="btn btn-sec" id="start-mobile">Играть на Телефоне (Сенсор)</button>
        <button class="btn btn-cfg" id="open-menu-settings">⚙️ Настройки Управления</button>
    </div>

    <div id="hud-edit-banner">РЕЖИМ НАСТРОЙКИ HUD: Перетаскивай кнопки пальцем!</div>

    <canvas id="esp-canvas"></canvas>

    <div id="game-hud">
        <div id="crosshair"></div>
        <div id="health-hud" class="hud-panel">+ 100</div>
        <div id="score-hud" class="hud-panel">УБИТО: <span id="score">0</span></div>
        <div id="killfeed"></div>
        <div id="top-controls">
            <button class="icon-btn" id="toggle-hud-edit">📐 HUD EDIT</button>
            <button class="icon-btn" id="settings-btn">⚙️</button>
        </div>
    </div>

    <!-- ПЕРЕТАСКИВАЕМОЕ МОД МЕНЮ -->
    <div id="mod-container">
        <div id="mod-header">
            <span>🟣 MOD MENU</span>
            <span id="mod-collapse-btn" style="cursor:pointer; font-size:0.8rem;">[–]</span>
        </div>
        <div id="mod-menu">
            <h3>🎯 AIMBOT & STRIKE</h3>
            <label class="mod-option"><span>AimBot</span><input type="checkbox" id="aim-toggle"></label>
            <label class="mod-option"><span>TriggerBot</span><input type="checkbox" id="trigger-toggle"></label>
            <label class="mod-option"><span>No Recoil</span><input type="checkbox" id="recoil-toggle"></label>

            <h3>👁️ VISUALS & ESP</h3>
            <label class="mod-option"><span>ESP Boxes</span><input type="checkbox" id="esp-toggle"></label>
            <label class="mod-option"><span>ESP Distance & HP</span><input type="checkbox" id="hp-toggle"></label>
            <label class="mod-option"><span>WallHack (Chams)</span><input type="checkbox" id="wallhack-toggle"></label>
            <label class="mod-option"><span>Tracers</span><input type="checkbox" id="tracers-toggle"></label>

            <h3>🏃 MOVEMENT & PHYSICS</h3>
            <div class="setting-group"><label>SpeedHack: <span id="speed-val">1</span>x</label><input type="range" id="speed-rate" min="1" max="5" value="1"></div>
            <label class="mod-option"><span>FlyHack / Noclip</span><input type="checkbox" id="fly-toggle"></label>
            <label class="mod-option"><span>Super Jump</span><input type="checkbox" id="jump-toggle"></label>

            <h3>🎨 GRAPHICS & MISC</h3>
            <div class="setting-group"><label>FOV: <span id="fov-val">75</span></label><input type="range" id="fov-slider" min="60" max="110" value="75"></div>
            <label class="mod-option"><span>Night Mode</span><input type="checkbox" id="night-toggle"></label>
            <button class="mod-btn-action" id="tp-btn">Телепорт к врагу</button>
        </div>
    </div>

    <!-- НАСТРОЙКИ -->
    <div id="settings-modal">
        <h2>НАСТРОЙКИ УПРАВЛЕНИЯ</h2>
        <div class="setting-group">
            <label>Чувствительность:</label>
            <input type="range" id="setting-sens" min="1" max="10" value="5">
        </div>
        <div class="setting-group">
            <label>Прозрачность Кнопок:</label>
            <input type="range" id="ctrl-opacity" min="20" max="100" value="85">
        </div>
        <button class="btn btn-cfg" id="btn-edit-hud-settings" style="width:100%; margin-top:5px;">📐 Расставить кнопки на экране</button>
        <button class="close-settings" id="close-settings">ЗАКРЫТЬ И СОХРАНИТЬ</button>
    </div>

    <!-- СЕНСОРНОЕ УПРАВЛЕНИЕ -->
    <div id="touch-controls">
        <div id="touch-look-zone"></div>
        <div id="joystick-zone" class="hud-element" data-id="joystick">
            <div id="joystick-stick"></div>
        </div>
        <div id="fire-btn" class="hud-element action-btn" data-id="fire">ОГОНЬ</div>
        <div id="jump-btn" class="hud-element action-btn" data-id="jump">ПРЫЖОК</div>
        <div id="crouch-btn" class="hud-element action-btn" data-id="crouch">ПРИСЕД</div>
    </div>

    <script>
        let scene, camera, renderer;
        let targets = [], obstacles = [], spawnZones = [];
        let score = 0;
        let isGameActive = false, isMobileMode = false, isHudEditing = false;

        // Движение и физика
        const moveState = { forward: 0, right: 0 };
        let baseSpeed = 10.0, speedMultiplier = 1.0;
        let pitch = 0, yaw = 0, sensMultiplier = 1.0;

        // ИСПРАВЛЕННЫЙ ПРЫЖОК И ФИЗИКА
        let verticalVelocity = 0, isGrounded = true;
        let isCrouching = false;
        let standHeight = 1.7, crouchHeight = 1.0;
        let currentCamHeight = 1.7;
        let walkTimer = 0;

        // Стрельба
        let isFiring = false, lastShotTime = 0, baseFireInterval = 130;

        // Модели
        let handsGunGroup, muzzleFlash, recoilOffset = 0;
        let handsBasePos = new THREE.Vector3(0.18, -0.22, -0.38);

        // Звуки
        let audioCtx, masterVolume = 0.8;

        // Моды
        const modSettings = {
            aim: false, trigger: false, recoil: false,
            esp: false, hp: false, wallhack: false, tracers: false,
            fly: false, jump: false, night: false
        };
        let espCanvas, espCtx;

        // Текстуры и материалы
        let brickTexture, sandWallMat, woodCrateMat, barrelMat, plasterMat;
        let sunLight;

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb);
            scene.fog = new THREE.FogExp2(0xd2a679, 0.006);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            scene.add(camera);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            espCanvas = document.getElementById('esp-canvas');
            espCtx = espCanvas.getContext('2d');
            resizeEspCanvas();

            // Свет и РЕАЛИСТИЧНЫЕ ТЕНИ на всю карту
            const ambientLight = new THREE.AmbientLight(0xffebd7, 0.85);
            scene.add(ambientLight);

            sunLight = new THREE.DirectionalLight(0xffdfb8, 1.3);
            sunLight.position.set(50, 80, 40);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            sunLight.shadow.camera.left = -90;
            sunLight.shadow.camera.right = 90;
            sunLight.shadow.camera.top = 90;
            sunLight.shadow.camera.bottom = -90;
            sunLight.shadow.camera.near = 0.5;
            sunLight.shadow.camera.far = 200;
            scene.add(sunLight);

            // Генерация материалов
            brickTexture = createBrickTexture();
            sandWallMat = new THREE.MeshStandardMaterial({ map: brickTexture, roughness: 0.85 });
            woodCrateMat = new THREE.MeshStandardMaterial({ color: 0x8c5a3c, roughness: 0.6 });
            barrelMat = new THREE.MeshStandardMaterial({ color: 0x2b4c6f, metalness: 0.3, roughness: 0.4 });
            plasterMat = new THREE.MeshStandardMaterial({ color: 0xe6caab, roughness: 0.9 });

            createSandstoneMap();
            createM4A1WithHands();

            for (let i = 0; i < 8; i++) spawnTarget();

            window.addEventListener('resize', onWindowResize);

            // Кнопки Меню
            document.getElementById('start-pc').addEventListener('click', () => {
                isMobileMode = false; initAudio(); startGame(); document.body.requestPointerLock();
            });

            document.getElementById('start-mobile').addEventListener('click', () => {
                isMobileMode = true; initAudio(); startGame();
            });

            document.getElementById('open-menu-settings').addEventListener('click', () => {
                document.getElementById('settings-modal').style.display = 'flex';
            });

            // Слушатели ввода ПК
            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);
            document.addEventListener('mousemove', onMouseMove);

            document.addEventListener('mousedown', (e) => {
                const modal = document.getElementById('settings-modal');
                if (!isMobileMode && isGameActive && modal.style.display !== 'flex' && !isHudEditing) {
                    if (document.pointerLockElement !== document.body) {
                        document.body.requestPointerLock();
                    } else if (e.button === 0) {
                        isFiring = true;
                    }
                }
            });

            document.addEventListener('mouseup', (e) => { if (e.button === 0) isFiring = false; });

            setupModMenuDrag();
            setupHudEditor();
            setupModMenuLogic();
            setupSettingsUI();
            setupTouchControls();
            animate(0);
        }

        function createBrickTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#d49a6a'; ctx.fillRect(0, 0, 512, 512);
            ctx.strokeStyle = '#a2714a'; ctx.lineWidth = 3;
            for (let i = 0; i < 16; i++) {
                let y = i * 32; ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(512, y); ctx.stroke();
                let offset = (i % 2) * 32;
                for (let x = offset; x < 512; x += 64) {
                    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + 32); ctx.stroke();
                }
            }
            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping; texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(3, 3);
            return texture;
        }

        function createSandstoneMap() {
            obstacles = []; spawnZones = [];

            // Пол
            const floorTex = brickTexture.clone(); floorTex.repeat.set(12, 12);
            const floor = new THREE.Mesh(new THREE.PlaneGeometry(160, 160), new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.9 }));
            floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

            // Наружные Стены
            createWall(0, 8, -80, 160, 16, 3, sandWallMat);
            createWall(0, 8, 80, 160, 16, 3, sandWallMat);
            createWall(-80, 8, 0, 3, 16, 160, sandWallMat);
            createWall(80, 8, 0, 3, 16, 160, sandWallMat);

            // Здания Sandstone
            createWall(-20, 7, -15, 3, 14, 50, sandWallMat);
            createWall(20, 7, 5, 3, 14, 45, sandWallMat);

            // Арка
            const archRoof = new THREE.Mesh(new THREE.BoxGeometry(22, 4, 6), plasterMat);
            archRoof.position.set(0, 10, -5); archRoof.castShadow = true; scene.add(archRoof); obstacles.push(archRoof);

            // Лесы
            const scaffold = new THREE.Mesh(new THREE.BoxGeometry(12, 1, 4), woodCrateMat);
            scaffold.position.set(-15, 5, 10); scaffold.castShadow = true; scene.add(scaffold); obstacles.push(scaffold);

            spawnZones = [
                { x: 0, z: 60, radius: 5 }, { x: 0, z: -60, radius: 5 },
                { x: -35, z: -20, radius: 4 }, { x: 35, z: 20, radius: 4 }
            ];

            spawnCrate(35, 1.5, -35, 3, 3, 3);
            spawnCrate(35, 4.5, -35, 2.5, 2.5, 2.5);
            spawnCrate(-35, 1.5, 45, 3, 3, 3);
            spawnBarrel(-28, 1.25, -5);
            spawnBarrel(28, 1.25, 15);
        }

        function createWall(x, y, z, w, h, d, mat) {
            const wall = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
            wall.position.set(x, y, z); wall.castShadow = true; wall.receiveShadow = true;
            scene.add(wall); obstacles.push(wall);
        }

        function spawnCrate(x, y, z, w, h, d) {
            const crate = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), woodCrateMat);
            crate.position.set(x, y, z); crate.castShadow = true; crate.receiveShadow = true;
            scene.add(crate); obstacles.push(crate);
        }

        function spawnBarrel(x, y, z) {
            const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.9, 0.9, 2.4, 16), barrelMat);
            barrel.position.set(x, y, z); barrel.castShadow = true; barrel.receiveShadow = true;
            scene.add(barrel); obstacles.push(barrel);
        }

        function createM4A1WithHands() {
            handsGunGroup = new THREE.Group();
            const skinMat = new THREE.MeshStandardMaterial({ color: 0xdca882, roughness: 0.6 });
            const gloveMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.5 });
            const gunDarkMat = new THREE.MeshStandardMaterial({ color: 0x1a1d20, metalness: 0.85, roughness: 0.25 });
            const gunMetalMat = new THREE.MeshStandardMaterial({ color: 0x33373b, metalness: 0.9, roughness: 0.2 });

            const m4a1 = new THREE.Group();
            const receiver = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.09, 0.32), gunDarkMat);
            const handguard = new THREE.Mesh(new THREE.BoxGeometry(0.055, 0.07, 0.35), gunMetalMat);
            handguard.position.set(0, 0.005, -0.3);
            const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.2, 12), gunMetalMat);
            barrel.rotation.x = Math.PI / 2; barrel.position.set(0, 0.01, -0.52);
            const suppressor = new THREE.Mesh(new THREE.CylinderGeometry(0.024, 0.024, 0.3, 16), gunDarkMat);
            suppressor.rotation.x = Math.PI / 2; suppressor.position.set(0, 0.01, -0.72);
            const mag = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.22, 0.08), gunDarkMat);
            mag.position.set(0, -0.12, -0.06); mag.rotation.x = 0.15;
            const stock = new THREE.Mesh(new THREE.BoxGeometry(0.045, 0.1, 0.25), gunDarkMat);
            stock.position.set(0, -0.01, 0.26);

            m4a1.add(receiver, handguard, barrel, suppressor, mag, stock);

            muzzleFlash = new THREE.Mesh(new THREE.SphereGeometry(0.08, 8, 8), new THREE.MeshBasicMaterial({ color: 0xffdb4d, transparent: true, opacity: 0 }));
            muzzleFlash.position.set(0, 0.01, -0.88); m4a1.add(muzzleFlash);

            const rightArm = new THREE.Group();
            const rForearm = new THREE.Mesh(new THREE.CylinderGeometry(0.042, 0.048, 0.42, 14), gloveMat);
            rForearm.position.set(0.16, -0.16, 0.12); rForearm.rotation.set(-0.6, -0.2, 0.2);
            const rHand = new THREE.Mesh(new THREE.SphereGeometry(0.042, 10, 10), skinMat);
            rHand.position.set(0.09, -0.07, 0.01);
            rightArm.add(rForearm, rHand);

            const leftArm = new THREE.Group();
            const lForearm = new THREE.Mesh(new THREE.CylinderGeometry(0.042, 0.048, 0.48, 14), gloveMat);
            lForearm.position.set(-0.16, -0.18, -0.12); lForearm.rotation.set(-0.2, 0.5, -0.4);
            const lHand = new THREE.Mesh(new THREE.SphereGeometry(0.042, 10, 10), skinMat);
            lHand.position.set(-0.02, -0.02, -0.28);
            leftArm.add(lForearm, lHand);

            handsGunGroup.add(m4a1, rightArm, leftArm);
            handsGunGroup.position.copy(handsBasePos);
            camera.add(handsGunGroup);
        }

        function spawnTarget() {
            const human = new THREE.Group();
            const skinMat = new THREE.MeshStandardMaterial({ color: 0xd2a379 });
            const suitMat = new THREE.MeshStandardMaterial({ color: 0x2b3a4a, roughness: 0.7 });

            const head = new THREE.Mesh(new THREE.SphereGeometry(0.24, 12, 12), skinMat);
            head.position.y = 1.62; head.name = "head";
            const torso = new THREE.Mesh(new THREE.BoxGeometry(0.48, 0.65, 0.28), suitMat);
            torso.position.y = 1.15; torso.name = "torso";
            const legL = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.09, 0.8), suitMat);
            legL.position.set(-0.14, 0.4, 0);
            const legR = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.09, 0.8), suitMat);
            legR.position.set(0.14, 0.4, 0);

            human.add(head, torso, legL, legR);

            let posX = 0, posZ = 0, validPos = false, attempts = 0;
            while (!validPos && attempts < 30) {
                attempts++;
                const zone = spawnZones[Math.floor(Math.random() * spawnZones.length)];
                posX = zone.x + (Math.random() - 0.5) * zone.radius * 2;
                posZ = zone.z + (Math.random() - 0.5) * zone.radius * 2;
                if (!checkCollision(new THREE.Vector3(posX, 1.0, posZ), 1.2)) validPos = true;
            }

            human.position.set(posX, 0, posZ);
            scene.add(human); targets.push(human);
        }

        function shoot() {
            if (!modSettings.recoil) recoilOffset = 0.07;
            muzzleFlash.material.opacity = 1;
            setTimeout(() => { muzzleFlash.material.opacity = 0; }, 30);

            playGunshotSound();

            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

            const allObjects = [];
            if (!modSettings.wallhack) obstacles.forEach(o => allObjects.push(o));
            targets.forEach(t => t.traverse(c => { if (c.isMesh) allObjects.push(c); }));

            const intersects = raycaster.intersectObjects(allObjects);
            if (intersects.length > 0) {
                let hitTarget = intersects[0].object;
                while (hitTarget.parent && !targets.includes(hitTarget)) {
                    hitTarget = hitTarget.parent;
                }
                if (targets.includes(hitTarget)) {
                    killTarget(hitTarget);
                }
            }
        }

        function killTarget(hitTarget) {
            scene.remove(hitTarget);
            targets = targets.filter(t => t !== hitTarget);
            score++; document.getElementById('score').innerText = score;

            const item = document.createElement('div');
            item.className = 'kill-item'; item.innerText = `[YOU 🔫 M4A1] ENEMY`;
            document.getElementById('killfeed').appendChild(item);
            setTimeout(() => item.remove(), 4000);

            setTimeout(spawnTarget, 500);
        }

        /* --- 1. ПЕРЕТАСКИВАЕМОЕ МОД-МЕНЮ --- */
        function setupModMenuDrag() {
            const container = document.getElementById('mod-container');
            const header = document.getElementById('mod-header');
            const collapseBtn = document.getElementById('mod-collapse-btn');
            const menuContent = document.getElementById('mod-menu');

            let isDragging = false, startX, startY, initialLeft, initialTop;

            header.addEventListener('pointerdown', (e) => {
                if (e.target === collapseBtn) return;
                isDragging = true;
                startX = e.clientX; startY = e.clientY;
                const rect = container.getBoundingClientRect();
                initialLeft = rect.left; initialTop = rect.top;
                header.setPointerCapture(e.pointerId);
            });

            header.addEventListener('pointermove', (e) => {
                if (!isDragging) return;
                const dx = e.clientX - startX; const dy = e.clientY - startY;
                container.style.left = `${initialLeft + dx}px`;
                container.style.top = `${initialTop + dy}px`;
            });

            header.addEventListener('pointerup', (e) => {
                isDragging = false;
                try { header.releasePointerCapture(e.pointerId); } catch(err){}
            });

            collapseBtn.addEventListener('click', () => {
                if (menuContent.style.display === 'none') {
                    menuContent.style.display = 'flex'; collapseBtn.innerText = '[–]';
                } else {
                    menuContent.style.display = 'none'; collapseBtn.innerText = '[+]';
                }
            });
        }

        /* --- 2. ПОЛНОЦЕННАЯ КАСТОМИЗАЦИЯ HUD (DRAG & DROP) --- */
        function setupHudEditor() {
            const toggleBtn = document.getElementById('toggle-hud-edit');
            const settingsEditBtn = document.getElementById('btn-edit-hud-settings');
            const banner = document.getElementById('hud-edit-banner');
            const hudElements = document.querySelectorAll('.hud-element');

            // Загрузка сохранённых позиций
            hudElements.forEach(el => {
                const saved = localStorage.getItem('hud_pos_' + el.dataset.id);
                if (saved) {
                    const pos = JSON.parse(saved);
                    el.style.left = pos.left; el.style.top = pos.top;
                    el.style.right = 'auto'; el.style.bottom = 'auto';
                }
            });

            function toggleHudEditMode() {
                isHudEditing = !isHudEditing;
                banner.style.display = isHudEditing ? 'block' : 'none';
                toggleBtn.innerText = isHudEditing ? '💾 SAVE HUD' : '📐 HUD EDIT';
                if (document.pointerLockElement) document.exitPointerLock();

                hudElements.forEach(el => {
                    if (isHudEditing) el.classList.add('edit-mode-active');
                    else el.classList.remove('edit-mode-active');
                });
            }

            toggleBtn.addEventListener('click', toggleHudEditMode);
            settingsEditBtn.addEventListener('click', () => {
                document.getElementById('settings-modal').style.display = 'none';
                if (!isHudEditing) toggleHudEditMode();
            });

            let activeDragEl = null, dragOffsetX = 0, dragOffsetY = 0;

            hudElements.forEach(el => {
                el.addEventListener('pointerdown', (e) => {
                    if (!isHudEditing) return;
                    activeDragEl = el;
                    const rect = el.getBoundingClientRect();
                    dragOffsetX = e.clientX - rect.left;
                    dragOffsetY = e.clientY - rect.top;
                    el.setPointerCapture(e.pointerId);
                });

                el.addEventListener('pointermove', (e) => {
                    if (!isHudEditing || activeDragEl !== el) return;
                    const newLeft = e.clientX - dragOffsetX;
                    const newTop = e.clientY - dragOffsetY;
                    el.style.left = `${newLeft}px`;
                    el.style.top = `${newTop}px`;
                    el.style.right = 'auto'; el.style.bottom = 'auto';
                });

                el.addEventListener('pointerup', (e) => {
                    if (!isHudEditing || activeDragEl !== el) return;
                    localStorage.setItem('hud_pos_' + el.dataset.id, JSON.stringify({
                        left: el.style.left, top: el.style.top
                    }));
                    activeDragEl = null;
                    try { el.releasePointerCapture(e.pointerId); } catch(err){}
                });
            });
        }

        /* --- 3. ИСПРАВЛЕННАЯ ФИЗИКА ПРЫЖКА --- */
        function handleJump() {
            if (isGrounded || modSettings.fly) {
                // ИСПРАВЛЕНО: Увеличен импульс прыжка для нормального полёта
                verticalVelocity = modSettings.jump ? 16.0 : 11.5;
                isGrounded = false;
            }
        }

        function setupModMenuLogic() {
            const bindCheck = (id, key) => {
                document.getElementById(id).addEventListener('change', (e) => modSettings[key] = e.target.checked);
            };
            bindCheck('aim-toggle', 'aim'); bindCheck('trigger-toggle', 'trigger');
            bindCheck('recoil-toggle', 'recoil'); bindCheck('esp-toggle', 'esp');
            bindCheck('hp-toggle', 'hp'); bindCheck('wallhack-toggle', 'wallhack');
            bindCheck('tracers-toggle', 'tracers'); bindCheck('fly-toggle', 'fly');
            bindCheck('jump-toggle', 'jump');

            document.getElementById('speed-rate').addEventListener('input', (e) => {
                speedMultiplier = parseInt(e.target.value);
                document.getElementById('speed-val').innerText = speedMultiplier;
            });

            document.getElementById('fov-slider').addEventListener('input', (e) => {
                camera.fov = parseInt(e.target.value); camera.updateProjectionMatrix();
                document.getElementById('fov-val').innerText = camera.fov;
            });

            document.getElementById('night-toggle').addEventListener('change', (e) => {
                modSettings.night = e.target.checked;
                scene.background = new THREE.Color(modSettings.night ? 0x060612 : 0x87ceeb);
            });

            document.getElementById('tp-btn').addEventListener('click', () => {
                if (targets.length > 0) {
                    const target = targets[0];
                    camera.position.set(target.position.x, currentCamHeight, target.position.z + 2);
                }
            });
        }

        function setupSettingsUI() {
            const modal = document.getElementById('settings-modal');
            document.getElementById('settings-btn').addEventListener('click', (e) => {
                e.stopPropagation(); if (document.pointerLockElement) document.exitPointerLock();
                modal.style.display = 'flex';
            });
            document.getElementById('close-settings').addEventListener('click', () => {
                modal.style.display = 'none';
                if (!isMobileMode && isGameActive && !isHudEditing) document.body.requestPointerLock();
            });
            document.getElementById('ctrl-opacity').addEventListener('input', (e) => {
                const op = e.target.value / 100;
                document.querySelectorAll('.hud-element').forEach(el => el.style.opacity = op);
            });
            document.getElementById('setting-sens').addEventListener('input', (e) => {
                sensMultiplier = parseFloat(e.target.value) / 5.0;
            });
        }

        function startGame() {
            isGameActive = true;
            document.getElementById('menu-screen').style.display = 'none';
            document.getElementById('game-hud').style.display = 'block';
            if (isMobileMode) document.getElementById('touch-controls').style.display = 'block';
            camera.position.set(0, standHeight, 60);
        }

        const keys = {};
        function onKeyDown(e) {
            if (!isMobileMode) {
                keys[e.code] = true;
                if (e.code === 'Space') handleJump();
                if (e.code === 'KeyC' || e.code === 'ShiftLeft') isCrouching = true;
                updateKeyboardMove();
            }
        }
        function onKeyUp(e) {
            if (!isMobileMode) {
                keys[e.code] = false;
                if (e.code === 'KeyC' || e.code === 'ShiftLeft') isCrouching = false;
                updateKeyboardMove();
            }
        }
        function updateKeyboardMove() {
            moveState.forward = (keys['KeyW'] ? 1 : 0) - (keys['KeyS'] ? 1 : 0);
            moveState.right = (keys['KeyD'] ? 1 : 0) - (keys['KeyA'] ? 1 : 0);
        }

        function onMouseMove(e) {
            if (!isGameActive || isMobileMode || document.pointerLockElement !== document.body || isHudEditing) return;
            yaw -= e.movementX * 0.002 * sensMultiplier;
            pitch -= e.movementY * 0.002 * sensMultiplier;
            applyRotation();
        }

        function applyRotation() {
            pitch = Math.max(-Math.PI / 2 + 0.1, Math.min(Math.PI / 2 - 0.1, pitch));
            camera.rotation.order = 'YXZ'; camera.rotation.y = yaw; camera.rotation.x = pitch;
        }

        function setupTouchControls() {
            const joystickZone = document.getElementById('joystick-zone');
            const stick = document.getElementById('joystick-stick');
            const fireBtn = document.getElementById('fire-btn');
            const jumpBtn = document.getElementById('jump-btn');
            const crouchBtn = document.getElementById('crouch-btn');
            const lookZone = document.getElementById('touch-look-zone');

            let joystickTouchId = null, lookTouchId = null;
            let lastLookX = 0, lastLookY = 0;

            joystickZone.addEventListener('touchstart', (e) => {
                if (isHudEditing) return;
                const touch = e.changedTouches[0];
                joystickTouchId = touch.identifier;
                updateJoystick(touch);
            });

            window.addEventListener('touchmove', (e) => {
                if (isHudEditing) return;
                for (let touch of e.changedTouches) {
                    if (touch.identifier === joystickTouchId) {
                        updateJoystick(touch);
                    } else if (touch.identifier === lookTouchId) {
                        const dx = touch.clientX - lastLookX; const dy = touch.clientY - lastLookY;
                        yaw -= dx * 0.004 * sensMultiplier; pitch -= dy * 0.004 * sensMultiplier;
                        applyRotation();
                        lastLookX = touch.clientX; lastLookY = touch.clientY;
                    }
                }
            });

            window.addEventListener('touchend', (e) => {
                for (let touch of e.changedTouches) {
                    if (touch.identifier === joystickTouchId) {
                        joystickTouchId = null;
                        stick.style.left = '40px'; stick.style.top = '40px';
                        moveState.forward = 0; moveState.right = 0;
                    } else if (touch.identifier === lookTouchId) {
                        lookTouchId = null;
                    }
                }
            });

            function updateJoystick(touch) {
                const rect = joystickZone.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                let dx = touch.clientX - centerX, dy = touch.clientY - centerY;
                const dist = Math.min(Math.hypot(dx, dy), 45);
                const angle = Math.atan2(dy, dx);

                stick.style.left = `${40 + Math.cos(angle) * dist}px`;
                stick.style.top = `${40 + Math.sin(angle) * dist}px`;
                moveState.forward = -Math.sin(angle) * (dist / 45);
                moveState.right = Math.cos(angle) * (dist / 45);
            }

            lookZone.addEventListener('touchstart', (e) => {
                if (isHudEditing) return;
                const touch = e.changedTouches[0];
                lookTouchId = touch.identifier;
                lastLookX = touch.clientX; lastLookY = touch.clientY;
            });

            fireBtn.addEventListener('touchstart', (e) => { if (!isHudEditing) { e.preventDefault(); isFiring = true; } });
            fireBtn.addEventListener('touchend', (e) => { if (!isHudEditing) { e.preventDefault(); isFiring = false; } });
            jumpBtn.addEventListener('touchstart', (e) => { if (!isHudEditing) { e.preventDefault(); handleJump(); } });
            crouchBtn.addEventListener('touchstart', (e) => { if (!isHudEditing) { e.preventDefault(); isCrouching = true; } });
            crouchBtn.addEventListener('touchend', (e) => { if (!isHudEditing) { e.preventDefault(); isCrouching = false; } });
        }

        function checkCollision(newPosition, radius = 0.8) {
            if (modSettings.fly) return false;
            for (let obstacle of obstacles) {
                const box = new THREE.Box3().setFromObject(obstacle);
                const closestPoint = new THREE.Vector3();
                box.clampPoint(newPosition, closestPoint);
                if (newPosition.distanceTo(closestPoint) < radius) return true;
            }
            return false;
        }

        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playGunshotSound() {
            if (!audioCtx || masterVolume <= 0) return;
            const now = audioCtx.currentTime;
            const buffer = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.08, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
            const noise = audioCtx.createBufferSource(); noise.buffer = buffer;
            const filter = audioCtx.createBiquadFilter(); filter.type = 'bandpass'; filter.frequency.value = 1400;
            const gain = audioCtx.createGain(); gain.gain.setValueAtTime(masterVolume, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
            noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
            noise.start(now); noise.stop(now + 0.08);
        }

        function resizeEspCanvas() {
            espCanvas.width = window.innerWidth; espCanvas.height = window.innerHeight;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            resizeEspCanvas();
        }

        function toScreenPosition(obj, camera) {
            const vector = new THREE.Vector3();
            obj.getWorldPosition(vector);
            vector.project(camera);
            if (vector.z > 1) return { x: -1000, y: -1000, visible: false };
            const widthHalf = window.innerWidth / 2, heightHalf = window.innerHeight / 2;
            return { x: (vector.x * widthHalf) + widthHalf, y: -(vector.y * heightHalf) + heightHalf, visible: true };
        }

        function processModFeatures() {
            espCtx.clearRect(0, 0, espCanvas.width, espCanvas.height);
            const screenCenter = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
            let bestTarget = null, closestDist = Infinity;

            targets.forEach(target => {
                const head = target.getObjectByName("head"); if (!head) return;
                const headPos = toScreenPosition(head, camera);
                const basePos = toScreenPosition(target, camera);
                if (!headPos.visible) return;

                const distToEnemy = camera.position.distanceTo(target.position).toFixed(1);
                const boxHeight = Math.abs(basePos.y - headPos.y) * 1.8;
                const boxWidth = boxHeight * 0.55;

                if (modSettings.esp) {
                    espCtx.strokeStyle = '#ef4444'; espCtx.lineWidth = 2;
                    espCtx.strokeRect(headPos.x - boxWidth / 2, headPos.y - boxHeight * 0.1, boxWidth, boxHeight);
                }

                if (modSettings.hp) {
                    espCtx.fillStyle = '#2a9d8f'; espCtx.fillRect(headPos.x - boxWidth / 2, headPos.y - 15, boxWidth, 4);
                    espCtx.fillStyle = '#fff'; espCtx.font = '10px Arial';
                    espCtx.fillText(`${distToEnemy}m`, headPos.x - 10, headPos.y - 20);
                }

                if (modSettings.tracers) {
                    espCtx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
                    espCtx.beginPath(); espCtx.moveTo(screenCenter.x, window.innerHeight);
                    espCtx.lineTo(headPos.x, headPos.y); espCtx.stroke();
                }

                const dist = Math.hypot(headPos.x - screenCenter.x, headPos.y - screenCenter.y);
                if (dist < closestDist) { closestDist = dist; bestTarget = head; }
            });

            if (modSettings.trigger && closestDist < 25) shoot();

            if (modSettings.aim && bestTarget) {
                const headWorldPos = new THREE.Vector3();
                bestTarget.getWorldPosition(headWorldPos);
                const dir = headWorldPos.clone().sub(camera.position).normalize();
                yaw += (Math.atan2(-dir.x, -dir.z) - yaw) * 0.25;
                pitch += (Math.asin(dir.y) - pitch) * 0.25;
                applyRotation();
            }
        }

        let prevTime = performance.now();
        function animate(time) {
            requestAnimationFrame(animate);

            if (isGameActive) {
                const delta = Math.min((time - prevTime) / 1000, 0.1);

                const targetCamHeight = isCrouching ? crouchHeight : standHeight;
                currentCamHeight += (targetCamHeight - currentCamHeight) * 0.2;
                const currentSpeed = (isCrouching ? baseSpeed * 0.5 : baseSpeed) * speedMultiplier;

                const moveVector = new THREE.Vector3();
                const sinYaw = Math.sin(yaw), cosYaw = Math.cos(yaw);

                if (Math.abs(moveState.forward) > 0.05) {
                    moveVector.x -= sinYaw * moveState.forward * currentSpeed * delta;
                    moveVector.z -= cosYaw * moveState.forward * currentSpeed * delta;
                }
                if (Math.abs(moveState.right) > 0.05) {
                    moveVector.x += cosYaw * moveState.right * currentSpeed * delta;
                    moveVector.z -= sinYaw * moveState.right * currentSpeed * delta;
                }

                const nextX = camera.position.clone().add(new THREE.Vector3(moveVector.x, 0, 0));
                if (!checkCollision(nextX)) camera.position.x = nextX.x;

                const nextZ = camera.position.clone().add(new THREE.Vector3(0, 0, moveVector.z));
                if (!checkCollision(nextZ)) camera.position.z = nextZ.z;

                const isMoving = Math.abs(moveState.forward) > 0.1 || Math.abs(moveState.right) > 0.1;
                if (isMoving && isGrounded && !modSettings.fly) {
                    walkTimer += delta * 12;
                    camera.position.y = currentCamHeight + Math.sin(walkTimer) * 0.04;
                    handsGunGroup.position.x = handsBasePos.x + Math.cos(walkTimer * 0.5) * 0.015;
                    handsGunGroup.position.y = handsBasePos.y + Math.sin(walkTimer) * 0.015;
                } else {
                    camera.position.y = currentCamHeight;
                    handsGunGroup.position.copy(handsBasePos);
                }

                // ФИЗИКА ГРАВИТАЦИИ И ПРЫЖКА (НАСТРОЕНО ПОД SHOTER)
                if (!modSettings.fly) {
                    verticalVelocity -= 26 * delta; // Мягкая гравитация
                    camera.position.y += verticalVelocity * delta;
                    if (camera.position.y <= currentCamHeight) {
                        camera.position.y = currentCamHeight;
                        verticalVelocity = 0;
                        isGrounded = true;
                    }
                }

                if (isFiring) {
                    if (time - lastShotTime >= baseFireInterval) {
                        shoot(); lastShotTime = time;
                    }
                }

                recoilOffset += (0 - recoilOffset) * 0.18;
                handsGunGroup.position.z = handsBasePos.z + recoilOffset;

                processModFeatures();
            }

            prevTime = time;
            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
