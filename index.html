<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Standoff Mobile Project</title>
    <style>
        /* Сброс стилей */
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; font-family: 'Segoe UI', sans-serif; }
        body { background: #0b0c10; color: white; overflow: hidden; height: 100vh; width: 100vw; position: relative; touch-action: none; }
        
        /* --- Главное Меню (Лобби) --- */
        .main-menu {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 12, 18, 0.95); backdrop-filter: blur(5px);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 50; gap: 20px; transition: opacity 0.3s;
        }
        .main-menu.hidden { opacity: 0; pointer-events: none; }
        .menu-title { font-size: 28px; font-weight: 900; color: #f7931e; text-shadow: 0 0 20px rgba(247, 147, 30, 0.4); margin-bottom: 20px; }
        
        .menu-grid { display: flex; flex-direction: column; gap: 15px; width: 80%; max-width: 300px; }
        .menu-btn {
            padding: 18px; border-radius: 12px; background: #1f2229; border: 1px solid #2a2d35;
            text-align: center; font-size: 18px; font-weight: bold; cursor: pointer;
            transition: 0.2s; text-transform: uppercase; letter-spacing: 1px;
        }
        .menu-btn:active { transform: scale(0.95); background: #2c303a; }
        .menu-btn.play { background: #e74c3c; border-color: #ff6b6b; box-shadow: 0 4px 15px rgba(231, 76, 60, 0.3); }
        .menu-btn.shop { background: #2c3e50; border-color: #3498db; }

        /* --- Игровой HUD (Верхняя панель) --- */
        .hud-top { position: absolute; top: 15px; left: 15px; right: 15px; display: flex; justify-content: space-between; align-items: center; z-index: 10; pointer-events: none; }
        .hud-top > * { pointer-events: auto; background: rgba(0,0,0,0.6); padding: 6px 12px; border-radius: 20px; backdrop-filter: blur(2px); font-size: 14px; border: 1px solid rgba(255,255,255,0.1); }
        .gold-display { color: #ffd700; font-weight: bold; }
        .stats-display { display: flex; gap: 10px; color: #aaa; }
        .stats-display b { color: white; }

        /* --- Карта (Canvas) --- */
        #gameCanvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: block;
            background: #d2b48c; touch-action: none; z-index: 1;
        }

        /* --- Нижняя панель (Джойстик + Стрельба) --- */
        .bottom-controls {
            position: absolute; bottom: 30px; left: 0; right: 0; display: flex; justify-content: space-between;
            padding: 0 30px; z-index: 10; pointer-events: none; height: 120px; align-items: flex-end;
        }
        
        /* ДЖОЙСТИК - Увеличен и сделан заметным */
        .joystick-area {
            pointer-events: auto; width: 130px; height: 130px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(4px);
            border: 2px solid rgba(255, 255, 255, 0.25); position: relative;
            display: flex; align-items: center; justify-content: center; touch-action: none;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }
        .joystick-knob {
            width: 60px; height: 60px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,0.9), rgba(200,200,200,0.6));
            position: absolute; left: 35px; top: 35px; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: none; touch-action: none;
        }

        /* КНОПКА СТРЕЛЬБЫ */
        .fire-btn {
            pointer-events: auto; width: 80px; height: 80px; border-radius: 50%;
            background: radial-gradient(circle, #ff4757, #c0392b); border: 4px solid #ff6b81;
            box-shadow: 0 0 25px rgba(255, 71, 87, 0.6); touch-action: none;
            display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: bold;
            color: white; text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        .fire-btn:active { transform: scale(0.85); }

        /* --- ПЕРЕТАСКИВАЕМОЕ МЕНЮ ЧИТОВ --- */
        .cheat-toggle {
            position: absolute; bottom: 180px; right: 20px; z-index: 20; pointer-events: auto;
            background: #c0392b; padding: 10px; border-radius: 50%; width: 45px; height: 45px;
            display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 20px;
            border: 1px solid #e74c3c; box-shadow: 0 4px 10px rgba(0,0,0,0.5); cursor: pointer;
        }
        
        .cheat-panel {
            position: absolute; top: 100px; left: 50px; width: 160px;
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(10px);
            padding: 15px; border-radius: 12px; border: 1px solid rgba(255, 0, 0, 0.4); z-index: 30;
            display: none; flex-direction: column; gap: 12px; pointer-events: auto; cursor: grab;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .cheat-panel:active { cursor: grabbing; }
        .cheat-item { display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
        
        /* Свитч (переключатель) */
        .switch { position: relative; display: inline-block; width: 32px; height: 18px; }
        .slider { position: absolute; cursor: pointer; background: #444; transition: .4s; border-radius: 18px; width: 100%; height: 100%; }
        .slider:before { content: ""; height: 14px; width: 14px; left: 2px; bottom: 2px; background: white; position: absolute; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background: #2196F3; }
        input:checked + .slider:before { transform: translateX(14px); }

        /* --- МОДАЛЬНЫЕ ОКНА (Кейсы, Магазин) --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); backdrop-filter: blur(8px);
            display: none; align-items: center; justify-content: center; z-index: 100; padding: 15px;
        }
        .modal-panel {
            background: #16181e; width: 100%; max-width: 400px; max-height: 85vh;
            border-radius: 20px; padding: 20px; border: 1px solid #2a2d35; position: relative;
            display: flex; flex-direction: column; overflow: hidden;
        }
        .modal-title { font-size: 20px; font-weight: bold; margin-bottom: 15px; text-align: center; }
        .close-btn { position: absolute; top: 15px; right: 15px; background: #2c303a; width: 30px; height: 30px; border-radius: 50%; text-align: center; line-height: 30px; cursor: pointer; }

        /* Магазин */
        .shop-list { display: flex; flex-direction: column; gap: 12px; margin-top: 10px; }
        .shop-item { display: flex; justify-content: space-between; background: #1f2229; padding: 12px 15px; border-radius: 10px; align-items: center; }
        .buy-btn { background: #2ecc71; border: none; color: white; padding: 8px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; }

        /* Анимация Кейсов */
        .case-select-area { display: flex; justify-content: space-around; margin-bottom: 15px; }
        .case-box { background: #1f2229; padding: 15px; border-radius: 10px; width: 45%; text-align: center; border: 2px solid transparent; cursor: pointer; }
        .case-box.active { border-color: #f7931e; background: #2c303a; }
        
        .slot-machine-wrap { height: 90px; background: #0f1014; border-radius: 10px; overflow: hidden; position: relative; margin: 10px 0; border: 1px solid #2a2d35; }
        .highlight-bar { position: absolute; top: 0; left: 50%; height: 100%; width: 60px; background: rgba(247, 147, 30, 0.2); border: 2px solid #f7931e; transform: translateX(-50%); pointer-events: none; box-shadow: 0 0 15px #f7931e; z-index: 2; }
        .slot-machine { display: flex; position: relative; left: 0; transition: left 2.5s cubic-bezier(0.2, 1, 0.3, 1); }
        .slot-item { min-width: 60px; height: 90px; display: flex; align-items: center; justify-content: center; border-right: 1px solid #222; background: #1a1c22; font-size: 11px; text-align: center; padding: 5px; }
        
        .btn-open-case { width: 100%; padding: 12px; background: #f7931e; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; color: white; cursor: pointer; margin-top: 15px; }
        .btn-open-case:disabled { background: #444; cursor: not-allowed; }
    </style>
</head>
<body>

    <!-- ГЛАВНОЕ МЕНЮ (ЛОББИ) -->
    <div class="main-menu" id="mainMenu">
        <div class="menu-title">⚔️ MOBILE ARENA</div>
        <div class="menu-grid">
            <div class="menu-btn play" onclick="startGame()">▶ ИГРАТЬ</div>
            <div class="menu-btn" onclick="openModal('caseModal')">📦 КЕЙСЫ</div>
            <div class="menu-btn shop" onclick="openModal('shopModal')">🏪 МАГАЗИН</div>
        </div>
    </div>

    <!-- ИГРОВОЙ ИНТЕРФЕЙС -->
    <div id="gameUI" style="display:none;">
        <div class="hud-top">
            <div class="gold-display">🪙 <span id="goldBalance">100</span></div>
            <div class="stats-display">
                <span>K: <b id="killCount">0</b></span>
                <span>C: <b id="champCount">0</b></span>
            </div>
        </div>

        <canvas id="gameCanvas"></canvas>

        <div class="bottom-controls">
            <div class="joystick-area" id="joystickArea">
                <div class="joystick-knob" id="joystickKnob"></div>
            </div>
            <div class="fire-btn" id="fireBtn">🔫</div>
        </div>

        <div class="cheat-toggle" onclick="toggleCheatPanel()">⚡</div>
        <div class="cheat-panel" id="cheatPanel">
            <div class="cheat-item">AimBot <label class="switch"><input type="checkbox" id="chAim"><span class="slider"></span></label></div>
            <div class="cheat-item">WallHack <label class="switch"><input type="checkbox" id="chESP"><span class="slider"></span></label></div>
            <div class="cheat-item" style="flex-direction: column; gap:5px; align-items: stretch; margin-top:5px;">
                <button onclick="giveGold()" style="background:#3498db; border:none; color:white; padding:6px; border-radius:5px; cursor:pointer;">+500 Gold</button>
                <button onclick="spawnChamp()" style="background:#9b59b6; border:none; color:white; padding:6px; border-radius:5px; cursor:pointer;">Спавн Чемпиона</button>
            </div>
        </div>
    </div>

    <!-- МОДАЛЬНЫЕ ОКНА -->
    
    <!-- Магазин -->
    <div class="modal-overlay" id="shopModal">
        <div class="modal-panel">
            <div class="modal-title">🏪 Магазин</div>
            <div class="close-btn" onclick="closeModal('shopModal')">✖</div>
            <div class="shop-list">
                <div class="shop-item">📦 Empire Case <button class="buy-btn" onclick="buyCase('Empire', 50)">50 🪙</button></div>
                <div class="shop-item">🎁 Classic Case <button class="buy-btn" onclick="buyCase('Classic', 30)">30 🪙</button></div>
            </div>
        </div>
    </div>

    <!-- Кейсы -->
    <div class="modal-overlay" id="caseModal">
        <div class="modal-panel">
            <div class="modal-title">📦 Открытие</div>
            <div class="close-btn" onclick="closeModal('caseModal')">✖</div>
            
            <div class="case-select-area">
                <div class="case-box active" id="caseEmpire" onclick="selectCase('Empire')">Empire<br><span style="font-size:10px; color:#aaa;">Стоимость: 50🪙</span></div>
                <div class="case-box" id="caseClassic" onclick="selectCase('Classic')">Classic<br><span style="font-size:10px; color:#aaa;">Стоимость: 30🪙</span></div>
            </div>

            <div class="slot-machine-wrap">
                <div class="highlight-bar"></div>
                <div class="slot-machine" id="slotMachine">
                    <!-- JS генерит слоты -->
                </div>
            </div>

            <button class="btn-open-case" id="openCaseBtn" onclick="startCaseOpening()">ОТКРЫТЬ</button>
        </div>
    </div>

<script>
// =========================================================
// JAVASCRIPT ЛОГИКА
// =========================================================

// --- БАЗА СКИНОВ ---
const skinDatabase = {
    'Empire': [
        { name: 'AKR "Sport"', rarity: 'Epic', color: '#9b59b6' },
        { name: 'AWM "Cold-blooded"', rarity: 'Legendary', color: '#f1c40f' },
        { name: 'Desert Eagle "Hunter"', rarity: 'Rare', color: '#3498db' },
        { name: 'M60 "Quantum"', rarity: 'Epic', color: '#9b59b6' },
        { name: 'Gloves "Punk"', rarity: 'Legendary', color: '#f1c40f' },
        { name: 'Charm "Project Z"', rarity: 'Common', color: '#bdc3c7' }
    ],
    'Classic': [
        { name: 'AKR "Blue Gem"', rarity: 'Rare', color: '#3498db' },
        { name: 'Desert Eagle "Inferno"', rarity: 'Epic', color: '#9b59b6' },
        { name: 'Charm "Gold"', rarity: 'Legendary', color: '#f1c40f' },
        { name: 'AWM "Icetech"', rarity: 'Common', color: '#bdc3c7' },
        { name: 'Gloves "Champion"', rarity: 'Legendary', color: '#f1c40f' }
    ]
};

let playerGold = 100;
let inventory = [];
let currentCaseType = 'Empire';
let isSpinning = false;
let gameRunning = false;

// Игрок и враги
let player = { x: 200, y: 200, radius: 16, angle: 0, score: 0, champScore: 0 };
let enemies = [];
let bullets = [];
let lastShotTime = 0;
let joystickData = { dx: 0, dy: 0 };
let cheats = { aimbot: false, esp: false };

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// ================== 1. МЕНЮ И UI ==================

function startGame() {
    document.getElementById('mainMenu').classList.add('hidden');
    document.getElementById('gameUI').style.display = 'block';
    resizeCanvas();
    gameRunning = true;
    // Спавн врагов
    for(let i=0; i<5; i++) spawnEnemy();
    gameLoop();
}

function updateUI() {
    document.getElementById('goldBalance').innerText = playerGold;
    document.getElementById('killCount').innerText = player.score;
    document.getElementById('champCount').innerText = player.champScore;
}

function giveGold() { playerGold += 500; updateUI(); }

// Магазин
function buyCase(type, price) {
    if(playerGold >= price) {
        playerGold -= price;
        updateUI();
        alert(`Кейс ${type} куплен! Перейдите в раздел "Кейсы", чтобы открыть его.`);
        // Добавляем кейс в "инвентарь кейсов" (в данном случае просто разрешаем открыть)
        // Тут можно добавить логику инвентаря кейсов.
    } else {
        alert("Недостаточно золота! Сыграй в режиме Арены.");
    }
}

// Модалки
function openModal(id) { document.getElementById(id).style.display = 'flex'; }
function closeModal(id) { document.getElementById(id).style.display = 'none'; }

// ================== 2. КЕЙСЫ И ПРОКРУТКА ==================

function selectCase(type) {
    currentCaseType = type;
    document.querySelectorAll('.case-box').forEach(el => el.classList.remove('active'));
    document.getElementById(type === 'Empire' ? 'caseEmpire' : 'caseClassic').classList.add('active');
}

function startCaseOpening() {
    if (isSpinning) return;
    if (playerGold < 30) { alert("Не хватает золота! Заработай в игре."); return; }
    
    playerGold -= (currentCaseType === 'Empire' ? 50 : 30);
    updateUI();
    isSpinning = true;
    document.getElementById('openCaseBtn').disabled = true;

    const pool = skinDatabase[currentCaseType];
    let rollItems = [];
    const winIndex = Math.floor(Math.random() * pool.length);
    
    for(let i=0; i<25; i++) rollItems.push(pool[Math.floor(Math.random() * pool.length)]);
    rollItems.push(pool[winIndex]); // Выигрышный в конец

    const slotMachine = document.getElementById('slotMachine');
    slotMachine.innerHTML = '';
    rollItems.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'slot-item';
        div.innerText = item.name;
        if(index === rollItems.length - 1) div.classList.add('active');
        slotMachine.appendChild(div);
    });

    // Анимация прокрутки
    const itemWidth = 60; // ширина слота в CSS
    const totalWidth = (rollItems.length - 1) * itemWidth; 
    slotMachine.style.left = `0px`;
    
    setTimeout(() => {
        slotMachine.style.left = `-${totalWidth}px`;
    }, 50);

    // Окончание
    setTimeout(() => {
        const winSkin = rollItems[rollItems.length - 1];
        inventory.push(winSkin);
        isSpinning = false;
        document.getElementById('openCaseBtn').disabled = false;
        alert(`Ты получил: ${winSkin.name} (${winSkin.rarity})`);
        document.getElementById('openCaseBtn').innerText = "ОТКРЫТЬ";
    }, 2500);
}

// ================== 3. МИНИ-ИГРА (ДВИЖЕНИЕ, СТРЕЛЬБА, ПОВОРОТ) ==================

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);

function spawnEnemy() {
    if(enemies.length < 12) {
        let x, y;
        do {
            x = Math.random() * canvas.width;
            y = Math.random() * canvas.height;
        } while (Math.hypot(x - player.x, y - player.y) < 150);
        
        enemies.push({
            x, y, radius: 12, hp: 50, maxHp: 50,
            speed: 1.5 + Math.random() * 1.5, isChamp: Math.random() < 0.1
        });
    }
}

function spawnChamp() {
    let x = Math.random() * canvas.width;
    let y = Math.random() * canvas.height;
    enemies.push({ x, y, radius: 18, hp: 150, maxHp: 150, speed: 2.5, isChamp: true });
}

function shootBullet() {
    if(!gameRunning) return;
    const now = Date.now();
    if(now - lastShotTime > 200) {
        lastShotTime = now;
        
        let targetX = player.x + Math.cos(player.angle) * 1000;
        let targetY = player.y + Math.sin(player.angle) * 1000;

        // AIMBOT ЧИТ
        if(cheats.aimbot && enemies.length > 0) {
            let nearest = enemies[0];
            let minDist = Infinity;
            enemies.forEach(enemy => {
                let d = Math.hypot(enemy.x - player.x, enemy.y - player.y);
                if(d < minDist) { minDist = d; nearest = enemy; }
            });
            targetX = nearest.x; targetY = nearest.y;
        }

        bullets.push({ x: player.x, y: player.y, targetX, targetY, speed: 10, damage: 30 });
    }
}

// Обновление логики
function updateGame() {
    if(!gameRunning) return;

    // Движение
    player.x += joystickData.dx * 5;
    player.y += joystickData.dy * 5;
    player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
    player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y));

    // ПОВОРОТ ИГРОКА (за джойстиком)
    if(joystickData.dx !== 0 || joystickData.dy !== 0) {
        player.angle = Math.atan2(joystickData.dy, joystickData.dx);
    }

    // Враги бегут к игроку
    enemies.forEach(enemy => {
        let dx = player.x - enemy.x, dy = player.y - enemy.y;
        let len = Math.hypot(dx, dy);
        if(len > 5) { enemy.x += (dx / len) * enemy.speed; enemy.y += (dy / len) * enemy.speed; }
    });

    // Пули
    for(let i = bullets.length - 1; i >= 0; i--) {
        let b = bullets[i];
        let dx = b.targetX - b.x, dy = b.targetY - b.y;
        let len = Math.hypot(dx, dy);
        if(len < 5) { bullets.splice(i, 1); continue; }
        b.x += (dx / len) * b.speed; b.y += (dy / len) * b.speed;

        for(let j = enemies.length - 1; j >= 0; j--) {
            let enemy = enemies[j];
            let d = Math.hypot(b.x - enemy.x, b.y - enemy.y);
            if(d < enemy.radius) {
                enemy.hp -= b.damage; bullets.splice(i, 1);
                if(enemy.hp <= 0) {
                    let killed = enemies.splice(j, 1)[0];
                    if(killed.isChamp) { player.champScore++; playerGold += 50; } 
                    else { player.score++; playerGold += 10; }
                    updateUI(); spawnEnemy();
                }
                break;
            }
        }
    }
}

// Рисовка
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // Карта
    ctx.fillStyle = '#c9ae84'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // ESP ЧИТ (Стены не нужны, это 2D, просто подсветка)
    if(cheats.esp) {
        enemies.forEach(enemy => {
            ctx.beginPath(); ctx.arc(enemy.x, enemy.y, enemy.radius + 10, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255, 0, 0, 0.8)'; ctx.lineWidth = 3; ctx.stroke();
        });
    }

    // Враги
    enemies.forEach(enemy => {
        ctx.beginPath(); ctx.arc(enemy.x, enemy.y, enemy.radius, 0, Math.PI * 2);
        ctx.fillStyle = enemy.isChamp ? '#e67e22' : '#e74c3c'; ctx.fill();
        ctx.fillStyle = 'white'; ctx.font = '10px Arial'; ctx.textAlign = 'center';
        ctx.fillText(enemy.isChamp ? '👑' : '💀', enemy.x, enemy.y-4);
        
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(enemy.x - 20, enemy.y - enemy.radius - 10, 40, 5);
        ctx.fillStyle = '#2ecc71';
        ctx.fillRect(enemy.x - 20, enemy.y - enemy.radius - 10, 40 * (enemy.hp / enemy.maxHp), 5);
    });

    // Пули
    ctx.fillStyle = '#f1c40f'; ctx.shadowBlur = 10; ctx.shadowColor = '#f1c40f';
    bullets.forEach(b => { ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, Math.PI*2); ctx.fill(); });
    ctx.shadowBlur = 0;

    // Игрок (ПОВОРОТ)
    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.rotate(player.angle);
    
    // Тело
    ctx.beginPath(); ctx.arc(0, 0, player.radius, 0, Math.PI * 2);
    ctx.fillStyle = '#3498db'; ctx.fill(); ctx.strokeStyle = 'white'; ctx.lineWidth = 3; ctx.stroke();
    
    // Ствол (Показывает куда смотрит игрок)
    ctx.fillStyle = '#2c3e50';
    ctx.fillRect(player.radius - 5, -4, 20, 8); // Длинна ствола 20 пикселей
    
    ctx.restore();
}

// Цикл
function gameLoop() {
    updateGame(); draw(); requestAnimationFrame(gameLoop);
}

// ================== 4. УПРАВЛЕНИЕ ПАЛЬЦЕМ ==================

const joystickArea = document.getElementById('joystickArea');
const joystickKnob = document.getElementById('joystickKnob');
let isDragging = false;

function handleJoystickMove(clientX, clientY) {
    if(!isDragging) return;
    const rect = joystickArea.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;
    
    let dx = clientX - centerX;
    let dy = clientY - centerY;
    const distance = Math.hypot(dx, dy);
    const maxDist = rect.width / 2 - 10;

    if(distance > maxDist) {
        dx = (dx / distance) * maxDist;
        dy = (dy / distance) * maxDist;
    }

    joystickKnob.style.left = (dx + 35) + 'px';
    joystickKnob.style.top = (dy + 35) + 'px';

    // Передаем в игру (от -1 до 1)
    joystickData.dx = dx / maxDist;
    joystickData.dy = dy / maxDist;
}

// Тач-события
joystickArea.addEventListener('touchstart', (e) => {
    isDragging = true; handleJoystickMove(e.touches[0].clientX, e.touches[0].clientY);
});
window.addEventListener('touchmove', (e) => {
    if(isDragging) handleJoystickMove(e.touches[0].clientX, e.touches[0].clientY);
});
window.addEventListener('touchend', () => {
    isDragging = false; joystickData.dx = 0; joystickData.dy = 0;
    joystickKnob.style.left = '35px'; joystickKnob.style.top = '35px';
});

// Кнопка стрельбы (Автоматическая стрельба - зажми и держи)
let fireInterval;
document.getElementById('fireBtn').addEventListener('touchstart', (e) => {
    e.preventDefault(); shootBullet(); fireInterval = setInterval(shootBullet, 200);
});
document.getElementById('fireBtn').addEventListener('touchend', (e) => {
    e.preventDefault(); clearInterval(fireInterval);
});

// ================== 5. ПЕРЕТАСКИВАНИЕ МОД-МЕНЮ ==================

const cheatPanel = document.getElementById('cheatPanel');
let offsetX, offsetY, isDraggingCheat = false;

cheatPanel.addEventListener('touchstart', (e) => {
    isDraggingCheat = true;
    const touch = e.touches[0];
    const rect = cheatPanel.getBoundingClientRect();
    offsetX = touch.clientX - rect.left;
    offsetY = touch.clientY - rect.top;
});

window.addEventListener('touchmove', (e) => {
    if(!isDraggingCheat) return;
    const touch = e.touches[0];
    // Ограничиваем, чтобы не улетел за экран
    let newX = Math.max(0, touch.clientX - offsetX);
    let newY = Math.max(0, touch.clientY - offsetY);
    if (newX + cheatPanel.offsetWidth > window.innerWidth) newX = window.innerWidth - cheatPanel.offsetWidth;
    if (newY + cheatPanel.offsetHeight > window.innerHeight) newY = window.innerHeight - cheatPanel.offsetHeight;

    cheatPanel.style.left = newX + 'px';
    cheatPanel.style.top = newY + 'px';
});

window.addEventListener('touchend', () => { isDraggingCheat = false; });

function toggleCheatPanel() {
    cheatPanel.style.display = cheatPanel.style.display === 'block' ? 'none' : 'block';
}

// Чит переключатели
document.getElementById('chAim').addEventListener('change', (e) => cheats.aimbot = e.target.checked);
document.getElementById('chESP').addEventListener('change', (e) => cheats.esp = e.target.checked);

updateUI();
</script>
