<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Standoff / CS 3D Crossplatform</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #121212;
            color: #fff;
        }

        /* --- Меню --- */
        #menu-screen {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: linear-gradient(135deg, #1a1c23 0%, #0d0e12 100%);
            z-index: 20;
        }

        .header { text-align: center; margin-top: 10px; }
        .header h1 {
            font-size: 2.2rem;
            color: #ff9d00;
            text-shadow: 0 0 10px rgba(255, 157, 0, 0.5);
        }
        .header p { color: #8a8d9b; font-size: 0.9rem; margin-top: 5px; }

        .gallery-container { width: 100%; max-width: 800px; }
        .screenshots {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        .screen-card {
            background: #222531;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #333748;
            text-align: center;
            font-size: 0.8rem;
            padding-bottom: 8px;
        }
        .screen-mockup {
            height: 90px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
        }
        .mock-1 { background: linear-gradient(45deg, #2b32b2, #1488cc); }
        .mock-2 { background: linear-gradient(45deg, #cc2b5e, #753a88); }
        .mock-3 { background: linear-gradient(45deg, #42275a, #734b6d); }

        .mode-selection {
            display: flex;
            gap: 15px;
            margin-bottom: 10px;
            width: 100%;
            max-width: 400px;
        }
        .btn {
            flex: 1;
            padding: 14px;
            font-size: 1rem;
            font-weight: bold;
            color: #000;
            background: #ff9d00;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 157, 0, 0.3);
        }
        .btn:active { transform: scale(0.98); }

        /* --- HUD --- */
        #game-hud {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: none;
            pointer-events: none;
            z-index: 5;
        }

        #crosshair {
            position: absolute;
            top: 50%; left: 50%;
            width: 10px; height: 10px;
            transform: translate(-50%, -50%);
        }
        #crosshair::before, #crosshair::after {
            content: ''; position: absolute; background: rgba(0, 255, 0, 0.8);
        }
        #crosshair::before { top: 4px; left: -8px; width: 26px; height: 2px; }
        #crosshair::after { top: -8px; left: 4px; width: 2px; height: 26px; }

        .hud-panel {
            position: absolute;
            top: 15px;
            background: rgba(0, 0, 0, 0.6);
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: bold;
        }
        #health-hud { left: 15px; color: #4ade80; }
        #score-hud { right: 15px; color: #ff9d00; }

        /* Canvas для ESP и Окружности Аима */
        #esp-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 4;
        }

        /* --- Абсолютный слой для Мод Меню --- */
        #mod-container {
            position: absolute;
            top: 60px; left: 15px;
            z-index: 9999;
            pointer-events: auto;
        }

        #mod-toggle-btn {
            background: #a855f7;
            color: #fff;
            border: 2px solid #fff;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.8);
            display: block;
        }

        #mod-menu {
            margin-top: 10px;
            width: 250px;
            background: rgba(18, 18, 24, 0.98);
            border: 2px solid #a855f7;
            border-radius: 12px;
            padding: 16px;
            display: none;
            flex-direction: column;
            gap: 14px;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.9);
        }
        #mod-menu h3 {
            color: #a855f7;
            font-size: 1.1rem;
            text-align: center;
            border-bottom: 1px solid #333;
            padding-bottom: 6px;
        }
        .mod-option {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.95rem;
            cursor: pointer;
        }
        .mod-option input[type="checkbox"] {
            width: 20px; height: 20px;
            accent-color: #a855f7;
            cursor: pointer;
        }
        .slider-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 0.85rem;
        }
        .slider-group input[type="range"] {
            accent-color: #a855f7;
            cursor: pointer;
        }

        /* --- Сенсорное управление --- */
        #touch-controls {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: none;
            z-index: 10;
        }

        #joystick-zone {
            position: absolute;
            bottom: 30px; left: 30px;
            width: 130px; height: 130px;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
        }
        #joystick-stick {
            position: absolute;
            top: 40px; left: 40px;
            width: 50px; height: 50px;
            background: rgba(255, 157, 0, 0.85);
            border-radius: 50%;
        }

        #fire-btn {
            position: absolute;
            bottom: 40px; right: 40px;
            width: 80px; height: 80px;
            background: rgba(239, 68, 68, 0.85);
            border: 2px solid #fff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 0.9rem;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.5);
        }

        #touch-look-zone {
            position: absolute;
            top: 0; right: 0;
            width: 50%; height: 100%;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="menu-screen">
        <div class="header">
            <h1>STANDOFF / CS 3D</h1>
            <p>Выбери режим управления для старта</p>
        </div>

        <div class="gallery-container">
            <div class="screenshots">
                <div class="screen-card">
                    <div class="screen-mockup mock-1">3D Map</div>
                    <p>Карта со стенами</p>
                </div>
                <div class="screen-card">
                    <div class="screen-mockup mock-2">Crossplatform</div>
                    <p>ПК и Мобильная</p>
                </div>
                <div class="screen-card">
                    <div class="screen-mockup mock-3">Shooter</div>
                    <p>Стрельба</p>
                </div>
            </div>
        </div>

        <div class="mode-selection">
            <button class="btn" id="start-pc">ПК (Клавиатура + Мышь)</button>
            <button class="btn" id="start-mobile" style="background:#4ade80;">Телефон (Сенсор)</button>
        </div>
    </div>

    <!-- Canvas для ESP и FOV-круга -->
    <canvas id="esp-canvas"></canvas>

    <div id="game-hud">
        <div id="crosshair"></div>
        <div id="health-hud" class="hud-panel">+ 100</div>
        <div id="score-hud" class="hud-panel">УБИТО: <span id="score">0</span></div>
    </div>

    <!-- Автономный слой для Мод-Меню -->
    <div id="mod-container">
        <button id="mod-toggle-btn">⚙️ MOD MENU</button>
        <div id="mod-menu">
            <h3>DEV MOD MENU</h3>
            <label class="mod-option" for="esp-toggle">
                <span>Включить ESP</span>
                <input type="checkbox" id="esp-toggle">
            </label>
            <label class="mod-option" for="aim-toggle">
                <span>Включить AimBot</span>
                <input type="checkbox" id="aim-toggle">
            </label>
            <div class="slider-group">
                <label for="aim-fov">Размер круга Aim (FOV): <span id="fov-val">120</span>px</label>
                <input type="range" id="aim-fov" min="40" max="300" value="120">
            </div>
        </div>
    </div>

    <div id="touch-controls">
        <div id="touch-look-zone"></div>
        <div id="joystick-zone">
            <div id="joystick-stick"></div>
        </div>
        <div id="fire-btn">ОГОНЬ</div>
    </div>

    <script>
        let scene, camera, renderer;
        let targets = [], obstacles = [], score = 0;
        let isGameActive = false, isMobileMode = false;

        // Движение
        const moveState = { forward: 0, right: 0 };
        const speed = 12.0;
        let pitch = 0, yaw = 0;

        // Оружие
        let gunGroup, muzzleFlash;

        // Настройки Мод-Меню
        const modSettings = {
            esp: false,
            aim: false,
            aimFov: 120
        };

        // ESP Canvas
        let espCanvas, espCtx;

        // DOM элементы
        const menuScreen = document.getElementById('menu-screen');
        const gameHud = document.getElementById('game-hud');
        const touchControls = document.getElementById('touch-controls');
        const scoreEl = document.getElementById('score');

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1e1e24);
            scene.fog = new THREE.FogExp2(0x1e1e24, 0.015);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            // Canvas для отрисовки ESP
            espCanvas = document.getElementById('esp-canvas');
            espCtx = espCanvas.getContext('2d');
            resizeEspCanvas();

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(20, 40, 20);
            dirLight.castShadow = true;
            scene.add(dirLight);

            createMap();
            createGun();
            for (let i = 0; i < 6; i++) spawnTarget();

            window.addEventListener('resize', onWindowResize);
            
            document.getElementById('start-pc').addEventListener('click', () => {
                isMobileMode = false;
                document.body.requestPointerLock();
            });

            document.getElementById('start-mobile').addEventListener('click', () => {
                isMobileMode = true;
                startGame();
            });

            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);
            document.addEventListener('mousemove', onMouseMove);
            
            // Захват мыши при клике по игре (если меню закрыто)
            document.addEventListener('mousedown', (e) => { 
                const modMenu = document.getElementById('mod-menu');
                if (!isMobileMode && isGameActive && modMenu.style.display !== 'flex') {
                    if (document.pointerLockElement !== document.body) {
                        document.body.requestPointerLock();
                    } else if (e.button === 0) {
                        shoot();
                    }
                }
            });

            document.addEventListener('pointerlockchange', () => {
                if (!isMobileMode) {
                    if (document.pointerLockElement === document.body) startGame();
                }
            });

            setupModMenuUI();
            setupTouchControls();
            animate(0);
        }

        function resizeEspCanvas() {
            espCanvas.width = window.innerWidth;
            espCanvas.height = window.innerHeight;
        }

        function setupModMenuUI() {
            const modBtn = document.getElementById('mod-toggle-btn');
            const modMenu = document.getElementById('mod-menu');
            const modContainer = document.getElementById('mod-container');
            const espCheck = document.getElementById('esp-toggle');
            const aimCheck = document.getElementById('aim-toggle');
            const fovSlider = document.getElementById('aim-fov');
            const fovVal = document.getElementById('fov-val');

            // Полный перехват событий кликов по элементам Мод-меню
            ['click', 'mousedown', 'touchstart', 'touchend'].forEach(evt => {
                modContainer.addEventListener(evt, (e) => e.stopPropagation());
            });

            // Переключение видимости меню
            modBtn.addEventListener('click', (e) => {
                e.preventDefault();
                e.stopPropagation();

                if (modMenu.style.display === 'flex') {
                    modMenu.style.display = 'none';
                    if (!isMobileMode) document.body.requestPointerLock();
                } else {
                    modMenu.style.display = 'flex';
                    if (!isMobileMode && document.pointerLockElement) {
                        document.exitPointerLock(); // Высвобождение курсора на ПК
                    }
                }
            });

            // Тумблеры и слайдер
            espCheck.addEventListener('change', (e) => modSettings.esp = e.target.checked);
            aimCheck.addEventListener('change', (e) => modSettings.aim = e.target.checked);
            fovSlider.addEventListener('input', (e) => {
                modSettings.aimFov = parseInt(e.target.value);
                fovVal.innerText = modSettings.aimFov;
            });
        }

        function startGame() {
            isGameActive = true;
            menuScreen.style.display = 'none';
            gameHud.style.display = 'block';
            if (isMobileMode) touchControls.style.display = 'block';
        }

        function stopGame() {
            isGameActive = false;
            menuScreen.style.display = 'flex';
            gameHud.style.display = 'none';
            touchControls.style.display = 'none';
        }

        function createMap() {
            obstacles = [];

            const floor = new THREE.Mesh(
                new THREE.PlaneGeometry(80, 80),
                new THREE.MeshStandardMaterial({ color: 0x2c2c34 })
            );
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            const wallMat = new THREE.MeshStandardMaterial({ color: 0x3f3f4c });
            const wallGeo1 = new THREE.BoxGeometry(80, 10, 2);
            const wallGeo2 = new THREE.BoxGeometry(2, 10, 80);

            const N = new THREE.Mesh(wallGeo1, wallMat); N.position.set(0, 5, -40);
            const S = new THREE.Mesh(wallGeo1, wallMat); S.position.set(0, 5, 40);
            const E = new THREE.Mesh(wallGeo2, wallMat); E.position.set(40, 5, 0);
            const W = new THREE.Mesh(wallGeo2, wallMat); W.position.set(-40, 5, 0);

            [N, S, E, W].forEach(wall => {
                scene.add(wall);
                obstacles.push(wall);
            });

            const boxGeo = new THREE.BoxGeometry(4, 4, 4);
            const boxMat = new THREE.MeshStandardMaterial({ color: 0xd97706 });
            [[-10, 2, -10], [10, 2, -15], [-5, 2, 10], [15, 2, 5]].forEach(pos => {
                const box = new THREE.Mesh(boxGeo, boxMat);
                box.position.set(...pos);
                box.castShadow = true;
                box.receiveShadow = true;
                scene.add(box);
                obstacles.push(box);
            });
        }

        function createGun() {
            gunGroup = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.18, 0.7), new THREE.MeshStandardMaterial({ color: 0x111111 }));
            const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.4), new THREE.MeshStandardMaterial({ color: 0x111111 }));
            barrel.rotation.x = Math.PI / 2;
            barrel.position.set(0, 0.03, -0.45);

            muzzleFlash = new THREE.Mesh(new THREE.SphereGeometry(0.08, 8, 8), new THREE.MeshBasicMaterial({ color: 0xffaa00, transparent: true, opacity: 0 }));
            muzzleFlash.position.set(0, 0.03, -0.7);

            gunGroup.add(body, barrel, muzzleFlash);
            gunGroup.position.set(0.25, -0.25, -0.5);
            camera.add(gunGroup);
            scene.add(camera);
        }

        function spawnTarget() {
            const target = new THREE.Group();
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.4, 16, 16), new THREE.MeshStandardMaterial({ color: 0xef4444 }));
            head.position.y = 1.6;
            head.name = "head";
            
            const body = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.3, 1.2), new THREE.MeshStandardMaterial({ color: 0x991b1b }));
            body.position.y = 0.8;

            target.add(head, body);
            target.position.x = (Math.random() - 0.5) * 60;
            target.position.z = -10 - Math.random() * 25;
            scene.add(target);
            targets.push(target);
        }

        function shoot() {
            gunGroup.position.z = -0.4;
            muzzleFlash.material.opacity = 1;
            setTimeout(() => { muzzleFlash.material.opacity = 0; }, 50);

            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

            const meshes = [];
            targets.forEach(t => t.traverse(c => { if(c.isMesh) meshes.push(c); }));

            const intersects = raycaster.intersectObjects(meshes);
            if (intersects.length > 0) {
                const hitTarget = intersects[0].object.parent;
                scene.remove(hitTarget);
                targets = targets.filter(t => t !== hitTarget);
                score++;
                scoreEl.innerText = score;
                setTimeout(spawnTarget, 1000);
            }
        }

        // --- Перевод 3D координат мира в 2D координаты экрана ---
        function toScreenPosition(obj, camera) {
            const vector = new THREE.Vector3();
            obj.getWorldPosition(vector);

            vector.project(camera);

            if (vector.z > 1) {
                return { x: -1000, y: -1000, visible: false };
            }

            const widthHalf = window.innerWidth / 2;
            const heightHalf = window.innerHeight / 2;

            return {
                x: (vector.x * widthHalf) + widthHalf,
                y: -(vector.y * heightHalf) + heightHalf,
                visible: true
            };
        }

        // --- Логика AIMBOT и ESP ---
        function processModFeatures() {
            espCtx.clearRect(0, 0, espCanvas.width, espCanvas.height);

            const screenCenter = { x: window.innerWidth / 2, y: window.innerHeight / 2 };

            // 1. Отрисовка FOV круга для AimBot
            if (modSettings.aim) {
                espCtx.beginPath();
                espCtx.arc(screenCenter.x, screenCenter.y, modSettings.aimFov, 0, Math.PI * 2);
                espCtx.strokeStyle = 'rgba(74, 222, 128, 0.6)';
                espCtx.lineWidth = 2;
                espCtx.stroke();
            }

            let bestTarget = null;
            let closestDist = Infinity;

            targets.forEach(target => {
                const head = target.getObjectByName("head");
                if (!head) return;

                const headScreenPos = toScreenPosition(head, camera);
                const baseScreenPos = toScreenPosition(target, camera);

                if (!headScreenPos.visible) return;

                const boxHeight = Math.abs(baseScreenPos.y - headScreenPos.y) * 1.6;
                const boxWidth = boxHeight * 0.55;

                // 2. Отрисовка ESP
                if (modSettings.esp) {
                    espCtx.strokeStyle = '#ef4444';
                    espCtx.lineWidth = 2;

                    // Квадрат вокруг игрока сквозь стены
                    espCtx.strokeRect(
                        headScreenPos.x - boxWidth / 2,
                        headScreenPos.y - boxHeight * 0.15,
                        boxWidth,
                        boxHeight
                    );

                    // Линия от верхнего края экрана (Snapline / Tracer)
                    espCtx.beginPath();
                    espCtx.moveTo(screenCenter.x, 0);
                    espCtx.lineTo(headScreenPos.x, headScreenPos.y - boxHeight * 0.15);
                    espCtx.strokeStyle = 'rgba(239, 68, 68, 0.4)';
                    espCtx.stroke();
                }

                // 3. Поиск ближайшей цели в пределах FOV круга для AimBot
                if (modSettings.aim) {
                    const distToCrosshair = Math.hypot(
                        headScreenPos.x - screenCenter.x,
                        headScreenPos.y - screenCenter.y
                    );

                    if (distToCrosshair <= modSettings.aimFov && distToCrosshair < closestDist) {
                        closestDist = distToCrosshair;
                        bestTarget = head;
                    }
                }
            });

            // Автонаведение AimBot на найденную цель
            if (modSettings.aim && bestTarget) {
                const headWorldPos = new THREE.Vector3();
                bestTarget.getWorldPosition(headWorldPos);

                const dir = headWorldPos.clone().sub(camera.position).normalize();

                const targetYaw = Math.atan2(-dir.x, -dir.z);
                const targetPitch = Math.asin(dir.y);

                // Плавная доводка
                yaw += (targetYaw - yaw) * 0.25;
                pitch += (targetPitch - pitch) * 0.25;
                applyRotation();
            }
        }

        // --- Управление ПК ---
        const keys = {};
        function onKeyDown(e) { if(!isMobileMode) keys[e.code] = true; updateKeyboardMove(); }
        function onKeyUp(e) { if(!isMobileMode) keys[e.code] = false; updateKeyboardMove(); }
        function updateKeyboardMove() {
            moveState.forward = (keys['KeyW'] ? 1 : 0) - (keys['KeyS'] ? 1 : 0);
            moveState.right = (keys['KeyD'] ? 1 : 0) - (keys['KeyA'] ? 1 : 0);
        }

        function onMouseMove(e) {
            if (!isGameActive || isMobileMode || document.pointerLockElement !== document.body) return;
            yaw -= e.movementX * 0.002;
            pitch -= e.movementY * 0.002;
            applyRotation();
        }

        function applyRotation() {
            pitch = Math.max(-Math.PI / 2 + 0.1, Math.min(Math.PI / 2 - 0.1, pitch));
            camera.rotation.order = 'YXZ';
            camera.rotation.y = yaw;
            camera.rotation.x = pitch;
        }

        // --- Сенсорное управление ---
        function setupTouchControls() {
            const joystickZone = document.getElementById('joystick-zone');
            const stick = document.getElementById('joystick-stick');
            const fireBtn = document.getElementById('fire-btn');
            const lookZone = document.getElementById('touch-look-zone');

            let joystickTouchId = null;
            let lookTouchId = null;
            let lastLookX = 0, lastLookY = 0;

            joystickZone.addEventListener('touchstart', (e) => {
                const touch = e.changedTouches[0];
                joystickTouchId = touch.identifier;
                updateJoystick(touch);
            });

            window.addEventListener('touchmove', (e) => {
                for (let touch of e.changedTouches) {
                    if (touch.identifier === joystickTouchId) {
                        updateJoystick(touch);
                    } else if (touch.identifier === lookTouchId) {
                        const dx = touch.clientX - lastLookX;
                        const dy = touch.clientY - lastLookY;
                        yaw -= dx * 0.005;
                        pitch -= dy * 0.005;
                        applyRotation();
                        lastLookX = touch.clientX;
                        lastLookY = touch.clientY;
                    }
                }
            });

            window.addEventListener('touchend', (e) => {
                for (let touch of e.changedTouches) {
                    if (touch.identifier === joystickTouchId) {
                        joystickTouchId = null;
                        stick.style.left = '40px';
                        stick.style.top = '40px';
                        moveState.forward = 0;
                        moveState.right = 0;
                    } else if (touch.identifier === lookTouchId) {
                        lookTouchId = null;
                    }
                }
            });

            function updateJoystick(touch) {
                const rect = joystickZone.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;

                let dx = touch.clientX - centerX;
                let dy = touch.clientY - centerY;
                const dist = Math.min(Math.hypot(dx, dy), 45);
                const angle = Math.atan2(dy, dx);

                const stickX = Math.cos(angle) * dist;
                const stickY = Math.sin(angle) * dist;

                stick.style.left = `${40 + stickX}px`;
                stick.style.top = `${40 + stickY}px`;

                moveState.forward = -stickY / 45;
                moveState.right = stickX / 45;
            }

            lookZone.addEventListener('touchstart', (e) => {
                const touch = e.changedTouches[0];
                lookTouchId = touch.identifier;
                lastLookX = touch.clientX;
                lastLookY = touch.clientY;
            });

            fireBtn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                if (isGameActive) shoot();
            });
        }

        // --- Столкновения со стенами ---
        function checkCollision(newPosition) {
            const playerRadius = 1.0;
            
            for (let obstacle of obstacles) {
                const box = new THREE.Box3().setFromObject(obstacle);
                const closestPoint = new THREE.Vector3();
                box.clampPoint(newPosition, closestPoint);
                
                if (newPosition.distanceTo(closestPoint) < playerRadius) {
                    return true;
                }
            }
            return false;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            resizeEspCanvas();
        }

        // --- Игровой цикл ---
        let prevTime = performance.now();
        function animate(time) {
            requestAnimationFrame(animate);

            if (isGameActive) {
                const delta = (time - prevTime) / 1000;

                gunGroup.position.z += (-0.5 - gunGroup.position.z) * 0.1;

                const moveVector = new THREE.Vector3();

                const sinYaw = Math.sin(yaw);
                const cosYaw = Math.cos(yaw);

                if (Math.abs(moveState.forward) > 0.05) {
                    moveVector.x -= sinYaw * moveState.forward * speed * delta;
                    moveVector.z -= cosYaw * moveState.forward * speed * delta;
                }

                if (Math.abs(moveState.right) > 0.05) {
                    moveVector.x += cosYaw * moveState.right * speed * delta;
                    moveVector.z -= sinYaw * moveState.right * speed * delta;
                }

                const nextPositionX = camera.position.clone().add(new THREE.Vector3(moveVector.x, 0, 0));
                if (!checkCollision(nextPositionX)) {
                    camera.position.x = nextPositionX.x;
                }

                const nextPositionZ = camera.position.clone().add(new THREE.Vector3(0, 0, moveVector.z));
                if (!checkCollision(nextPositionZ)) {
                    camera.position.z = nextPositionZ.z;
                }

                camera.position.y = 1.7;

                // Вызов обработки читов (ESP и Aim)
                processModFeatures();
            }

            prevTime = time;
            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
