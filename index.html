<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Standoff 2 - Sandstone 3D</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #d4a373;
            color: #fff;
        }

        /* --- Главное меню --- */
        #menu-screen {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: linear-gradient(135deg, #2b1e16 0%, #170d08 100%);
            z-index: 20;
        }

        .header { text-align: center; margin-top: 10px; }
        .header h1 {
            font-size: 2.2rem;
            color: #f4a261;
            text-shadow: 0 0 12px rgba(244, 162, 97, 0.6);
        }
        .header p { color: #e9c46a; font-size: 0.9rem; margin-top: 5px; }

        .gallery-container { width: 100%; max-width: 800px; }
        .screenshots {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        .screen-card {
            background: #3a281d;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #5a3e2e;
            text-align: center;
            font-size: 0.8rem;
            padding-bottom: 8px;
        }
        .screen-mockup {
            height: 90px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            color: #fff;
        }
        .mock-1 { background: linear-gradient(45deg, #e76f51, #f4a261); }
        .mock-2 { background: linear-gradient(45deg, #2a9d8f, #e9c46a); }
        .mock-3 { background: linear-gradient(45deg, #d4a373, #875c36); }

        .mode-selection {
            display: flex;
            gap: 15px;
            margin-bottom: 10px;
            width: 100%;
            max-width: 400px;
        }
        .btn {
            flex: 1;
            padding: 14px;
            font-size: 1rem;
            font-weight: bold;
            color: #170d08;
            background: #f4a261;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(244, 162, 97, 0.4);
        }
        .btn:active { transform: scale(0.98); }

        /* --- HUD --- */
        #game-hud {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: none;
            pointer-events: none;
            z-index: 5;
        }

        #crosshair {
            position: absolute;
            top: 50%; left: 50%;
            width: 10px; height: 10px;
            transform: translate(-50%, -50%);
        }
        #crosshair::before, #crosshair::after {
            content: ''; position: absolute; background: rgba(0, 255, 0, 0.85);
        }
        #crosshair::before { top: 4px; left: -8px; width: 26px; height: 2px; }
        #crosshair::after { top: -8px; left: 4px; width: 2px; height: 26px; }

        .hud-panel {
            position: absolute;
            top: 15px;
            background: rgba(20, 10, 5, 0.7);
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: bold;
            border: 1px solid rgba(244, 162, 97, 0.3);
        }
        #health-hud { left: 15px; color: #2a9d8f; }
        #score-hud { right: 15px; color: #f4a261; }

        #esp-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 4;
        }

        /* --- Мод Меню --- */
        #mod-container {
            position: absolute;
            top: 60px; left: 15px;
            z-index: 9999;
            pointer-events: auto;
        }

        #mod-toggle-btn {
            background: #9d4edd;
            color: #fff;
            border: 2px solid #fff;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(157, 78, 221, 0.8);
            display: block;
        }

        #mod-menu {
            margin-top: 10px;
            width: 250px;
            background: rgba(20, 15, 25, 0.96);
            border: 2px solid #9d4edd;
            border-radius: 12px;
            padding: 16px;
            display: none;
            flex-direction: column;
            gap: 14px;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.9);
        }
        #mod-menu h3 {
            color: #c77dff;
            font-size: 1.1rem;
            text-align: center;
            border-bottom: 1px solid #444;
            padding-bottom: 6px;
        }
        .mod-option {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.95rem;
            cursor: pointer;
        }
        .mod-option input[type="checkbox"] {
            width: 20px; height: 20px;
            accent-color: #9d4edd;
            cursor: pointer;
        }
        .slider-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 0.85rem;
        }
        .slider-group input[type="range"] {
            accent-color: #9d4edd;
            cursor: pointer;
        }

        /* --- Сенсор --- */
        #touch-controls {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: none;
            z-index: 10;
        }

        #joystick-zone {
            position: absolute;
            bottom: 30px; left: 30px;
            width: 130px; height: 130px;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
        }
        #joystick-stick {
            position: absolute;
            top: 40px; left: 40px;
            width: 50px; height: 50px;
            background: rgba(244, 162, 97, 0.9);
            border-radius: 50%;
        }

        #fire-btn {
            position: absolute;
            bottom: 40px; right: 40px;
            width: 80px; height: 80px;
            background: rgba(230, 57, 70, 0.85);
            border: 2px solid #fff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 0.9rem;
            box-shadow: 0 0 15px rgba(230, 57, 70, 0.5);
        }

        #touch-look-zone {
            position: absolute;
            top: 0; right: 0;
            width: 50%; height: 100%;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="menu-screen">
        <div class="header">
            <h1>SANDSTONE 3D</h1>
            <p>Standoff 2 Map Recreation</p>
        </div>

        <div class="gallery-container">
            <div class="screenshots">
                <div class="screen-card">
                    <div class="screen-mockup mock-1">PLANT A / B</div>
                    <p>Точки закладки</p>
                </div>
                <div class="screen-card">
                    <div class="screen-mockup mock-2">MID & ARCS</div>
                    <p>Песчаные арки</p>
                </div>
                <div class="screen-card">
                    <div class="screen-mockup mock-3">SAND TEXTURES</div>
                    <p>Стиль Sandstone</p>
                </div>
            </div>
        </div>

        <div class="mode-selection">
            <button class="btn" id="start-pc">ПК (Клавиатура + Мышь)</button>
            <button class="btn" id="start-mobile" style="background:#e9c46a;">Телефон (Сенсор)</button>
        </div>
    </div>

    <canvas id="esp-canvas"></canvas>

    <div id="game-hud">
        <div id="crosshair"></div>
        <div id="health-hud" class="hud-panel">+ 100</div>
        <div id="score-hud" class="hud-panel">УБИТО: <span id="score">0</span></div>
    </div>

    <div id="mod-container">
        <button id="mod-toggle-btn">⚙️ MOD MENU</button>
        <div id="mod-menu">
            <h3>DEV MOD MENU</h3>
            <label class="mod-option" for="esp-toggle">
                <span>Включить ESP</span>
                <input type="checkbox" id="esp-toggle">
            </label>
            <label class="mod-option" for="aim-toggle">
                <span>Включить AimBot</span>
                <input type="checkbox" id="aim-toggle">
            </label>
            <div class="slider-group">
                <label for="aim-fov">Размер круга Aim (FOV): <span id="fov-val">120</span>px</label>
                <input type="range" id="aim-fov" min="40" max="300" value="120">
            </div>
        </div>
    </div>

    <div id="touch-controls">
        <div id="touch-look-zone"></div>
        <div id="joystick-zone">
            <div id="joystick-stick"></div>
        </div>
        <div id="fire-btn">ОГОНЬ</div>
    </div>

    <script>
        let scene, camera, renderer;
        let targets = [], obstacles = [];
        let score = 0;
        let isGameActive = false, isMobileMode = false;

        const moveState = { forward: 0, right: 0 };
        const speed = 11.0;
        let pitch = 0, yaw = 0;

        let gunGroup, muzzleFlash;

        const modSettings = { esp: false, aim: false, aimFov: 120 };
        let espCanvas, espCtx;

        const menuScreen = document.getElementById('menu-screen');
        const gameHud = document.getElementById('game-hud');
        const touchControls = document.getElementById('touch-controls');
        const scoreEl = document.getElementById('score');

        // Материалы Sandstone
        let sandWallMat, darkSandMat, woodCrateMat, barrelMat, plasterMat;

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xbde0fe); // Небо
            scene.fog = new THREE.FogExp2(0xd4a373, 0.008);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            espCanvas = document.getElementById('esp-canvas');
            espCtx = espCanvas.getContext('2d');
            resizeEspCanvas();

            // Свет (Яркое солнечное освещение)
            const ambientLight = new THREE.AmbientLight(0xfff3b0, 0.7);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xffecd1, 1.1);
            sunLight.position.set(40, 60, 20);
            sunLight.castShadow = true;
            scene.add(sunLight);

            // Инициализация материалов
            sandWallMat = new THREE.MeshStandardMaterial({ color: 0xdd9255, roughness: 0.9 });
            darkSandMat = new THREE.MeshStandardMaterial({ color: 0xb56576, roughness: 0.8 });
            woodCrateMat = new THREE.MeshStandardMaterial({ color: 0x8b5e3c, roughness: 0.7 });
            barrelMat = new THREE.MeshStandardMaterial({ color: 0x52796f, roughness: 0.5 });
            plasterMat = new THREE.MeshStandardMaterial({ color: 0xf4f1de, roughness: 0.9 });

            createSandstoneMap();
            createGun();
            for (let i = 0; i < 7; i++) spawnTarget();

            window.addEventListener('resize', onWindowResize);

            document.getElementById('start-pc').addEventListener('click', () => {
                isMobileMode = false;
                document.body.requestPointerLock();
            });

            document.getElementById('start-mobile').addEventListener('click', () => {
                isMobileMode = true;
                startGame();
            });

            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);
            document.addEventListener('mousemove', onMouseMove);

            document.addEventListener('mousedown', (e) => {
                const modMenu = document.getElementById('mod-menu');
                if (!isMobileMode && isGameActive && modMenu.style.display !== 'flex') {
                    if (document.pointerLockElement !== document.body) {
                        document.body.requestPointerLock();
                    } else if (e.button === 0) {
                        shoot();
                    }
                }
            });

            document.addEventListener('pointerlockchange', () => {
                if (!isMobileMode && document.pointerLockElement === document.body) startGame();
            });

            setupModMenuUI();
            setupTouchControls();
            animate(0);
        }

        function resizeEspCanvas() {
            espCanvas.width = window.innerWidth;
            espCanvas.height = window.innerHeight;
        }

        // --- Создание карты Sandstone ---
        function createSandstoneMap() {
            obstacles = [];

            // Земля
            const floor = new THREE.Mesh(
                new THREE.PlaneGeometry(120, 120),
                new THREE.MeshStandardMaterial({ color: 0xd4a373, roughness: 0.95 })
            );
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            // Внешние стены
            createWall(0, 6, -60, 120, 12, 2, sandWallMat);
            createWall(0, 6, 60, 120, 12, 2, sandWallMat);
            createWall(-60, 6, 0, 2, 12, 120, sandWallMat);
            createWall(60, 6, 0, 2, 12, 120, sandWallMat);

            // --- MID (Центр карты) ---
            createWall(-10, 5, 0, 2, 10, 40, sandWallMat);
            createWall(10, 5, -5, 2, 10, 30, sandWallMat);

            // Арка на Миду
            createWall(0, 9, 15, 20, 3, 3, sandWallMat);

            // --- PLANT A (Справа) ---
            createWall(35, 5, -35, 30, 10, 2, plasterMat);
            createWall(20, 5, -45, 2, 10, 20, plasterMat);
            // Плент-платформа A
            const plantA = new THREE.Mesh(new THREE.BoxGeometry(12, 1.5, 12), sandWallMat);
            plantA.position.set(38, 0.75, -48);
            scene.add(plantA);
            obstacles.push(plantA);

            // --- PLANT B (Слева) ---
            createWall(-35, 5, 35, 25, 10, 2, darkSandMat);
            createWall(-22, 5, 45, 2, 10, 20, darkSandMat);
            // Плент-платформа B
            const plantB = new THREE.Mesh(new THREE.BoxGeometry(10, 1.5, 10), darkSandMat);
            plantB.position.set(-42, 0.75, 48);
            scene.add(plantB);
            obstacles.push(plantB);

            // --- Декорации и Ящики (Укрытия Sandstone) ---
            // Деревянные ящики A/B/Mid
            spawnCrate(36, 1.5, -46, 2.5, 3, 2.5);
            spawnCrate(39, 1.5, -46, 2.5, 3, 2.5);
            spawnCrate(37.5, 4.25, -46, 2.3, 2.5, 2.3);

            spawnCrate(-40, 1.5, 46, 3, 3, 3);
            spawnCrate(-43, 1.5, 46, 2.5, 2.5, 2.5);

            spawnCrate(0, 1.25, -10, 2.5, 2.5, 2.5);
            spawnCrate(-3, 1.25, -10, 2.5, 2.5, 2.5);
            spawnCrate(15, 1.25, 10, 2.5, 2.5, 2.5);

            // Бочки
            spawnBarrel(-5, 1.25, 5);
            spawnBarrel(32, 1.25, -38);
        }

        function createWall(x, y, z, w, h, d, mat) {
            const wall = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
            wall.position.set(x, y, z);
            wall.castShadow = true;
            wall.receiveShadow = true;
            scene.add(wall);
            obstacles.push(wall);
        }

        function spawnCrate(x, y, z, w, h, d) {
            const crate = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), woodCrateMat);
            crate.position.set(x, y, z);
            crate.castShadow = true;
            crate.receiveShadow = true;
            scene.add(crate);
            obstacles.push(crate);
        }

        function spawnBarrel(x, y, z) {
            const barrel = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 2.5, 12), barrelMat);
            barrel.position.set(x, y, z);
            barrel.castShadow = true;
            barrel.receiveShadow = true;
            scene.add(barrel);
            obstacles.push(barrel);
        }

        function createGun() {
            gunGroup = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.18, 0.7), new THREE.MeshStandardMaterial({ color: 0x222222 }));
            const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.4), new THREE.MeshStandardMaterial({ color: 0x111111 }));
            barrel.rotation.x = Math.PI / 2;
            barrel.position.set(0, 0.03, -0.45);

            muzzleFlash = new THREE.Mesh(new THREE.SphereGeometry(0.08, 8, 8), new THREE.MeshBasicMaterial({ color: 0xffaa00, transparent: true, opacity: 0 }));
            muzzleFlash.position.set(0, 0.03, -0.7);

            gunGroup.add(body, barrel, muzzleFlash);
            gunGroup.position.set(0.25, -0.25, -0.5);
            camera.add(gunGroup);
            scene.add(camera);
        }

        function spawnTarget() {
            const target = new THREE.Group();
            
            // Враг (Террорист / Спецназ)
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.4, 16, 16), new THREE.MeshStandardMaterial({ color: 0xd90429 }));
            head.position.y = 1.6;
            head.name = "head";

            const body = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.35, 1.2), new THREE.MeshStandardMaterial({ color: 0x2b2d42 }));
            body.position.y = 0.8;

            target.add(head, body);

            // Спавн в игровых зонах
            const spawnPoints = [
                { x: 38, z: -48 }, // A Plant
                { x: -42, z: 48 }, // B Plant
                { x: 0, z: -25 },   // Mid
                { x: 15, z: 20 },   // B Long
                { x: -25, z: -15 }, // A Short
                { x: -35, z: 15 },  // Dark
                { x: 30, z: -10 }   // CT Spawn
            ];

            const pt = spawnPoints[Math.floor(Math.random() * spawnPoints.length)];
            target.position.set(pt.x + (Math.random() - 0.5) * 6, 0, pt.z + (Math.random() - 0.5) * 6);
            
            scene.add(target);
            targets.push(target);
        }

        function shoot() {
            gunGroup.position.z = -0.4;
            muzzleFlash.material.opacity = 1;
            setTimeout(() => { muzzleFlash.material.opacity = 0; }, 50);

            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

            const meshes = [];
            targets.forEach(t => t.traverse(c => { if(c.isMesh) meshes.push(c); }));

            const intersects = raycaster.intersectObjects(meshes);
            if (intersects.length > 0) {
                const hitTarget = intersects[0].object.parent;
                scene.remove(hitTarget);
                targets = targets.filter(t => t !== hitTarget);
                score++;
                scoreEl.innerText = score;
                setTimeout(spawnTarget, 800);
            }
        }

        function toScreenPosition(obj, camera) {
            const vector = new THREE.Vector3();
            obj.getWorldPosition(vector);
            vector.project(camera);

            if (vector.z > 1) return { x: -1000, y: -1000, visible: false };

            const widthHalf = window.innerWidth / 2;
            const heightHalf = window.innerHeight / 2;

            return {
                x: (vector.x * widthHalf) + widthHalf,
                y: -(vector.y * heightHalf) + heightHalf,
                visible: true
            };
        }

        function processModFeatures() {
            espCtx.clearRect(0, 0, espCanvas.width, espCanvas.height);
            const screenCenter = { x: window.innerWidth / 2, y: window.innerHeight / 2 };

            if (modSettings.aim) {
                espCtx.beginPath();
                espCtx.arc(screenCenter.x, screenCenter.y, modSettings.aimFov, 0, Math.PI * 2);
                espCtx.strokeStyle = 'rgba(157, 78, 221, 0.7)';
                espCtx.lineWidth = 2;
                espCtx.stroke();
            }

            let bestTarget = null;
            let closestDist = Infinity;

            targets.forEach(target => {
                const head = target.getObjectByName("head");
                if (!head) return;

                const headPos = toScreenPosition(head, camera);
                const basePos = toScreenPosition(target, camera);

                if (!headPos.visible) return;

                const boxHeight = Math.abs(basePos.y - headPos.y) * 1.6;
                const boxWidth = boxHeight * 0.55;

                if (modSettings.esp) {
                    espCtx.strokeStyle = '#e63946';
                    espCtx.lineWidth = 2;
                    espCtx.strokeRect(headPos.x - boxWidth / 2, headPos.y - boxHeight * 0.15, boxWidth, boxHeight);

                    espCtx.beginPath();
                    espCtx.moveTo(screenCenter.x, 0);
                    espCtx.lineTo(headPos.x, headPos.y - boxHeight * 0.15);
                    espCtx.strokeStyle = 'rgba(230, 57, 70, 0.4)';
                    espCtx.stroke();
                }

                if (modSettings.aim) {
                    const dist = Math.hypot(headPos.x - screenCenter.x, headPos.y - screenCenter.y);
                    if (dist <= modSettings.aimFov && dist < closestDist) {
                        closestDist = dist;
                        bestTarget = head;
                    }
                }
            });

            if (modSettings.aim && bestTarget) {
                const headWorldPos = new THREE.Vector3();
                bestTarget.getWorldPosition(headWorldPos);

                const dir = headWorldPos.clone().sub(camera.position).normalize();
                const targetYaw = Math.atan2(-dir.x, -dir.z);
                const targetPitch = Math.asin(dir.y);

                yaw += (targetYaw - yaw) * 0.25;
                pitch += (targetPitch - pitch) * 0.25;
                applyRotation();
            }
        }

        function setupModMenuUI() {
            const modBtn = document.getElementById('mod-toggle-btn');
            const modMenu = document.getElementById('mod-menu');
            const modContainer = document.getElementById('mod-container');

            ['click', 'mousedown', 'touchstart', 'touchend'].forEach(evt => {
                modContainer.addEventListener(evt, (e) => e.stopPropagation());
            });

            modBtn.addEventListener('click', (e) => {
                e.preventDefault();
                e.stopPropagation();

                if (modMenu.style.display === 'flex') {
                    modMenu.style.display = 'none';
                    if (!isMobileMode) document.body.requestPointerLock();
                } else {
                    modMenu.style.display = 'flex';
                    if (!isMobileMode && document.pointerLockElement) document.exitPointerLock();
                }
            });

            document.getElementById('esp-toggle').addEventListener('change', (e) => modSettings.esp = e.target.checked);
            document.getElementById('aim-toggle').addEventListener('change', (e) => modSettings.aim = e.target.checked);
            document.getElementById('aim-fov').addEventListener('input', (e) => {
                modSettings.aimFov = parseInt(e.target.value);
                document.getElementById('fov-val').innerText = modSettings.aimFov;
            });
        }

        function startGame() {
            isGameActive = true;
            menuScreen.style.display = 'none';
            gameHud.style.display = 'block';
            if (isMobileMode) touchControls.style.display = 'block';
            camera.position.set(0, 1.7, 45); // Спавн T
        }

        const keys = {};
        function onKeyDown(e) { if(!isMobileMode) keys[e.code] = true; updateKeyboardMove(); }
        function onKeyUp(e) { if(!isMobileMode) keys[e.code] = false; updateKeyboardMove(); }
        function updateKeyboardMove() {
            moveState.forward = (keys['KeyW'] ? 1 : 0) - (keys['KeyS'] ? 1 : 0);
            moveState.right = (keys['KeyD'] ? 1 : 0) - (keys['KeyA'] ? 1 : 0);
        }

        function onMouseMove(e) {
            if (!isGameActive || isMobileMode || document.pointerLockElement !== document.body) return;
            yaw -= e.movementX * 0.002;
            pitch -= e.movementY * 0.002;
            applyRotation();
        }

        function applyRotation() {
            pitch = Math.max(-Math.PI / 2 + 0.1, Math.min(Math.PI / 2 - 0.1, pitch));
            camera.rotation.order = 'YXZ';
            camera.rotation.y = yaw;
            camera.rotation.x = pitch;
        }

        function setupTouchControls() {
            const joystickZone = document.getElementById('joystick-zone');
            const stick = document.getElementById('joystick-stick');
            const fireBtn = document.getElementById('fire-btn');
            const lookZone = document.getElementById('touch-look-zone');

            let joystickTouchId = null, lookTouchId = null;
            let lastLookX = 0, lastLookY = 0;

            joystickZone.addEventListener('touchstart', (e) => {
                const touch = e.changedTouches[0];
                joystickTouchId = touch.identifier;
                updateJoystick(touch);
            });

            window.addEventListener('touchmove', (e) => {
                for (let touch of e.changedTouches) {
                    if (touch.identifier === joystickTouchId) {
                        updateJoystick(touch);
                    } else if (touch.identifier === lookTouchId) {
                        const dx = touch.clientX - lastLookX;
                        const dy = touch.clientY - lastLookY;
                        yaw -= dx * 0.005;
                        pitch -= dy * 0.005;
                        applyRotation();
                        lastLookX = touch.clientX;
                        lastLookY = touch.clientY;
                    }
                }
            });

            window.addEventListener('touchend', (e) => {
                for (let touch of e.changedTouches) {
                    if (touch.identifier === joystickTouchId) {
                        joystickTouchId = null;
                        stick.style.left = '40px'; stick.style.top = '40px';
                        moveState.forward = 0; moveState.right = 0;
                    } else if (touch.identifier === lookTouchId) {
                        lookTouchId = null;
                    }
                }
            });

            function updateJoystick(touch) {
                const rect = joystickZone.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;

                let dx = touch.clientX - centerX;
                let dy = touch.clientY - centerY;
                const dist = Math.min(Math.hypot(dx, dy), 45);
                const angle = Math.atan2(dy, dx);

                const stickX = Math.cos(angle) * dist;
                const stickY = Math.sin(angle) * dist;

                stick.style.left = `${40 + stickX}px`;
                stick.style.top = `${40 + stickY}px`;

                moveState.forward = -stickY / 45;
                moveState.right = stickX / 45;
            }

            lookZone.addEventListener('touchstart', (e) => {
                const touch = e.changedTouches[0];
                lookTouchId = touch.identifier;
                lastLookX = touch.clientX;
                lastLookY = touch.clientY;
            });

            fireBtn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                if (isGameActive) shoot();
            });
        }

        function checkCollision(newPosition) {
            const playerRadius = 0.9;
            for (let obstacle of obstacles) {
                const box = new THREE.Box3().setFromObject(obstacle);
                const closestPoint = new THREE.Vector3();
                box.clampPoint(newPosition, closestPoint);
                if (newPosition.distanceTo(closestPoint) < playerRadius) return true;
            }
            return false;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            resizeEspCanvas();
        }

        let prevTime = performance.now();
        function animate(time) {
            requestAnimationFrame(animate);

            if (isGameActive) {
                const delta = (time - prevTime) / 1000;
                gunGroup.position.z += (-0.5 - gunGroup.position.z) * 0.1;

                const moveVector = new THREE.Vector3();
                const sinYaw = Math.sin(yaw);
                const cosYaw = Math.cos(yaw);

                if (Math.abs(moveState.forward) > 0.05) {
                    moveVector.x -= sinYaw * moveState.forward * speed * delta;
                    moveVector.z -= cosYaw * moveState.forward * speed * delta;
                }
                if (Math.abs(moveState.right) > 0.05) {
                    moveVector.x += cosYaw * moveState.right * speed * delta;
                    moveVector.z -= sinYaw * moveState.right * speed * delta;
                }

                const nextX = camera.position.clone().add(new THREE.Vector3(moveVector.x, 0, 0));
                if (!checkCollision(nextX)) camera.position.x = nextX.x;

                const nextZ = camera.position.clone().add(new THREE.Vector3(0, 0, moveVector.z));
                if (!checkCollision(nextZ)) camera.position.z = nextZ.z;

                camera.position.y = 1.7;
                processModFeatures();
            }

            prevTime = time;
            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
